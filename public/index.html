const goodsInputs = (prefix, values, attrs = '') => `<div class="goodsform">${RR.GOODS.map((g) => `<label><span><i class="swatch" style="background:${RR.GOOD_COLORS[g]}"></i>${GN(g)}</span><input type="number" min="0" class="w-sm" data-chg="${prefix}" data-good="${g}" value="${values[g] || ''}" ${attrs} aria-label="${GN(g)}"></label>`).join('')}</div>`;
const destName = (to) => { if (to.type === 'city') return cityName(to.id); if (to.type === 'depot') { const dp = Q.depotById(st(), to.id); return dp ? Q.depotName(dp) : `depot #${to.id}`; } return uname(to.id); };
const playerLabel = (id) => `<span class="pdot" style="background:${pcol(id)}"></span>${esc(pname(id))}`;

/* ---------- Flow ---------- */
TAB_RENDER.flow = function () {
  const S = st(), routes = visibleRoutes();
  const rows = routes.map((r) => {
    const est = Q.routeEstimate(S, r);
    const to = destName(r.to);
    return `<li style="display:block"><div><strong>#${r.id}</strong> ${esc(cityName(r.from))} → ${esc(to)}${r.partner != null ? ` <span class="tag brass">trade with ${esc(pname(r.owner === UI.me ? r.partner : r.owner))}</span>` : ''}</div>
      <div class="small">${r.rule === 'stock' ? 'Keep stocked: ' : 'Send per turn: '}${esc(fmtGoods(r.goods) || 'nothing set')}${Object.keys(r.back || {}).length ? `; back: ${esc(fmtGoods(r.back))}` : ''}</div>
      <div class="small muted">Capacity ${est.perTurn}/turn over ${est.len == null ? '?' : est.len} tiles, ${r.transports.length} transport${r.transports.length === 1 ? '' : 's'}. ${esc(r.status || '')}</div></li>`;
  }).join('');
  return `<div class="split"><div class="mapwrap">${mapBlock('flow')}<div class="maptools"><button class="btn small" data-act="zoom-flow" data-k="0.8">+</button><button class="btn small" data-act="zoom-flow" data-k="1.25">−</button><button class="btn small" data-act="fit" data-kind="flow">Whole map</button></div></div>
    <aside class="side"><h2>Resource flow</h2><p class="small muted">Each line runs from source to destination, colored by its first good. Dashed lines are trade routes still waiting for the partner, or goods coming back on a trade route.</p>
    <ul class="list">${rows || '<li class="muted">No routes yet. Set one up in the Supply tab.</li>'}</ul>
    <h3>Key</h3><div class="goodsgrid">${RR.GOODS.map((g) => `<div><span><i class="swatch" style="background:${RR.GOOD_COLORS[g]}"></i>${GN(g)}</span></div>`).join('')}</div></aside></div>`;
};

/* ---------- Supply ---------- */
function newRouteForm() {
  const c = Q.citiesOf(st(), UI.me)[0];
  return { id: null, from: c ? c.id : null, to: '', transports: [], rule: 'send', goods: {}, back: {}, priority: 'normal' };
}
TAB_RENDER.supply = function () {
  const S = st(), d = draft();
  if (!UI.routeEdit) UI.routeEdit = newRouteForm();
  const f = UI.routeEdit;
  const myCities = Q.citiesOf(S, UI.me);
  const myLog = Q.unitsOf(S, UI.me).filter((u) => UNI[u.type].role === 'logistic');
  const routes = visibleRoutes();
  const ops = d.routeOps;
  const routeRows = routes.map((r) => {
    const est = Q.routeEstimate(S, r), mine = r.owner === UI.me;
    const to = destName(r.to);
    const pendingOp = ops.find((o) => o.id === r.id);
    return `<tr><td class="n">#${r.id}</td><td>${esc(cityName(r.from))} → ${esc(to)}</td><td>${r.partner != null ? playerLabel(mine ? r.partner : r.owner) : '<span class="muted">Domestic</span>'}</td>
      <td class="small">${r.transports.map((id) => esc(uname(id))).join(', ') || '<span class="warn">none</span>'}</td>
      <td>${r.rule === 'stock' ? 'Keep stocked at' : 'Send per turn'}</td><td class="small">${esc(fmtGoods(r.goods) || '—')}${Object.keys(r.back || {}).length ? `<br><span class="muted">back: ${esc(fmtGoods(r.back))}</span>` : ''}</td>
      <td>${esc(r.priority)}</td><td class="n">${est.perTurn}</td><td class="small">${esc(r.status || '')}${r.endsTurn ? ` <span class="warn">closes turn ${r.endsTurn}</span>` : ''}${pendingOp ? ` <span class="tag brass">${pendingOp.op === 'remove' ? 'closing' : 'edited'} this turn</span>` : ''}</td>
      <td>${mine ? `<button class="btn small" data-act="route-edit" data-id="${r.id}">Edit</button> ` : ''}<button class="btn small danger" data-act="route-remove" data-id="${r.id}">Close</button></td></tr>`;
  }).join('');
  const newOps = ops.filter((o) => o.op === 'create').map((o, i) => `<tr><td class="muted">new</td><td>${esc(cityName(o.from))} → ${esc(destName(o.to))}</td><td colspan="7" class="small">${o.rule === 'stock' ? 'Keep stocked at' : 'Send per turn'} ${esc(fmtGoods(o.goods))}${Object.keys(o.back || {}).length ? `; asking ${esc(fmtGoods(o.back))}` : ''} with ${o.transports.length} transport(s)</td><td><button class="x" data-act="rm-op" data-idx="${ops.indexOf(o)}" aria-label="Remove">✕</button></td></tr>`).join('');

  // destination choices
  const toOpts = [
    `<optgroup label="Your cities">${myCities.filter((c) => c.id !== f.from).map((c) => `<option value="city:${c.id}" ${f.to === `city:${c.id}` ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>`,
    `<optgroup label="Your field supply units">${myLog.filter((u) => ['caravan', 'supplyTruck', 'train'].includes(u.type) && u.route == null).map((u) => `<option value="unit:${u.id}" ${f.to === `unit:${u.id}` ? 'selected' : ''}>${esc(Q.unitName(u))} at ${tl(u.t)}</option>`).join('')}</optgroup>`,
    `<optgroup label="Your field depots and settlements">${(S.depots || []).filter((dp) => dp.owner === UI.me).map((dp) => `<option value="depot:${dp.id}" ${f.to === `depot:${dp.id}` ? 'selected' : ''}>${esc(Q.depotName(dp))} at ${tl(dp.t)}</option>`).join('')}</optgroup>`,
    `<optgroup label="Trade with another nation">${S.cities.filter((c) => c.owner !== UI.me && !S.players[c.owner].eliminated).map((c) => `<option value="city:${c.id}" ${f.to === `city:${c.id}` ? 'selected' : ''}>${esc(c.name)} (${esc(pname(c.owner))})</option>`).join('')}</optgroup>`,
  ].join('');
  const toCity = f.to.startsWith('city:') ? Q.cityById(S, Number(f.to.slice(5))) : null;
  const trade = toCity && toCity.owner !== UI.me;
  const transportOpts = myLog.filter((u) => u.carriedBy == null && (u.route == null || u.route === f.id) && `unit:${u.id}` !== f.to).map((u) => `<label class="ck"><input type="checkbox" data-chg="rf-tr" value="${u.id}" ${f.transports.includes(u.id) ? 'checked' : ''}> ${esc(Q.unitName(u))} <span class="small muted">(${UNI[u.type].cargo} cargo, move ${UNI[u.type].move}, at ${tl(u.t)})</span></label>`).join('<br>');
  let preview = '';
  if (f.from != null && f.to) {
    const r = { id: f.id || 0, owner: UI.me, from: f.from, to: { type: f.to.split(':')[0], id: Number(f.to.split(':')[1]) }, partner: trade ? toCity.owner : null, transports: f.transports, rule: f.rule, goods: f.goods, back: f.back };
    const est = Q.routeEstimate(S, r);
    const want = Object.values(f.goods).reduce((a, b) => a + Number(b || 0), 0);
    preview = f.transports.length ? `<p class="${est.ok ? '' : 'warn'}">${est.ok ? `Capacity about <strong class="num">${est.perTurn}</strong> per turn over ${est.len} tiles.` : 'At least one transport has no open path between these points (terrain, rail or borders).'}${f.rule === 'send' && want > est.perTurn && est.ok ? ` <span class="warn">You ask for ${want}/turn, more than the capacity.</span>` : ''}</p>` : '<p class="muted small">Pick transports to see the capacity.</p>';
  }
  const unitRows = Q.unitsOf(S, UI.me).map((u) => {
    const mv = d.moves.find((m) => m.unit === u.id);
    const src = Q.supplySources(S, u).filter((s) => s.ref !== u).map(Q.sourceName);
    const up = Q.upkeepOf(S, u, mv ? mv.path.length - 1 : 0);
    const bad = (u.supply || '').startsWith('Out');
    return `<tr><td>${esc(Q.unitName(u))}</td><td>${tl(Q.posOf(S, u))}</td><td class="small">${esc(fmtGoods(up) || 'none (in base)')}</td><td class="small">${Q.inBase(S, u) ? 'In base' : src.length ? esc(src.join(', ')) : '<span class="warn">Nothing in range</span>'}</td><td class="small ${bad ? 'warn' : ''}">${esc(u.supply || '—')}</td><td class="small">${UNI[u.type].cargo ? esc(fmtGoods(u.cargo) || 'empty') : ''}</td></tr>`;
  }).join('');
  return `<div class="page"><h2>Supply</h2><p class="muted">Routes move goods automatically every turn until changed. Units inside a city's supply range draw upkeep from it; further out they draw from caravans, supply trucks or a stopped train within 2 tiles.</p>
    <h3>Routes</h3><div class="ledger"><table class="cards"><thead><tr><th class="n">#</th><th>From → to</th><th>Partner</th><th>Transports</th><th>Rule</th><th>Goods</th><th>Priority</th><th class="n">Cap/turn</th><th>Status</th><th></th></tr></thead><tbody>${routeRows}${newOps}${!routeRows && !newOps ? '<tr><td colspan="10" class="muted">No routes yet.</td></tr>' : ''}</tbody></table></div>
    <div class="cols" style="margin-top:16px"><div class="panel"><h3 style="margin-top:0">${f.id ? `Edit route #${f.id}` : 'New route'}</h3>
      <div class="row"><label>From <select data-chg="rf-from" ${f.id ? 'disabled' : ''}>${myCities.map((c) => `<option value="${c.id}" ${c.id === f.from ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label>To <select data-chg="rf-to" ${f.id ? 'disabled' : ''}><option value="">Choose…</option>${toOpts}</select></label></div>
      ${trade ? `<p class="small notice">This is a trade route with ${esc(pname(toCity.owner))}. They must accept it next turn; your transports carry goods both ways.</p>` : ''}
      <h4>Transports</h4><div class="small">${transportOpts || '<span class="muted">No free logistics units. Build caravans at stables, trains or supply trucks at a machinery workshop, or ships at a shipyard.</span>'}</div>
      <h4>Rule</h4><div class="row"><label class="ck"><input type="radio" name="rf-rule" data-chg="rf-rule" value="send" ${f.rule === 'send' ? 'checked' : ''}> Send an amount per turn</label><label class="ck"><input type="radio" name="rf-rule" data-chg="rf-rule" value="stock" ${f.rule === 'stock' ? 'checked' : ''}> Keep the destination stocked at</label></div>
      <h4>Goods sent</h4>${goodsInputs('rf-goods', f.goods)}
      ${trade ? `<h4>Goods you receive back (per turn)</h4>${goodsInputs('rf-back', f.back)}` : ''}
      <div class="row"><label>Priority <select data-chg="rf-prio">${['high', 'normal', 'low'].map((x) => `<option ${f.priority === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label></div>
      ${preview}
      <div class="row"><button class="btn primary" data-act="route-save" ${f.from == null || !f.to ? 'disabled' : ''}>${f.id ? 'Save changes' : 'Add route'}</button>${f.id ? '<button class="btn" data-act="route-new">New route instead</button>' : ''}</div></div>
      <div class="panel"><h3 style="margin-top:0">Load and unload by hand</h3><p class="small muted">Select a logistics unit standing in one of your cities on the Map tab to load or unload goods. Units waiting in a city:</p>
      <ul class="list">${myLog.filter((u) => Q.cityAt(S, u.t) && Q.cityAt(S, u.t).owner === UI.me && u.carriedBy == null).map((u) => `<li><button class="linkbtn" data-act="goto-unit" data-id="${u.id}">${esc(Q.unitName(u))}</button><span class="small">${esc(cityName(Q.cityAt(S, u.t).id))}, ${esc(fmtGoods(u.cargo) || 'empty')}</span></li>`).join('') || '<li class="muted">None</li>'}</ul>
      ${d.cargo.length ? `<h4>Queued transfers</h4><ul class="list">${d.cargo.map((c, i) => `<li>${esc(uname(c.unit))} ${c.amount > 0 ? 'loads' : 'unloads'} ${Math.abs(c.amount)} ${gl(c.good)}<button class="x" data-act="rm" data-list="cargo" data-idx="${i}">✕</button></li>`).join('')}</ul>` : ''}</div></div>
    <h3>Unit supply</h3><p class="small muted">Upkeep includes this turn's planned movement. "Last turn" is what happened at the end of the previous turn.</p>
    <div class="ledger"><table class="cards"><thead><tr><th>Unit</th><th>Tile</th><th>Upkeep this turn</th><th>Supplied from</th><th>Last turn</th><th>Cargo</th></tr></thead><tbody>${unitRows || '<tr><td colspan="6" class="muted">No units.</td></tr>'}</tbody></table></div></div>`;
};

/* ---------- Summary (the check-in view, mainly for phones) ---------- */
TAB_RENDER.today = function () {
  const S = st(), p = meP(), d = draft(), n = draftCount(d);
  const last = (S.reports[UI.me] || []).filter((r) => r.turn === S.turn - 1);
  const alert = last.filter((r) => ['shortfall', 'supply', 'conflict', 'combat', 'war'].includes(r.cat) && !/^Paid \d+ credits|repaired/.test(r.msg));
  const built = last.filter((r) => r.cat === 'construction' && /^Built /.test(r.msg));
  const market = last.filter((r) => r.cat === 'market');
  const wars = S.wars.filter((w) => w.a === UI.me || w.b === UI.me).map((w) => pname(w.a === UI.me ? w.b : w.a));
  const ults = (S.ultimatums || []).filter((u) => u.to === UI.me);
  const props = (S.proposals || []).filter((x) => x.to === UI.me && x.turn === S.turn && !x.answered);
  const qs = Q.citiesOf(S, UI.me).map((c) => { const l = queueOf(c.id); if (!l.length) return ''; const pv = queuePreview(c); return `<li><span><b>${esc(c.name)}</b>: ${l.length} queued. Next: ${esc(BLD[l[0].key].name)}</span><span class="small ${pv[0].state === 'ready' ? 'good' : 'muted'}">${esc(pv[0].text)}</span></li>`; }).filter(Boolean).join('');
  const li = (r) => `<li><span>${esc(r.msg)}</span></li>`;
  return `<div class="page today"><h2>Turn ${S.turn}</h2>
    <p class="muted">${['Spring', 'Summer', 'Autumn', 'Winter'][['spring', 'summer', 'autumn', 'winter'].indexOf(Q.seasonOf(S.turn))]}, year ${Q.yearOf(S.turn)}. ${isCampaign() ? esc(scheduleText()) + '.' : ''}</p>
    <div class="tiles">
      <div class="panel stat"><span class="muted small">Credits</span><b class="num">${p.credits}</b></div>
      <div class="panel stat"><span class="muted small">Manpower</span><b class="num">${n2(p.manpower)}</b></div>
      <div class="panel stat"><span class="muted small">Science</span><b class="num">${p.science}</b></div>
      <div class="panel stat"><span class="muted small">Orders</span><b class="num">${n}</b><span class="small ${submitted(UI.me) ? 'good' : 'warn'}">${submitted(UI.me) ? 'submitted' : 'not submitted'}</span></div>
    </div>
    ${canPlay() ? `<div class="row"><button class="btn primary" data-act="submit" ${S.gameOver || p.eliminated ? 'disabled' : ''}>${submitted(UI.me) ? 'Resubmit orders' : 'Submit orders'} (${n})</button><button class="btn" data-act="tab" data-tab="orders">Review orders</button></div>` : ''}
    ${ults.length || props.length || wars.length ? `<div class="panel"><h3 style="margin-top:0">Diplomacy</h3><ul class="list">
      ${ults.map((u) => `<li><span class="warn">Ultimatum from ${esc(pname(u.from))}: war on turn ${u.deadline} unless you accept</span><button class="btn small" data-act="tab" data-tab="diplomacy">Answer</button></li>`).join('')}
      ${props.length ? `<li><span>${props.length} proposal${props.length > 1 ? 's' : ''} waiting for your answer</span><button class="btn small" data-act="tab" data-tab="diplomacy">Answer</button></li>` : ''}
      ${wars.length ? `<li><span>At war with ${esc(wars.join(', '))}</span><button class="btn small" data-act="tab" data-tab="war">War tab</button></li>` : ''}</ul></div>` : ''}
    <div class="panel"><h3 style="margin-top:0">Needs attention <span class="small muted">from last turn</span></h3><ul class="list">${alert.slice(0, 8).map(li).join('') || '<li class="muted">Nothing went wrong last turn.</li>'}</ul>
      ${alert.length > 8 ? `<p class="small muted">And ${alert.length - 8} more.</p>` : ''}<button class="btn small" data-act="tab" data-tab="reports">All reports</button></div>
    <div class="panel"><h3 style="margin-top:0">Building queues</h3>${built.length ? `<ul class="list">${built.slice(0, 6).map(li).join('')}</ul>` : ''}
      <ul class="list">${qs || '<li class="muted">No buildings queued. Open a city on the map and use Queue.</li>'}</ul><button class="btn small" data-act="tab" data-tab="buildings">Manage queues</button></div>
    <div class="panel"><h3 style="margin-top:0">Market</h3><p class="small">${standing('recurring').length} recurring order${standing('recurring').length === 1 ? '' : 's'} running.</p>${market.length ? `<ul class="list">${market.slice(0, 6).map(li).join('')}</ul>` : ''}<button class="btn small" data-act="tab" data-tab="market">Market</button></div>
  </div>`;
};

/* ---------- Stockpiles ---------- */
TAB_RENDER.stock = function () {
  const S = st(), p = meP();
  const cities = Q.citiesOf(S, UI.me);
  const head = `<tr><th>Location</th>${RR.GOODS.map((g) => `<th class="n">${GN(g)}</th>`).join('')}</tr>`;
  const cityRows = cities.map((c) => `<tr><td><button class="linkbtn" data-act="goto" data-t="${c.t}">${esc(c.name)}</button></td>${RR.GOODS.map((g) => { const v = amt(c.stock[g]), cap = Q.capacity(S, c, g); return `<td class="n ${v >= cap ? 'full' : v >= cap * 0.9 ? 'near' : ''}">${v}<span class="muted small">/${cap}</span></td>`; }).join('')}</tr>`).join('');
  const units = Q.unitsOf(S, UI.me).filter((u) => UNI[u.type].cargo);
  const unitRows = units.map((u) => `<tr><td><button class="linkbtn" data-act="goto-unit" data-id="${u.id}">${esc(Q.unitName(u))}</button> <span class="small muted">${tl(Q.posOf(S, u))}, ${amt(Q.cargoUsed(u))}/${Q.cargoCap(S, u)}</span></td>${RR.GOODS.map((g) => `<td class="n">${amt(u.cargo[g]) || ''}</td>`).join('')}</tr>`).join('');
  const tot = {}; for (const c of cities) for (const g of RR.GOODS) tot[g] = (tot[g] || 0) + (c.stock[g] || 0); for (const u of units) for (const g of RR.GOODS) tot[g] = (tot[g] || 0) + (u.cargo[g] || 0);
  return `<div class="page"><h2>Stockpiles</h2><p class="muted">Credits, manpower and science belong to the whole nation. Every other good sits in a city or a logistics unit and only moves by transport. Amounts show stock/capacity.</p>
    <div class="row" style="gap:24px;margin:10px 0 14px"><span>Credits <b class="num" style="font-size:1.3rem">${p.credits}</b></span><span>Manpower <b class="num" style="font-size:1.3rem">${p.manpower}</b></span><span>Science <b class="num" style="font-size:1.3rem">${p.science}</b></span></div>
    <div class="ledger"><table class="cards"><thead>${head}</thead><tbody>${cityRows ? `<tr class="sub"><td colspan="${RR.GOODS.length + 1}">Cities</td></tr>${cityRows}` : ''}${unitRows ? `<tr class="sub"><td colspan="${RR.GOODS.length + 1}">Logistics units</td></tr>${unitRows}` : ''}
    <tr class="sub"><td>Total</td>${RR.GOODS.map((g) => `<td class="n">${amt(tot[g])}</td>`).join('')}</tr></tbody></table></div>
    ${minimumsBlock(S, cities)}</div>`;
};
function minimumsBlock(S, cities) {
  const keep = standing('keep'), ids = cityOrderIds();
  const rows = cities.map((c) => `<tr><td>${esc(c.name)}</td>${RR.GOODS.map((g) => `<td class="n"><input type="number" min="0" step="1" class="w-sm" data-chg="keep" data-city="${c.id}" data-good="${g}" value="${(keep[c.id] && keep[c.id][g]) || ''}" placeholder="0" aria-label="${esc(c.name)}: keep at least this much ${gl(g)}"></td>`).join('')}</tr>`).join('');
  return `<h3 id="minimums">Minimums for standing orders</h3>
    <p class="muted">Building queues never use these amounts, and recurring market sales never sell below them. Buildings you order directly for this turn can still use them. Changes take effect when you submit your orders.</p>
    <div class="cols"><div class="panel"><h4 style="margin-top:0">For the whole nation</h4>
      <label class="row">Keep at least <input type="number" min="0" step="1" data-chg="keep-nat" data-k="keepManpower" value="${Number(standing('keepManpower')) || ''}" placeholder="0" aria-label="Minimum manpower"> manpower</label>
      <p class="small muted">Building queues will not spend it. The army draws its manpower before the queues run, so it is always served first.</p>
      <label class="row">Keep at least <input type="number" min="0" step="50" data-chg="keep-nat" data-k="keepCredits" value="${Number(standing('keepCredits')) || ''}" placeholder="0" style="width:100px" aria-label="Minimum credits"> credits</label>
      <p class="small muted">Recurring purchases will not spend it, and they also leave enough for next turn's military pay (buildings cost no credits).</p></div>
    <div class="panel"><h4 style="margin-top:0">City order</h4><p class="small muted">When manpower is short, cities higher on this list run their building queues first.</p>
      <ol class="list prio">${ids.map((id, i) => `<li class="row" style="margin:0;justify-content:space-between"><span><span class="num muted">${i + 1}.</span> ${esc(cityName(id))}</span><span><button class="btn small" data-act="co-move" data-idx="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button> <button class="btn small" data-act="co-move" data-idx="${i}" data-dir="1" ${i === ids.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button></span></li>`).join('')}</ol></div></div>
    <h4>Minimum stock in each city</h4>
    <div class="ledger"><table class="cards"><thead><tr><th>City</th>${RR.GOODS.map((g) => `<th class="n">${GN(g)}</th>`).join('')}</tr></thead><tbody>${rows || `<tr><td colspan="${RR.GOODS.length + 1}" class="muted">No cities.</td></tr>`}</tbody></table></div>`;
}

/* ---------- Buildings ---------- */
TAB_RENDER.buildings = function () {
  const S = st();
  const blocks = Q.citiesOf(S, UI.me).map((c) => {
    const blds = Q.cityBuildings(S, c.id).sort((a, b) => a.key.localeCompare(b.key));
    const rails = S.map.tiles.filter((t) => t.owner === c.id && t.rail != null).length;
    const bridges = S.map.tiles.filter((t) => t.owner === c.id && t.bridge).length;
    const traps = S.map.tiles.filter((t) => t.owner === c.id && t.trap === UI.me).length;
    const effect = (b) => {
      const d = BLD[b.key];
      if (d.recipes) { const rc = Q.recipeOf(b), out = Q.buildingOutput(S, b); return `${fmtGoods(Q.inputsOf(b, S)) || 'no inputs'} → ${fmtGoods(out) || [rc.mpOut ? `${Q.mpOutOf(S, b)} manpower` : '', rc.sciOut ? `${Q.sciOutOf(S, b)} science` : '', Q.creditsOutOf(S, b) || rc.creditsPerResidence ? `${Q.creditsOutOf(S, b)} credits${rc.creditsPerResidence ? ` (${rc.creditsPerResidence} per working residence)` : ''}` : ''].filter(Boolean).join(', ')}`; }
      if (d.storage) return `Stores ${fmtGoods(d.storage)}`;
      if (d.storageAll) return `Stores +${d.storageAll} of every good except food and fuel${d.supplyBonus ? '; +1 supply range' : ''}`;
      if (d.builds) return `Builds ${d.builds.map((k) => UNI[k].name.toLowerCase()).join(', ')}`;
      if (d.dock) return d.dock === 'sail' ? 'Docks sailing ships' : 'Docks all ships';
      if (d.hp) return `+${d.hp} city HP${d.weapon ? ', fires at range 2' : ''}`;
      if (d.territoryBonus) return 'Territory 3 tiles';
      return '';
    };
    return `<div class="ledger"><table class="cards"><thead><tr><th colspan="4">${esc(c.name)} <span class="muted small">HP ${c.hp}/${Q.maxHp(S, c)}, territory ${Q.territoryRadius(S, c)}, supply range ${Q.supplyRadius(S, c)}</span></th></tr>
      <tr><th>Building</th><th>Where</th><th>Does</th><th>Last turn</th></tr></thead><tbody>
      ${blds.map((b) => `<tr><td>${esc(BLD[b.key].name)}</td><td>${BLD[b.key].place === 'tile' ? `<button class="linkbtn" data-act="goto" data-t="${b.t}">${esc(RR.TILES[S.map.tiles[b.t].type].name)} ${tl(b.t)}</button>` : 'City'}</td><td class="small">${esc(effect(b))}</td><td class="small ${b.status && b.status.startsWith('Idle') ? 'warn' : 'muted'}">${esc(b.status || '')}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No buildings yet.</td></tr>'}
      ${rails || bridges || traps ? `<tr class="sub"><td colspan="4">Infrastructure in territory: ${rails} railroad tile${rails === 1 ? '' : 's'}, ${bridges} bridge${bridges === 1 ? '' : 's'}${traps ? `, ${traps} tank trap${traps === 1 ? '' : 's'}` : ''}</td></tr>` : ''}
      </tbody></table></div>`;
  }).join('');
  const queues = Q.citiesOf(S, UI.me).map((c) => `<div class="panel side-like"><h4 style="margin-top:0">${esc(c.name)}</h4>${queuePanel(c, true)}</div>`).join('');
  return `<div class="page"><h2>Buildings</h2>
    <h3 style="margin-top:4px">Building queues</h3><p class="muted">Each city builds its queue in order whenever it can afford it, at the end of the turn after the army has drawn its manpower and been paid. A building it cannot afford waits and the city moves on, unless the building is marked <b>Save for</b>, which holds everything below it. Queues never use the minimums set on the <button class="linkbtn" data-act="tab" data-tab="stock">Stockpiles tab</button>. Add buildings with the Queue buttons in a city's build list on the map. Changes take effect when you submit your orders.</p>
    <div class="cols">${queues || '<p class="muted">You have no cities.</p>'}</div>
    <h3>Buildings by city</h3>${blocks || '<p class="muted">You have no cities.</p>'}</div>`;
};

/* ---------- Production ---------- */
TAB_RENDER.production = function () {
  const S = st(), p = meP(), st0 = settings();
  const prio = st0.priority || p.priority;
  const products = st0.products || {};
  const halts = st0.halt || {};
  const labors = (draft().settings && draft().settings.labor) || {};
  const fuels = (draft().settings && draft().settings.fuel) || {};
  const isHalted = (b) => (halts[b.id] != null ? !!halts[b.id] : !!b.halted);
  const usedKeys = new Set(S.buildings.filter((b) => Q.buildingOwner(S, b) === UI.me && BLD[b.key].recipes).map((b) => b.key));
  const prioList = prio.filter((k) => usedKeys.has(k)).map((k, i, arr) => `<li class="row" style="margin:0;justify-content:space-between"><span><span class="num muted">${i + 1}.</span> ${esc(BLD[k].short || BLD[k].name)}</span><span><button class="btn small" data-act="prio" data-key="${k}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button> <button class="btn small" data-act="prio" data-key="${k}" data-dir="1" ${i === arr.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button></span></li>`).join('');
  const blocks = Q.citiesOf(S, UI.me).map((c) => {
    const lines = Q.cityBuildings(S, c.id).filter((b) => BLD[b.key].recipes).sort((a, b) => prio.indexOf(a.key) - prio.indexOf(b.key));
    const totIn = {}, totOut = {}; let mp = 0, mpOut = 0, cr = 0, crOut = 0, sci = 0;
    const rows = lines.map((b) => {
      const d = BLD[b.key], keys = Object.keys(d.recipes);
      const cur = products[b.id] || Q.recipeKey(b);
      const bp = Object.assign({}, b, { product: cur }); // preview the product chosen this turn
      const rc = d.recipes[cur], out = Q.buildingOutput(S, bp), ins = Q.inputsOf(bp, S), runCr = Q.runCreditsOf(S, bp), sciO = Q.sciOutOf(S, bp), maxL = Q.maxLaborOf(S, bp);
      const off = isHalted(b);
      const labor = rc.labor ? (labors[b.id] != null ? labors[b.id] : Q.laborOf(b, S)) : 0;
      const credOut = rc.labor ? Math.round(labor * Q.perWorkerOf(S, bp)) : Q.creditsOutOf(S, b);
      const mpUse = rc.labor ? labor : Q.mpOf(S, bp);
      const mpMade = rc.mpOut ? Q.mpOutOf(S, b) : 0;
      if (!off) {
        for (const [g, v] of Object.entries(ins)) totIn[g] = (totIn[g] || 0) + v;
        for (const [g, v] of Object.entries(out)) totOut[g] = (totOut[g] || 0) + v;
        mp += mpUse; mpOut += mpMade; cr += runCr; crOut += credOut; sci += sciO;
      }
      const sel = keys.length > 1 ? `<select data-chg="product" data-id="${b.id}" aria-label="Product">${keys.map((k) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${GN(k) || k}</option>`).join('')}</select>` : '';
      const outs = [fmtGoods(out), mpMade ? `${n2(mpMade)} manpower` : '', sciO ? `${n2(sciO)} science` : '', credOut || rc.creditsPerResidence || rc.labor ? `${credOut} credits${rc.creditsPerResidence ? ` (${rc.creditsPerResidence} × residences)` : rc.labor ? ` (${Math.round(Q.perWorkerOf(S, bp))} per worker, up to ${maxL})` : ''}` : ''].filter(Boolean).join(', ');
      const fuelPend = fuels[b.id] != null ? fuels[b.id] : b.fuelOn !== false;
      const toggle = `<label class="ck small"><input type="checkbox" data-chg="halt" data-id="${b.id}" ${off ? '' : 'checked'}> On</label>${d.fuelUse ? `<br><label class="ck small" title="1 fuel a turn: +100% instead of +50%"><input type="checkbox" data-chg="fuel" data-id="${b.id}" ${fuelPend ? 'checked' : ''}> Fuel</label>` : ''}`;
      return `<tr class="${off ? 'muted' : ''}"><td>${toggle}</td><td>${esc(d.short || d.name)}${d.place === 'tile' ? ` <span class="small muted">${tl(b.t)}</span>` : ''}</td><td>${sel}</td><td class="small">${esc(fmtGoods(ins) || '—')}${runCr ? `${Object.keys(ins).length ? ', ' : ''}${n2(runCr)} credits` : ''}</td><td class="small">${esc(outs)}</td><td class="n">${rc.labor ? `<input type="number" min="0" max="${maxL === Infinity ? '' : maxL}" step="1" class="w-sm" data-chg="labor" data-id="${b.id}" value="${labor}" aria-label="Workers" title="Manpower put to work each turn${maxL !== Infinity ? ` (up to ${rc.maxLabor})` : ''}" style="width:64px">` : n2(mpUse)}</td><td class="small ${b.status && b.status.startsWith('Idle') ? 'warn' : 'muted'}">${esc(off ? (b.halted ? 'Halted' : 'Halts this turn') : b.halted ? 'Restarts this turn' : (b.status || 'New'))}</td></tr>`;
    }).join('');
    return `<div class="ledger"><table class="cards"><thead><tr><th colspan="7">${esc(c.name)}</th></tr><tr><th>Running</th><th>Production line</th><th>Making</th><th>Uses per turn</th><th>Makes per turn</th><th class="n">Manpower</th><th>Last turn</th></tr></thead><tbody>
      ${rows || '<tr><td colspan="7" class="muted">No production buildings yet.</td></tr>'}
      ${rows ? `<tr class="sub"><td colspan="3">If every line that is on runs</td><td class="small">${esc(fmtGoods(totIn) || '—')}${cr ? `, ${n2(cr)} credits` : ''}</td><td class="small">${esc([fmtGoods(totOut), mpOut ? `${n2(mpOut)} manpower` : '', sci ? `${n2(sci)} science` : '', crOut ? `${n2(crOut)} credits` : ''].filter(Boolean).join(', '))}</td><td class="n">${n2(mp)}</td><td></td></tr>` : ''}</tbody></table></div>`;
  }).join('');
  return `<div class="page"><h2>Production</h2><p class="muted">Untick a line to halt it: it uses no manpower or inputs and makes nothing until you switch it back on.</p><div class="cols" style="grid-template-columns: 1fr 300px">
    <div>${blocks}</div>
    <div class="panel"><h3 style="margin-top:0">Priority</h3><p class="small muted">When manpower or inputs run short, buildings lower on this list stop first. Changes apply when the turn resolves.</p><ol class="list prio">${prioList || '<li class="muted">Build something first.</li>'}</ol></div></div></div>`;
};

/* ---------- Research ---------- */
TAB_RENDER.research = function () {
  const S = st(), p = meP(), d = draft();
  const queuedCost = d.research.reduce((a, k) => a + (BLD[k] ? BLD[k].sci : RR.DOCTRINES[k] ? RR.DOCTRINES[k].sci : 0), 0);
  const docs = Object.entries(RR.DOCTRINES).map(([k, dd]) => {
    const res = p.researched.includes(k), q = d.research.includes(k);
    return `<tr><td>${esc(dd.name)} <span class="small muted">${esc(RR.DOCTRINE_GROUPS[dd.group])}</span><div class="small muted">${esc(dd.text)}</div></td><td class="n">${dd.sci}</td><td>${res ? '<span class="tag ok">Researched</span>' : `<label class="ck"><input type="checkbox" data-chg="research" value="${k}" ${q ? 'checked' : ''}> Research</label>`}</td></tr>`;
  }).join('');
  const eras = [1, 2, 3].map((era) => {
    const rows = Object.entries(BLD).filter(([, b]) => b.era === era).sort((a, b) => a[1].sci - b[1].sci).map(([k, b]) => {
      const free = b.sci === 0, res = p.researched.includes(k), bp = p.blueprints.includes(k), q = d.research.includes(k);
      const units = Object.entries(UNI).filter(([, u]) => u.unlock === k).map(([, u]) => u.name).join(', ');
      const status = free ? '<span class="tag">Start</span>' : res ? '<span class="tag ok">Researched</span>' : bp ? '<span class="tag ok">Blueprint</span>' : `<label class="ck"><input type="checkbox" data-chg="research" value="${k}" ${q ? 'checked' : ''}> Research</label>`;
      return `<tr><td>${esc(b.name)}</td><td class="n">${b.sci}</td><td class="small">${esc(units)}</td><td>${status}</td></tr>`;
    }).join('');
    return `<div class="ledger"><table class="cards"><thead><tr><th colspan="4">Era ${era}: ${RR.ERA_NAMES[era]}</th></tr><tr><th>Building</th><th class="n">Science</th><th>Unlocks units</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  const sellable = p.researched.filter((k) => BLD[k]);
  const myDesigns = (S.designs || []).filter((dz) => dz.owner === UI.me);
  const others = activePlayers().filter((x) => x.id !== UI.me);
  const offers = d.diplo.filter((o) => o.type === 'propose' && o.kind === 'blueprint');
  return `<div class="page"><h2>Research</h2><p class="muted">Universities turn 6 manpower and 500 credits into 1 science each turn; research facilities turn 12 manpower and 1,000 credits into 3. Research any building in any order; later eras cost more. Science is never lost.</p>
    <div class="row" style="gap:24px"><span>Science available <b class="num" style="font-size:1.3rem">${p.science}</b></span><span>Queued this turn <b class="num ${queuedCost > p.science ? 'warn' : ''}" style="font-size:1.3rem">${queuedCost}</b></span></div>
    <div class="cols" style="margin-top:12px"><div>${eras}<div class="ledger"><table class="cards"><thead><tr><th colspan="3">Military doctrines (choose them on the War tab)</th></tr><tr><th>Doctrine</th><th class="n">Science</th><th></th></tr></thead><tbody>${docs}</tbody></table></div></div>
    <div class="panel"><h3 style="margin-top:0">Sell a blueprint</h3><p class="small muted">Only buildings you researched yourself, and unit designs you created, can be sold. The buyer accepts next turn and pays on acceptance.</p>
      ${(sellable.length || myDesigns.length) && others.length ? `<div class="row"><select id="bp-key" aria-label="Blueprint">${sellable.map((k) => `<option value="${k}">${esc(BLD[k].name)}</option>`).join('')}${myDesigns.map((dz) => `<option value="design:${dz.id}">${esc(dz.name)} (${esc(UNI[dz.base].name.toLowerCase())} design)</option>`).join('')}</select><select id="bp-to" aria-label="Buyer">${others.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input type="number" id="bp-price" min="0" value="200" aria-label="Price in credits"><button class="btn small" data-act="bp-offer">Offer</button></div>` : '<p class="small muted">Nothing to sell yet.</p>'}
      ${offers.length ? `<ul class="list">${offers.map((o) => `<li>${esc(o.payload.design != null ? `${(Q.designById(S, o.payload.design) || {}).name || 'Design'} design` : BLD[o.payload.key].name)} to ${esc(pname(o.to))} for ${o.payload.price}<button class="x" data-act="rm" data-list="diplo" data-idx="${d.diplo.indexOf(o)}">✕</button></li>`).join('')}</ul>` : ''}
      <h4>Bought blueprints</h4><p class="small">${[...p.blueprints.map((k) => esc(BLD[k].name)), ...(p.designBlueprints || []).map((id) => { const dz = Q.designById(S, id); return dz ? `${esc(dz.name)} design` : ''; })].filter(Boolean).join(', ') || '<span class="muted">None</span>'}</p></div></div></div>`;
};

/* ---------- Market ---------- */
TAB_RENDER.market = function () {
  const S = st(), p = meP(), d = draft();
  const cities = Q.citiesOf(S, UI.me);
  if (!cities.find((c) => c.id === UI.marketCity)) UI.marketCity = cities[0] ? cities[0].id : null;
  const c = Q.cityById(S, UI.marketCity);
  const blocked = false;
  const rows = RR.GOODS.map((g) => {
    const pr = S.market.prices[g] || { sell: RR.BASE_PRICE[g], pays: Math.round(RR.BASE_PRICE[g] * 0.8), pool: 0, world: 0, r: 0 };
    return `<tr><td><i class="swatch" style="background:${RR.GOOD_COLORS[g]}"></i>${GN(g)}</td><td class="n">${RR.BASE_PRICE[g]}</td><td class="n"><strong>${pr.sell}</strong></td><td class="n">${S.market.prices[g] ? Q.sellPriceFor(S, UI.me, g) : pr.pays}</td><td class="n">${n2(pr.pool)}</td><td class="n">${n2(pr.world)}</td><td class="n">${Math.round(pr.r * 100)}%</td><td class="n small">${(S.market.last || {})[g] ? `${n2(S.market.last[g].qty)} at ${n2(S.market.last[g].avg)}${S.market.last[g].high > S.market.last[g].avg ? ` (top ${S.market.last[g].high})` : ''}` : '<span class="muted">—</span>'}</td>
      <td>${c ? `<span class="small muted">${amt(c.stock[g])}</span>` : ''}</td>
      <td><div class="row" style="margin:0;flex-wrap:nowrap"><input type="number" min="1" class="w-sm" id="mk-${g}" value="10" aria-label="${GN(g)} amount"><input type="number" min="${pr.sell}" max="${RR.BASE_PRICE[g] * RR.MARKET.maxBidX}" class="w-sm" id="mkb-${g}" placeholder="max price" title="Optional: the most you will pay per unit if other nations bid for the same supply" aria-label="${GN(g)} maximum price per unit"><button class="btn small" data-act="buy" data-good="${g}" ${!c || blocked || !pr.pool ? 'disabled' : ''}>Buy</button><button class="btn small" data-act="sell" data-good="${g}" ${!c || blocked ? 'disabled' : ''}>Sell</button></div></td></tr>`;
  }).join('');
  const lines = [...d.buys.map((o, i) => ['buys', i, o.maxPrice ? `Buy ${o.amount} ${gl(o.good)} for ${cityName(o.city)}, bidding up to ${o.maxPrice} each (at most ${o.amount * o.maxPrice} credits)` : `Buy ${o.amount} ${gl(o.good)} for ${cityName(o.city)} at the market price (about ${o.amount * (S.market.prices[o.good] || {}).sell} credits)`]), ...d.sells.map((o, i) => ['sells', i, `Sell ${o.amount} ${gl(o.good)} from ${cityName(o.city)} (about ${o.amount * (S.market.prices[o.good] || {}).pays} credits)`])];
  return `<div class="page"><h2>Global market</h2><p class="muted">The market holds what players sell to it, plus ${Math.round(RR.MARKET.trickle * 100)}% of everything the world produces each turn (taken from no one). Its price for a good falls as more of the world's supply sits in the market: price = base ÷ (1 + 4 × share). It pays sellers 80% of its selling price. No transport is needed; goods arrive in the city you choose. Buys fill before sells, and prices hold for the whole turn.</p>
    <p class="small muted"><b>Bidding.</b> When several nations order more of a good than the market holds, it is auctioned. You may set a maximum price per unit (up to ${RR.MARKET.maxBidX}× base); without one you bid the market price. Higher bids fill first, and each buyer pays 1 credit more than the best bid that was left short, never more than its own bid. If there is enough for everyone, everyone pays the market price. Bids are secret; last turn's results are shown in "Last turn".</p>
    <div class="row"><label>Deliver to and sell from <select data-chg="mk-city">${cities.map((x) => `<option value="${x.id}" ${x.id === UI.marketCity ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label><span class="small muted">Credits: <b class="num">${p.credits}</b></span></div>
    <div class="ledger"><table class="cards"><thead><tr><th>Good</th><th class="n">Base</th><th class="n">Market sells at</th><th class="n">Market pays</th><th class="n">In market</th><th class="n">World total</th><th class="n">Share</th><th class="n">Last turn</th><th>In city</th><th>Order</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${S.market.lastTrickle && Object.keys(S.market.lastTrickle).length ? `<p class="small muted">Added to the market from last turn's world production: ${esc(fmtGoods(S.market.lastTrickle))}.</p>` : ''}
    ${recurringPanel(S, cities)}
    <h3>This turn's market orders</h3><ul class="list">${lines.map(([l, i, t]) => `<li>${esc(t)}<button class="x" data-act="rm" data-list="${l}" data-idx="${i}">✕</button></li>`).join('') || '<li class="muted">None</li>'}</ul></div>`;
};


function recurringPanel(S, cities) {
  const list = standing('recurring'), f = recForm();
  const desc = (o) => {
    const g = gl(o.good), c = esc(cityName(o.city));
    const what = o.side === 'buy' ? (o.mode === 'topup' ? `Keep ${c}'s ${g} at ${o.amount} or more by buying` : `Buy ${o.amount} ${g} for ${c} every turn`) : (o.mode === 'surplus' ? `Sell all ${g} above ${o.amount} from ${c}` : `Sell ${o.amount} ${g} from ${c} every turn`);
    return `${what}${o.price ? (o.side === 'buy' ? `, paying at most ${o.price} each` : `, only if the market pays ${o.price} or more`) : ''}${o.until ? `, until turn ${o.until}` : ''}`;
  };
  const modes = f.side === 'buy' ? [['fixed', 'a fixed amount every turn'], ['topup', 'enough to keep the city at']] : [['fixed', 'a fixed amount every turn'], ['surplus', 'everything above']];
  return `<h3>Recurring orders <span class="small muted">${list.length} / ${RR.RECURRING.max}</span></h3>
    <p class="small muted">These repeat every turn, even when you submit nothing, until you remove them or they reach their last turn. Recurring sales never sell below the city's minimum stock, and recurring purchases never spend below your credit minimum or the credits held back for next turn's military pay (minimums are on the <button class="linkbtn" data-act="tab" data-tab="stock">Stockpiles tab</button>). The market runs before production, so sales use what the city holds at the start of the turn. Changes take effect when you submit your orders.</p>
    <ul class="list">${list.map((o, i) => `<li><span>${desc(o)}</span><button class="x" data-act="rec-rm" data-idx="${i}" aria-label="Remove recurring order">✕</button></li>`).join('') || '<li class="muted">None</li>'}</ul>
    <div class="panel recform"><div class="row">
      <select data-chg="rf2" data-f="side" aria-label="Buy or sell"><option value="buy" ${f.side === 'buy' ? 'selected' : ''}>Buy</option><option value="sell" ${f.side === 'sell' ? 'selected' : ''}>Sell</option></select>
      <select data-chg="rf2" data-f="mode" aria-label="How much">${modes.map(([k, t]) => `<option value="${k}" ${f.mode === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <input type="number" min="0" step="1" class="w-sm" data-chg="rf2" data-f="amount" value="${esc(f.amount)}" aria-label="Amount">
      <select data-chg="rf2" data-f="good" aria-label="Good">${RR.GOODS.map((g) => `<option value="${g}" ${f.good === g ? 'selected' : ''}>${GN(g)}</option>`).join('')}</select>
      <span>${f.side === 'buy' ? 'for' : 'from'}</span><select data-chg="rf2" data-f="city" aria-label="City">${cities.map((c) => `<option value="${c.id}" ${Number(f.city) === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="row"><label class="small">${f.side === 'buy' ? 'Highest price' : 'Lowest price'} <input type="number" min="0" step="1" data-chg="rf2" data-f="price" value="${esc(f.price)}" placeholder="any" style="width:80px"></label>
      <label class="small">Last turn <input type="number" min="${S.turn}" step="1" data-chg="rf2" data-f="until" value="${esc(f.until)}" placeholder="none" style="width:80px"></label>
      <button class="btn small primary" data-act="rec-add" ${!cities.length || list.length >= RR.RECURRING.max ? 'disabled' : ''}>Add recurring order</button></div></div>`;
}

/* ---------- War ---------- */
const MOB_NAMES = { peace: 'Peacetime', partial: 'Partial mobilization', full: 'Full mobilization' };
function mobLabel(S, x) {
  const cur = MOB_NAMES[x.mob || 'peace'];
  if (x.mobPending) { const n = x.mobPending.at + 1 - S.turn; return `${cur} → ${MOB_NAMES[x.mobPending.to]} in ${n} turn${n === 1 ? '' : 's'}`; }
  return cur;
}
TAB_RENDER.war = function () {
  const S = st(), p = meP(), d = draft(), st0 = d.settings || {};
  const L = RR.MOBILIZE.levels, cur = p.mob || 'peace', ci = L.indexOf(cur);
  const chosen = st0.mobilize || null;
  const mobRadio = L.map((lv, i) => {
    const allowed = (i <= ci + 1 || (p.rally && lv === 'full')) && !(p.mobPending && i > ci && !p.rally);
    const isCur = (chosen || (p.mobPending ? p.mobPending.to : cur)) === lv;
    const g = Q.govOf(S, UI.me);
    const note = i < ci ? 'stand down when the turn resolves' : i === ci ? (p.mobPending ? 'cancel the countdown' : 'current') : lv === 'partial' ? 'ready next turn' : p.rally ? 'your nation rallies: ready when this turn resolves' : `ready in ${g.toFullTurns} turns counting this one; others see it next turn`;
    return `<label class="ck" style="display:block;margin:4px 0"><input type="radio" name="mob" data-chg="mobilize" value="${lv}" ${isCur ? 'checked' : ''} ${allowed ? '' : 'disabled'}> <b>${MOB_NAMES[lv]}</b> <span class="small muted">${note}</span></label>`;
  }).join('');
  const docRows = Object.entries(RR.DOCTRINE_GROUPS).map(([g, gname]) => {
    const curD = p.doctrine && p.doctrine[g], since = p.doctrineSince && p.doctrineSince[g];
    const locked = curD && since != null && S.turn < since + RR.DOCTRINE_LOCK;
    const want = st0.doctrine && st0.doctrine[g];
    const keys = Object.entries(RR.DOCTRINES).filter(([, dd]) => dd.group === g);
    return `<div style="margin-bottom:10px"><h4 style="margin:4px 0">${gname}${locked ? ` <span class="small muted">(locked until turn ${since + RR.DOCTRINE_LOCK})</span>` : ''}</h4>${keys.map(([k, dd]) => {
      const res = p.researched.includes(k), on = (want || curD) === k;
      return `<label class="ck" style="display:block;margin:3px 0"><input type="radio" name="doc-${g}" data-chg="doctrine" data-group="${g}" value="${k}" ${on ? 'checked' : ''} ${!res || (locked && curD !== k) ? 'disabled' : ''}> <b>${esc(dd.name)}</b>${curD === k ? ' <span class="tag ok">in use</span>' : ''}${!res ? ` <span class="small muted">research it first (${dd.sci} science)</span>` : ''}<div class="small muted" style="margin-left:22px">${esc(dd.text)}</div></label>`;
    }).join('')}</div>`;
  }).join('');
  const prio = (st0.supplyPriority || p.supplyPriority || RR.SUPPLY_PRIORITY).filter((k) => UNI[k]);
  const prioList = prio.map((k, i) => `<li class="row" style="margin:0;justify-content:space-between"><span><span class="num muted">${i + 1}.</span> ${esc(UNI[k].name)}</span><span><button class="btn small" data-act="sprio" data-key="${k}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button> <button class="btn small" data-act="sprio" data-key="${k}" data-dir="1" ${i === prio.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button></span></li>`).join('');
  const mine = Q.unitsOf(S, UI.me);
  const combat = mine.filter((u) => UNI[u.type].role === 'combat').sort((a, b) => prio.indexOf(a.type) - prio.indexOf(b.type) || a.id - b.id);
  const logi = mine.filter((u) => UNI[u.type].role !== 'combat');
  const payTotal = combat.reduce((a, u) => a + Q.payOf(S, u), 0);
  const rows = combat.map((u) => {
    let v = RR.XP.bonus[Q.stars(u)];
    if (Q.landCombat(u) && Q.mobOf(S, u.owner) === 'partial') v += RR.MOBILIZE.partialDamage;
    if (u.paid === false) v += RR.MODS.unpaid; else if (u.supplied === false) v += RR.MODS.unsupplied;
    const status = [];
    { const lv = Q.entrenchLevel(S, u); if (lv) { status.push(`entrenched ${lv} (−${lv * 10}% taken)`); v += RR.ENTRENCH.fire; } }
    if (Q.blitzing(S, u)) { status.push('⚡ mobile warfare'); v += 0.25; }
    const mult = Math.round(Math.max(1 + RR.MODS.floor, 1 + v) * 100);
    if (!Q.canAct(S, u)) status.push('<span class="warn">idle</span>');
    if (u.paid === false) status.push('<span class="warn">unpaid</span>');
    if (u.supplied === false) status.push('<span class="warn">no supply</span>');
    if (u.mpShort) status.push('<span class="warn">no manpower</span>');
    if (Q.inRiver(S, u)) status.push('in a river');
    const dis = d.disband.some((o) => o.unit === u.id);
    return `<tr><td><button class="linkbtn" data-act="goto-unit" data-id="${u.id}">${esc(Q.unitName(u))}</button></td><td class="small">${tl(Q.posOf(S, u))}</td><td class="n">${u.hp} / ${Q.maxHpU(S, u)}</td><td>${['', '★', '★★'][Q.stars(u)]} <span class="small">${RR.XP.names[Q.stars(u)]}</span></td><td class="n">${Q.canAct(S, u) ? `${mult}%` : '—'}</td><td class="n">${Q.moveOf(S, u)}</td><td class="n">${Q.payOf(S, u)}</td><td class="small">${status.join(', ') || 'ready'}</td><td>${dis ? '<span class="tag war">disbanding</span>' : `<button class="btn small danger" data-act="disband" data-unit="${u.id}">Disband</button>`}</td></tr>`;
  }).join('');
  const lrows = logi.map((u) => `<tr><td><button class="linkbtn" data-act="goto-unit" data-id="${u.id}">${esc(Q.unitName(u))}</button></td><td class="small">${tl(Q.posOf(S, u))}</td><td class="n">${u.hp} / ${Q.maxHpU(S, u)}</td><td class="small">${esc(fmtAmt(u.cargo) || 'empty')}</td><td class="small">${u.route != null ? `route #${u.route}` : ''}</td><td>${d.disband.some((o) => o.unit === u.id) ? '<span class="tag war">disbanding</span>' : `<button class="btn small danger" data-act="disband" data-unit="${u.id}">Disband</button>`}</td></tr>`).join('');
  return `<div class="page"><h2>War</h2><p class="muted">Mobilization, doctrines and every unit you command. Attack strength shows the unit's own modifiers (mobilization, pay, supply, experience); hover a red target on the map for the full damage forecast.</p>
    <div class="cols" style="grid-template-columns:1fr 1fr 1fr;gap:14px">
      <div class="panel"><h3 style="margin-top:0">Mobilization</h3><p class="small">Now: <b>${esc(mobLabel(S, p))}</b></p>${mobRadio}
        <p class="small muted">Peacetime: land units cannot move or attack and eat only their idle food. Partial: half speed, −50% attack. Full: normal, but housing makes 20% less manpower. Pay per land unit (${esc(p.doctrine && p.doctrine.army ? RR.DOCTRINES[p.doctrine.army].name : 'standard')}): ${(() => { const t = RR.PAY[(p.doctrine && p.doctrine.army) || 'standard']; const f = Q.govOf(S, UI.me).landPay || 1; return `${Math.round(t.peace * f)} / ${Math.round(t.partial * f)} / ${Math.round(t.full * f)}`; })()} credits. Ships always work normally: frigates ${RR.PAY.ship.frigate}, warships ${RR.PAY.ship.warship} a turn. Defense is never affected.</p></div>
      <div class="panel"><h3 style="margin-top:0">Doctrines</h3><p class="small muted">One per group, once researched. A choice is locked for ${RR.DOCTRINE_LOCK} turns.</p>${docRows}</div>
      <div class="panel"><h3 style="margin-top:0">Supply priority</h3><p class="small muted">When supply or manpower runs short, units higher on this list are served first. A unit gets its full need or nothing. Units draw from your cities in range first, then field depots, then nearby logistics units, and only then their own stores; combat units refill their stores at the end of the turn.</p><ol class="list prio">${prioList}</ol></div>
    </div>
    <div class="row" style="gap:24px;margin-top:12px"><span>Combat units <b class="num">${combat.length}</b></span><span>Pay next turn about <b class="num">${payTotal}</b> credits <span class="small muted">(before free barracks and port berths)</span></span><span>Manpower draw <b class="num">${Math.round(combat.reduce((a, u) => a + (UNI[u.type].cls === 'ship' ? RR.MANPOWER_DRAW.ship : RR.MANPOWER_DRAW.land), 0) * 10) / 10}</b> a turn</span></div>
    <div class="ledger" style="margin-top:10px"><table class="cards"><thead><tr><th>Unit</th><th>Location</th><th class="n">HP</th><th>Rank</th><th class="n">Attack</th><th class="n">Move</th><th class="n">Pay</th><th>Status</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="9" class="muted">No combat units.</td></tr>'}</tbody></table></div>
    <div class="ledger" style="margin-top:10px"><table class="cards"><thead><tr><th>Logistics unit</th><th>Location</th><th class="n">HP</th><th>Cargo</th><th></th><th></th></tr></thead><tbody>${lrows || '<tr><td colspan="6" class="muted">No logistics units.</td></tr>'}</tbody></table></div>
    <p class="small muted">Disbanding returns half the goods used to build a unit (never the manpower), plus any cargo, to your cities, field depots or logistics units in range; anything that does not fit is lost.</p>
    ${designPanel(S, p, d)}</div>`;
};
/* ---------- Unit designs ---------- */
const DLAB = { hp: 'HP', speed: 'Speed', dmg: 'Damage', cargo: 'Cargo' };
function designPanel(S, p, d) {
  const bases = Object.keys(UNI).filter((k) => Q.researchedUnitSelf(S, UI.me, k));
  if (!UI.designForm || !bases.includes(UI.designForm.base)) UI.designForm = { base: bases[0] || null, name: '', steps: {} };
  const f = UI.designForm, retired = p.retiredDesigns || [];
  const mine = (S.designs || []).filter((dz) => Q.canUseDesign(S, UI.me, dz));
  const pend = d.designs || [];
  const list = mine.map((dz) => {
    const u = Q.ustat(dz.base, dz), b = UNI[dz.base], isRet = retired.includes(dz.id), op = pend.find((o) => o.id === dz.id);
    return `<tr class="${isRet ? 'muted' : ''}"><td><b>${esc(dz.name)}</b><div class="small muted">${esc(b.name)}${dz.owner === UI.me ? '' : `, bought from ${esc(pname(dz.owner))}`}</div></td><td class="small">${esc(designSteps(dz))}</td><td class="small">${u.hp} HP, move ${u.move}${u.ammo ? `, ${u.ammo} ammo/attack` : ''}${u.cargo ? `, cargo ${u.cargo}` : ''}</td><td class="small">${esc(costText(u.cost))}</td><td>${op ? `<span class="tag">${op.op === 'retire' ? 'retiring' : 'restoring'}</span>` : `<button class="btn small" data-act="design-${isRet ? 'restore' : 'retire'}" data-id="${dz.id}">${isRet ? 'Restore' : 'Retire'}</button>`}</td></tr>`;
  }).join('');
  let form = '<p class="small muted">Research a unit\'s building yourself to design variants of it (a bought blueprint is not enough).</p>';
  if (f.base) {
    const b = UNI[f.base], keys = Object.keys(RR.DESIGN.ranges).filter((k) => (k !== 'dmg' || b.role === 'combat') && (k !== 'cargo' || b.cargo));
    const prev = Q.ustat(f.base, { id: -1, name: f.name || 'New design', steps: f.steps });
    const err = Q.checkDesign(S, UI.me, { base: f.base, name: f.name, steps: f.steps });
    const cmp = (label, a, z) => `<tr><td>${label}</td><td class="n">${a}</td><td class="n ${z !== a ? 'warn' : ''}">${z}</td></tr>`;
    const gt = (o) => Object.entries(o || {}).map(([g, v]) => `${v} ${gl(g)}`).join(', ') || '—';
    form = `<div class="row"><label>Unit <select data-chg="df-base">${bases.map((k) => `<option value="${k}" ${k === f.base ? 'selected' : ''}>${esc(UNI[k].name)}</option>`).join('')}</select></label><label>Name <input type="text" maxlength="30" data-chg="df-name" value="${esc(f.name)}" placeholder="e.g. Heavy tank"></label></div>
      <div class="row">${keys.map((k) => { const [lo, hi] = RR.DESIGN.ranges[k]; return `<label>${DLAB[k]} <input type="number" min="${lo}" max="${hi}" step="1" class="w-sm" data-chg="df-step" data-k="${k}" value="${f.steps[k] || 0}" style="width:60px"></label>`; }).join('')}</div>
      <table class="small" style="margin:6px 0"><thead><tr><th></th><th class="n">${esc(b.name)}</th><th class="n">${esc(f.name || 'New design')}</th></tr></thead><tbody>
        ${cmp('HP', b.hp, prev.hp)}${cmp('Move', b.move, prev.move)}${b.role === 'combat' ? cmp('Damage', '100%', `${Math.round(100 * (1 + prev.dmgMod))}%`) + cmp('Ammo per attack', b.ammo, prev.ammo) : ''}${b.cargo ? cmp('Cargo', b.cargo, prev.cargo) : ''}
        ${cmp('Idle upkeep', gt(b.idle), gt(prev.idle))}${cmp('Per tile', gt(b.perTile), gt(prev.perTile))}${cmp('Build cost', costText(b.cost), costText(prev.cost))}</tbody></table>
      <div class="row"><button class="btn small brass" data-act="design-create" ${err ? 'disabled' : ''}>Create design (${RR.DESIGN.sci} science)</button><span class="small ${err ? 'warn' : 'muted'}">${esc(err || 'Each + step adds 15% to the build cost; each − step takes 10% off (except cargo cuts). HP +: −1 move, +15% per-tile upkeep. HP −: −15% per-tile. Speed ±: ±1 move, ±10% idle, +25%/−15% per-tile. Damage ±: ±10% idle, +25%/−10% ammo. Cargo +: −1 move, +10% idle; cargo −: +1 move. Every step must have its full effect.')}</span></div>`;
  }
  const queued = pend.filter((o) => o.op === 'create');
  return `<div class="panel" style="margin-top:14px"><h3 style="margin-top:0">Unit designs</h3>
    <p class="small muted">Named variants of a unit with more or less HP, speed, damage (combat units) or cargo (logistics units). Build them like the base unit. Other nations see a design's name, HP and the damage it deals, but not its other settings unless they buy its blueprint (Research tab).</p>
    ${list ? `<div class="ledger"><table class="cards"><thead><tr><th>Design</th><th>Settings</th><th>Stats</th><th>Build cost</th><th></th></tr></thead><tbody>${list}</tbody></table></div>` : ''}
    ${queued.length ? `<p class="small">Creating this turn: ${queued.map((o) => esc(o.name)).join(', ')}</p>` : ''}
    <h4>New design</h4>${form}</div>`;
}

/* ---------- Government ---------- */
const GOV_KEYS = RR.GOV_KEYS;
TAB_RENDER.government = function () {
  const S = st(), p = meP(), d = draft(), st0 = d.settings || {};
  const curG = p.gov || 'monarchy', curT = p.tax || 'normal', g = RR.GOVERNMENTS[curG];
  const govReady = Q.govCooldownEnds(S, UI.me), taxReady = Q.taxCooldownEnds(S, UI.me);
  const wantG = st0.government || curG, wantT = st0.tax || curT;
  const pct = (m) => `${m >= 1 ? '+' : '−'}${Math.round(Math.abs(m - 1) * 100)}%`;
  const govRadio = GOV_KEYS.map((k) => {
    const G = RR.GOVERNMENTS[k], dis = k !== curG && S.turn < govReady;
    return `<label class="ck" style="display:block;margin:6px 0"><input type="radio" name="gov" data-chg="government" value="${k}" ${wantG === k ? 'checked' : ''} ${dis ? 'disabled' : ''}> <b>${G.name}</b>${k === curG ? ' <span class="tag ok">current</span>' : ''}<div class="small muted" style="margin-left:22px">${esc(G.text)}</div></label>`;
  }).join('');
  const taxRadio = RR.TAX_LEVELS.map((lv) => {
    const t = g.tax[lv], dis = g.fixedTax || (lv !== curT && S.turn < taxReady) || (lv === 'war' && p.mob === 'peace');
    if (g.fixedTax && lv !== 'normal') return '';
    return `<label class="ck" style="display:block;margin:4px 0"><input type="radio" name="tax" data-chg="tax" value="${lv}" ${wantT === lv ? 'checked' : ''} ${dis ? 'disabled' : ''}> <b>${RR.TAX_NAMES[lv]}</b> <span class="small muted">${t.rate} credits per manpower, housing ${pct(t.mp)}${lv === 'war' ? '; needs partial or full mobilization' : ''}</span>${lv === curT ? ' <span class="tag ok">current</span>' : ''}</label>`;
  }).join('');
  const housing = S.buildings.filter((b) => Q.buildingOwner(S, b) === UI.me && Q.recipeOf(b) && Q.recipeOf(b).mpOut && !b.halted);
  const mpNow = Math.round(housing.reduce((a, b) => a + Q.mpOutOf(S, b), 0) * 10) / 10;
  const taxNow = S.buildings.filter((b) => b.key === 'taxOffice' && Q.buildingOwner(S, b) === UI.me).reduce((a, b) => a + Q.creditsOutOf(S, b), 0);
  const cmp = `<table class="govtax"><thead><tr><th rowspan="2">Tax rate</th>${GOV_KEYS.map((k) => `<th colspan="2" class="grp">${RR.GOVERNMENTS[k].name}</th>`).join('')}</tr><tr>${GOV_KEYS.map(() => '<th class="n gs">Credits</th><th class="n">Housing</th>').join('')}</tr></thead><tbody>${RR.TAX_LEVELS.map((lv) => `<tr><td>${RR.TAX_NAMES[lv]}</td>${GOV_KEYS.map((k) => { const G = RR.GOVERNMENTS[k], t = G.tax[lv]; return G.fixedTax && lv !== 'normal' ? '<td class="n muted gs">–</td><td class="n muted">–</td>' : `<td class="n gs">${t.rate}</td><td class="n">×${t.mp}</td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
  const feat = [
    ['Change tax rate', (G) => (G.fixedTax ? 'fixed at normal' : `every ${G.taxEvery} turns`)],
    ['Tax offices pay on', (G) => (G.taxOnUse ? 'manpower used in production' : 'manpower housing makes')],
    ['Full mobilization', (G) => `housing −${Math.round((G.fullMpCut != null ? G.fullMpCut : RR.MOBILIZE.fullMpCut) * 100)}%`],
    ['Market sales', (G) => `${Math.round((G.marketSell || RR.MARKET.buyRatio) * 100)}% of the price`],
    ['Production', (G) => (G.production ? `buildings ×${G.production.out} output, ×${G.production.mp} manpower, ×${G.production.inputs} inputs; housing ×${G.housing.out} manpower, ×${G.housing.inputs} food` : 'normal')],
    ['Research', (G) => (G.science ? 'universities and research facilities: 25% fewer credits, a third less manpower' : 'normal')],
    ['Going to war', (G) => (G.notice ? `ultimatum: ${G.notice} turn${G.notice === 1 ? '' : 's'}' notice` : 'declare war instantly')],
    ['Partial → full mobilization', (G) => `${G.toFullTurns} turns${G.rally ? ' (1 if war is declared on you)' : ''}`],
    ['Land unit pay', (G) => (G.landPay ? `${Math.round((1 - G.landPay) * 100)}% less` : 'normal')],
    ['Changing to it', (G) => (G.fixedTax ? 'upheaval; leaving it causes none' : 'upheaval')],
    ['Settlements', (G) => (G.settlementCut ? `${Math.round(G.settlementCut * 100)}% cheaper` : 'normal')],
    ['Town halls', (G) => (G.costs && G.costs.townHall ? `${Object.entries(G.costs.townHall).map(([g, v]) => `${v} ${g === 'mp' ? 'manpower' : g}`).join(', ')}` : 'normal')],
    ['Extraction manpower', (G) => (G.extractionMp ? `×${G.extractionMp} (not silver or gold mines)` : 'normal')],
  ];
  const featT = `<table><thead><tr><th></th>${GOV_KEYS.map((k) => `<th>${RR.GOVERNMENTS[k].name}</th>`).join('')}</tr></thead><tbody>${feat.map(([lab, f]) => `<tr><td>${lab}</td>${GOV_KEYS.map((k) => `<td class="small">${esc(f(RR.GOVERNMENTS[k]))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  return `<div class="page"><h2>Government</h2><p class="muted">Your government sets your tax rates, how you go to war and how fast you mobilize. Other nations can see your government and tax rate on the Diplomacy tab.</p>
    <div class="row" style="gap:24px"><span>Government <b>${g.name}</b></span><span>Tax rate <b>${RR.TAX_NAMES[curT]}</b></span><span>Housing makes <b class="num">${mpNow}</b> manpower a turn (×${Math.round(Q.mpMult(S, UI.me) * 100) / 100})</span><span>Tax offices <b class="num">${taxNow}</b> credits a turn</span></div>
    ${p.upheavalUntil != null && S.turn <= p.upheavalUntil ? `<p class="warn">Upheaval: 0.5 comes off your housing's manpower multiplier until turn ${p.upheavalUntil} is over.</p>` : ''}
    ${p.rally ? '<p class="ok">War was declared on you: your nation rallies. Full mobilization takes effect when this turn resolves.</p>' : ''}
    <div class="cols" style="grid-template-columns:1fr 1fr;gap:14px;margin-top:12px">
      <div class="panel"><h3 style="margin-top:0">Tax rate</h3><p class="small muted">${S.turn < taxReady ? `You can change it again on turn ${taxReady}.` : 'You can change it this turn.'} ${g.taxOnUse ? 'A tax office pays the rate for each manpower its city uses in production and extraction buildings.' : "A tax office pays the rate for each manpower its city's housing makes."} Full mobilization takes a further ${Math.round((g.fullMpCut != null ? g.fullMpCut : RR.MOBILIZE.fullMpCut) * 100)}% off housing.</p>${taxRadio}</div>
      <div class="panel"><h3 style="margin-top:0">Form of government</h3><p class="small muted">${S.turn < govReady ? `You can change it again on turn ${govReady}.` : 'You can change it this turn.'} Changing causes ${RR.GOV_CHANGE.upheavalTurns} turns of upheaval (0.5 off your housing's manpower multiplier, never below 0) and drops full mobilization to partial. Leaving the Provisional Government causes no upheaval. After a change you must wait ${RR.GOV_CHANGE.every} turns. You may set a new tax rate on the same turn.</p>${govRadio}</div>
    </div>
    <h3>Tax rates by government</h3><div class="ledger">${cmp}</div>
    <h3>How the governments differ</h3><div class="ledger">${featT}</div>
    <p class="small muted">Democracies and monarchies may declare war at once on a nation that is at war with one of their partners (any nation with a peace treaty in force, a trade route, or transit, port or rail rights with them). Otherwise they send an ultimatum from the Diplomacy tab.</p></div>`;
};

/* ---------- Diplomacy ---------- */
function peaceDraft(to) {
  if (!UI.peace || UI.peace.to !== to) UI.peace = { to, term: 5, give: { credits: 0, science: 0, cities: [], tiles: [], units: [] }, get: { credits: 0, science: 0, cities: [], tiles: [], units: [] } };
  return UI.peace;
}
function peaceBuilder() {
  const S = st(), pd = UI.peace;
  if (!pd || !S.players[pd.to] || S.players[pd.to].eliminated) return '';
  const them = S.players[pd.to], pl = Q.normPeace(pd), err = Q.checkPeace(S, UI.me, pd.to, pl);
  const side = (key, pid) => {
    const part = pd[key], P = S.players[pid], cities = Q.citiesOf(S, pid);
    return `<div><h4>${pid === UI.me ? 'You give' : `${esc(P.name)} gives`}</h4>
      <div class="row"><label>Credits <input type="number" min="0" data-chg="pc-num" data-side="${key}" data-f="credits" value="${part.credits || ''}" placeholder="0"></label><span class="small muted">has ${P.credits}</span></div>
      <div class="row"><label>Science <input type="number" min="0" data-chg="pc-num" data-side="${key}" data-f="science" value="${part.science || ''}" placeholder="0"></label><span class="small muted">has ${P.science}</span></div>
      <div class="small">${cities.map((c) => `<label class="ck"><input type="checkbox" data-chg="pc-city" data-side="${key}" value="${c.id}" ${part.cities.includes(c.id) ? 'checked' : ''}> ${esc(c.name)}</label>`).join('<br>') || '<span class="muted">No cities</span>'}</div>
      <p class="small">${part.tiles.length} tile${part.tiles.length === 1 ? '' : 's'} chosen${part.tiles.length ? ` (${part.tiles.map(tl).join(', ')})` : ''}</p>

    <div class="row"><button class="btn" data-act="pc-pick">Pick tiles on the map</button><button class="btn primary" data-act="pc-send" ${err ? 'disabled' : ''}>Propose treaty</button><button class="btn" data-act="pc-close">Cancel</button></div>
    ${err ? `<p class="small warn">${esc(err[0].toUpperCase() + err.slice(1))}.</p>` : ''}</div>`;

TAB_RENDER.diplomacy = function () {
  const S = st(), p = meP(), d = draft();
  const others = S.players.filter((x) => x.id !== UI.me);
  const queued = (pred) => d.diplo.some(pred);
  const pact = (x) => S.treaties.find((t) => t.type === 'peace' && ((t.a === UI.me && t.b === x.id) || (t.b === UI.me && t.a === x.id)));
  const rel = (x) => {
    if (x.eliminated) return '<span class="tag">Out of the game</span>';
    if (Q.atWar(S, UI.me, x.id)) return '<span class="tag war">At war</span>';
    const pc = pact(x);
    if (pc) return `<span class="tag ok">Peace treaty</span><div class="small muted">no war before turn ${pc.endsTurn}</div>`;
    return '<span class="tag ok">At peace</span>';
  };
  const rows = others.map((x) => {
    if (x.eliminated) return `<tr><td>${playerLabel(x.id)}</td><td>${rel(x)}</td><td colspan="5"></td></tr>`;
    const war = Q.atWar(S, UI.me, x.id);
    const tr = S.treaties.filter((t) => t.type !== 'peace' && ((t.a === UI.me && t.b === x.id) || (t.b === UI.me && t.a === x.id)));
    const acts = [];
    acts.push(queued((o) => o.type === 'propose' && o.kind === 'peace' && o.to === x.id) ? '<span class="tag brass">Peace offered</span>' : `<button class="btn small" data-act="pc-open" data-to="${x.id}">${war ? 'Propose peace…' : 'Offer peace treaty…'}</button>`);
    if (!war && !pact(x)) {
      const decErr = Q.checkDeclare(S, UI.me, x.id), pendU = (S.ultimatums || []).some((u) => u.from === UI.me && u.to === x.id);
      if (queued((o) => o.type === 'declare' && o.to === x.id)) acts.push('<span class="tag war">War declared this turn</span>');
      else if (!decErr) acts.push(`<button class="btn small danger" data-act="declare" data-to="${x.id}">Declare war</button>`);
      if (queued((o) => o.type === 'ultimatum' && o.to === x.id)) acts.push('<span class="tag war">Ultimatum queued</span>');
      else if (!pendU) acts.push(`<button class="btn small danger" data-act="ult-open" data-to="${x.id}" title="${esc(decErr || '')}">Send ultimatum…</button>`);
    }
    if (!war) for (const type of ['transit', 'port', 'rail']) if (!tr.some((t) => t.type === type) && !queued((o) => o.type === 'propose' && o.kind === 'treaty' && o.to === x.id && o.payload.type === type)) acts.push(`<button class="btn small" data-act="treaty" data-to="${x.id}" data-type="${type}">Offer ${type} rights</button>`);
    acts.push(`<span class="row" style="margin:0"><input type="number" min="1" class="w-sm" id="cr-${x.id}" placeholder="0" aria-label="Credits to send"><button class="btn small" data-act="credits" data-to="${x.id}">Send credits</button></span>`);
    return `<tr><td>${playerLabel(x.id)}</td><td>${rel(x)}</td><td class="small">${esc(RR.GOVERNMENTS[x.gov || 'monarchy'].name)}<div class="muted">${esc(RR.TAX_NAMES[x.tax || 'normal'])} tax</div></td>
      <td class="small">${tr.map((t) => `${t.type} rights${t.endsTurn ? ` (ends turn ${t.endsTurn})` : ` <button class="linkbtn" data-act="cancel-treaty" data-id="${t.id}">cancel</button>`}`).join('<br>') || '<span class="muted">None</span>'}</td>
      <td class="small ${x.mob === 'full' || x.mobPending ? 'warn' : ''}">${esc(mobLabel(S, x))}</td>
      <td class="small">${citiesOf(x.id).length} cit${citiesOf(x.id).length === 1 ? 'y' : 'ies'}, ${Q.unitsOf(S, x.id).length} units</td><td><div class="row" style="margin:0">${acts.join(' ')}</div></td></tr>`;
  }).join('');
  const incoming = S.proposals.filter((pr) => pr.to === UI.me && pr.turn === S.turn).map((pr) => {
    const ans = d.diplo.find((o) => o.type === 'respond' && o.id === pr.id);
    return `<li><span>${playerLabel(pr.from)} offers ${esc(Q.describeProposal(S, pr))}${pr.kind === 'route' ? `: ${esc(pr.payload.from)} → ${esc(pr.payload.to)} (${esc((() => { const r = S.routes.find((x) => x.id === pr.payload.route); return r ? `you get ${fmtGoods(r.goods)}, you send ${fmtGoods(r.back) || 'nothing'}` : ''; })())})` : ''}</span>
      <span><label class="ck"><input type="radio" name="pr-${pr.id}" data-chg="respond" data-id="${pr.id}" value="1" ${ans && ans.accept ? 'checked' : ''}> Accept</label> <label class="ck"><input type="radio" name="pr-${pr.id}" data-chg="respond" data-id="${pr.id}" value="0" ${ans && !ans.accept ? 'checked' : ''}> Reject</label></span></li>`;
  }).join('');
  const outgoing = S.proposals.filter((pr) => pr.from === UI.me).map((pr) => `<li>${esc(Q.describeProposal(S, pr))} to ${esc(pname(pr.to))}<span class="small muted">answer due turn ${pr.turn}</span></li>`).join('');
  const ults = S.ultimatums || [];
  const ultIn = ults.filter((u) => u.to === UI.me).map((u) => {
    const acc = queued((o) => o.type === 'ultAccept' && o.id === u.id);
    return `<li><span><b class="warn">Ultimatum</b> from ${playerLabel(u.from)}: ${esc(Q.describeUltimatum(S, u))}. War on turn ${u.deadline} unless you accept.</span><label class="ck"><input type="checkbox" data-chg="ult-accept" data-id="${u.id}" ${acc ? 'checked' : ''}> Accept the terms</label></li>`;
  }).join('');
  const ultOut = ults.filter((u) => u.from === UI.me).map((u) => `<li><span>Your ultimatum to ${playerLabel(u.to)}: ${esc(Q.describeUltimatum(S, u))}. War on turn ${u.deadline}.</span>${queued((o) => o.type === 'ultCancel' && o.id === u.id) ? '<span class="tag">withdrawing</span>' : `<button class="btn small" data-act="ult-cancel" data-id="${u.id}">Withdraw</button>`}</li>`).join('');
  const alive = S.players.filter((x) => !x.eliminated);
  return `<div class="page"><h2>Diplomacy</h2><p class="small">Your mobilization: <b>${esc(mobLabel(S, p))}</b> <button class="linkbtn" data-act="tab" data-tab="war">change on the War tab</button></p><p class="muted">Peace treaties, rights treaties and trade routes are enforced by the game. Alliances, promises and informal arrangements are just words. Proposals reach the other nation next turn.</p>
    ${peaceBuilder()}
    <div class="ledger" style="margin-top:14px"><table class="cards"><thead><tr><th>Nation</th><th>Status</th><th>Government</th><th>Rights treaties</th><th>Mobilization</th><th>Size</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="cols" style="margin-top:16px">
      <div class="panel"><h3 style="margin-top:0">Answer this turn</h3><ul class="list">${ultIn}${incoming || (ultIn ? '' : '<li class="muted">Nothing to answer.</li>')}</ul><h4>Waiting on others</h4><ul class="list">${ultOut}${outgoing || (ultOut ? '' : '<li class="muted">None</li>')}</ul></div>
      <div class="panel"><h3 style="margin-top:0">Wars and treaties</h3><ul class="list">${S.wars.map((w) => `<li>${playerLabel(w.a)} vs ${playerLabel(w.b)}<span class="small muted">since turn ${w.since}</span></li>`).join('') || '<li class="muted">No wars.</li>'}
        ${ults.map((u) => `<li>${playerLabel(u.from)} → ${playerLabel(u.to)}<span class="small muted">ultimatum, war on turn ${u.deadline} unless accepted</span></li>`).join('')}
        ${S.treaties.filter((t) => t.type === 'peace').map((t) => `<li>${playerLabel(t.a)} and ${playerLabel(t.b)}<span class="small muted">peace, no war before turn ${t.endsTurn}</span></li>`).join('')}</ul>
        <h4>End the game</h4><p class="small">The game ends when one nation is left, or when every remaining nation (${alive.map((x) => esc(x.name)).join(', ')}) votes to end it in the same turn while none are at war.</p>
        ${!p.eliminated ? `<label class="ck"><input type="checkbox" data-chg="endvote" ${queued((o) => o.type === 'endVote') ? 'checked' : ''}> Vote to end the game this turn</label>` : ''}</div>
    </div></div>`;
};
const citiesOf = (pid) => Q.citiesOf(st(), pid);

/* ---------- Reports ---------- */
const REPORT_CATS = { all: 'Everything', war: 'War', conflict: 'Order conflicts', supply: 'Supply', shortfall: 'Production shortfalls', combat: 'Combat', movement: 'Movement', logistics: 'Logistics', market: 'Market', construction: 'Construction', recruitment: 'Recruitment', research: 'Research', diplomacy: 'Diplomacy', game: 'Game' };
TAB_RENDER.reports = function () {
  const S = st();
  const list = (S.reports[UI.me] || []).filter((r) => UI.reportCat === 'all' || r.cat === UI.reportCat);

/* ---------- Orders ---------- */
function orderGroups() {
  const S = st(), d = draft();
  const G = [];
  const add = (phase, list, i, text) => { let g = G.find((x) => x.phase === phase); if (!g) { g = { phase, items: [] }; G.push(g); } g.items.push({ list, i, text }); };
  d.diplo.forEach((o, i) => {
    const t = o.type === 'declare' ? `Declare war on ${pname(o.to)}`
      : o.type === 'propose' ? `Propose ${o.kind === 'treaty' ? `${o.payload.type} rights` : o.kind === 'blueprint' ? `selling ${BLD[o.payload.key].name} for ${o.payload.price}` : Q.describeProposal(S, { kind: 'peace', from: UI.me, to: o.to, payload: o.payload })} to ${pname(o.to)}`
        : o.type === 'respond' ? `${o.accept ? 'Accept' : 'Reject'} ${Q.describeProposal(S, S.proposals.find((p) => p.id === o.id) || { kind: '?' })}`
          : o.type === 'credits' ? `Send ${o.amount} credits to ${pname(o.to)}`
            : o.type === 'cancelTreaty' ? 'Cancel a treaty'
              : o.type === 'ultimatum' ? `Ultimatum to ${pname(o.to)}`
                : o.type === 'ultAccept' ? 'Accept an ultimatum'
                  : o.type === 'ultCancel' ? 'Withdraw an ultimatum'
              : o.type === 'endVote' ? 'Vote to end the game' : o.type;
    add('Diplomacy', 'diplo', i, t);
  });
  d.attacks.forEach((o, i) => add('Combat', 'attacks', i, o.unit != null ? `${uname(o.unit)} attacks ${tl(o.t)}` : `${cityName(o.city)} ${BLD[o.w].name.toLowerCase()} fires at ${tl(o.t)}`));
  d.board.forEach((o, i) => add('Movement', 'board', i, `${uname(o.unit)} boards ${uname(o.transport)}`));
  d.moves.forEach((o, i) => add('Movement', 'moves', i, `${uname(o.unit)} moves to ${tl(o.path[o.path.length - 1])} (${o.path.length - 1} tiles)`));
  d.unload.forEach((o, i) => add('Movement', 'unload', i, `${uname(o.unit)} unloads at ${tl(o.t)}`));
  d.buys.forEach((o, i) => add('Market buys', 'buys', i, `Buy ${o.amount} ${gl(o.good)} for ${cityName(o.city)}${o.maxPrice ? `, bidding up to ${o.maxPrice} each` : ''}`));
  d.sells.forEach((o, i) => add('Market sells', 'sells', i, `Sell ${o.amount} ${gl(o.good)} from ${cityName(o.city)}`));
  d.research.forEach((k, i) => add('Research', 'research', i, `Research ${BLD[k].name} (${BLD[k].sci} science)`));
  d.sabotage.forEach((o, i) => add('Combat', 'sabotage', i, `${uname(o.unit)} sabotages ${tl(o.t)}`));
  d.disband.forEach((o, i) => add('Buildings', 'disband', i, `Disband ${uname(o.unit)}`));
  d.dump.forEach((o, i) => add('Buildings', 'dump', i, `${uname(o.unit)} dumps its ${gl(o.good)}`));
  if (d.settings && d.settings.mobilize) add('Diplomacy', 'settings', 0, `Mobilization: ${MOB_NAMES[d.settings.mobilize]}`);
  if (d.settings && d.settings.doctrine) for (const k of Object.values(d.settings.doctrine)) add('Diplomacy', 'settings', 0, `Adopt the ${RR.DOCTRINES[k].name} doctrine`);
  if (d.settings && d.settings.supplyPriority) add('Logistics', 'settings', 0, 'Supply priority changed');
  d.clear.forEach((o, i) => add('Buildings', 'clear', i, `Clear the forest at ${tl(o.t)} (+${RR.CLEAR_FOREST.lumber} lumber)`));
  d.demolish.forEach((o, i) => add('Buildings', 'demolish', i, `Demolish ${o.what === 'building' ? (Q.tileBuilding(S, o.t) ? BLD[Q.tileBuilding(S, o.t).key].name.toLowerCase() : 'building') : o.what === 'trap' ? 'tank trap' : o.what === 'rail' ? 'railroad' : 'bridge'} at ${tl(o.t)}`));
  d.found.forEach((o, i) => add('Buildings', 'found', i, `Found ${o.name} from ${destName({ type: 'depot', id: o.depot })}`));
  d.builds.forEach((o, i) => add('Buildings', 'builds', i, `Build ${BLD[o.key].name} ${o.unit != null ? `with ${uname(o.unit)}'s cargo` : `for ${cityName(o.city)}`}${o.t != null ? ` at ${tl(o.t)}` : ''}`));
  d.trains.forEach((o, i) => add('Units', 'trains', i, `Build ${o.design != null && Q.designById(st(), o.design) ? Q.designById(st(), o.design).name : UNI[o.type].name} in ${cityName(o.city)}`));
  (d.designs || []).forEach((o, i) => add('Research', 'designs', i, o.op === 'create' ? `Create the ${o.name} design (${UNI[o.base].name.toLowerCase()}, ${RR.DESIGN.sci} science)` : `${o.op === 'retire' ? 'Retire' : 'Restore'} ${(Q.designById(st(), o.id) || {}).name || 'design'}`));
  if (d.settings && (d.settings.priority || ['products', 'halt', 'labor', 'fuel'].some((k) => d.settings[k] && Object.keys(d.settings[k]).length))) add('Production', 'settings', 0, 'Production priority, products, workers, fuel or on/off switches changed');
  if (d.settings) {
    const ch = (k) => d.settings[k] !== undefined && JSON.stringify(d.settings[k]) !== JSON.stringify(meP()[k] != null ? meP()[k] : STANDING[k]());
    if (ch('queue') || ch('keep') || ch('keepManpower') || ch('cityOrder')) add('Building queues', 'standing:queue,keep,keepManpower,cityOrder', 0, `Change ${[ch('queue') && 'building queues', ch('keep') && 'minimum stocks', ch('keepManpower') && 'the manpower minimum', ch('cityOrder') && 'the city order'].filter(Boolean).join(', ')}`);
    if (ch('recurring') || ch('keepCredits')) add('Market buys', 'standing:recurring,keepCredits', 0, `Change ${[ch('recurring') && 'recurring market orders', ch('keepCredits') && 'the credit minimum'].filter(Boolean).join(' and ')}`);
  }
  d.cargo.forEach((o, i) => add('Logistics', 'cargo', i, `${uname(o.unit)} ${o.amount > 0 ? 'loads' : 'unloads'} ${Math.abs(o.amount)} ${gl(o.good)}`));
  d.routeOps.forEach((o, i) => add('Logistics', 'routeOps', i, o.op === 'remove' ? `Close route #${o.id}` : o.op === 'update' ? `Change route #${o.id}` : `New route ${cityName(o.from)} → ${destName(o.to)}`));
  const order = ['Diplomacy', 'Combat', 'Movement', 'Market buys', 'Market sells', 'Research', 'Production', 'Buildings', 'Units', 'Logistics', 'Building queues'];
  return G.sort((a, b) => order.indexOf(a.phase) - order.indexOf(b.phase));
}
TAB_RENDER.orders = function () {

    <div class="cols"><div class="panel">${groups.map((g) => `<h4>${g.phase}</h4><ul class="list">${g.items.map((it) => `<li>${esc(it.text)}${it.list.startsWith('standing:') ? `<button class="x" data-act="rm-standing" data-keys="${it.list.slice(9)}" aria-label="Undo these changes">✕</button>` : `<button class="x" data-act="rm" data-list="${it.list}" data-idx="${it.i}" aria-label="Remove order">✕</button>`}</li>`).join('')}</ul>`).join('') || '<p class="muted">No orders yet. Standing routes and production keep running anyway.</p>'}

/* =====================================================================
   ACTIONS
