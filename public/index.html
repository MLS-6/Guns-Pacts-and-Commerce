<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guns, Pacts, and Commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1e2620; --ink-2: #3c4a40; --muted: #5d6a5f;
  --desk: #c9d1c4; --paper: #eef1eb; --paper-2: #e2e7de; --rule: #a9b3a6; --rule-soft: #cfd6cb;
  --brass: #a8801f; --brass-soft: #ecdca8; --signal: #a3312b; --signal-soft: #f1d3cf; --ok: #2f6b45; --ok-soft: #d4e6d8;
  --sea: #24405a; --me: #888;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-head: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--desk); color: var(--ink); font: 15px/1.45 var(--f-body); }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-head); font-weight: 600; margin: 0; letter-spacing: 0.01em; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.2rem; margin: 18px 0 8px; }
h4 { font-size: 1.02rem; margin: 12px 0 6px; }
p { margin: 0 0 8px; max-width: 72ch; }
a { color: var(--ink); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.num { font-family: var(--f-head); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.warn { color: var(--signal); }
.good { color: var(--ok); }

/* ---------- top bar ---------- */
.app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
.bar { display: flex; align-items: center; gap: 16px; padding: 8px 16px 8px 0; background: var(--paper); border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.bar .nation { display: flex; align-items: center; gap: 12px; padding-left: 14px; border-left: 8px solid var(--me); min-height: 40px; }
.bar .title { font-family: var(--f-head); font-size: 1.45rem; font-weight: 700; line-height: 1; }
.bar .sub { font-size: 0.85rem; color: var(--muted); }
.bar .turn { font-family: var(--f-head); font-size: 1.15rem; }
.bar .spacer { flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: nowrap; margin-left: auto; align-items: center; padding: 0 0 0 16px; }
.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 4px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--rule-soft); font-size: 0.82rem; }
.chip i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0, 0, 0, 0.35); }
.chip.done { background: var(--ok-soft); border-color: #9cc3a6; }
.res { display: flex; gap: 14px; font-size: 0.9rem; }
.res b { font-family: var(--f-head); font-size: 1.1rem; font-weight: 600; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 5px 11px; cursor: pointer; line-height: 1.25; }
.btn:hover { background: #fff; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { background: #2f3b33; }
.btn.brass { background: var(--brass); border-color: #8a6914; color: #fff; }
.btn.danger { color: var(--signal); border-color: #d4a19c; }
.btn.small { padding: 2px 8px; font-size: 0.84rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; cursor: pointer; font-size: 0.85rem; }
.x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 0 4px; }
.x:hover { color: var(--signal); }

/* ---------- tabs ---------- */
.tabs { display: flex; align-items: center; gap: 2px; padding: 0 12px; background: var(--paper-2); border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 13px 8px; font-family: var(--f-head); font-size: 1.04rem; cursor: pointer; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--brass); font-weight: 600; }
.tabs .count { font-size: 0.78rem; background: var(--brass-soft); border-radius: 8px; padding: 0 6px; margin-left: 4px; }

/* ---------- layout ---------- */
.main { min-height: 0; overflow: auto; }
.page { padding: 18px 22px 40px; max-width: 1400px; }
.split { display: grid; grid-template-columns: 1fr 370px; height: 100%; min-height: 0; }
.mapwrap { position: relative; background: var(--sea); overflow: hidden; min-height: 300px; touch-action: none; }
.mapwrap svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
.mapwrap svg.drag { cursor: grabbing; }
.maptools { position: absolute; left: 10px; top: 10px; display: flex; gap: 4px; }
.maptools .btn { background: rgba(238, 241, 235, 0.92); }
.modebar { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--brass); color: #fff; padding: 6px 12px; border-radius: 6px; display: flex; gap: 10px; align-items: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); font-size: 0.92rem; }
.modebar .btn { background: #fff; color: var(--ink); }
.legend { position: absolute; left: 10px; bottom: 10px; background: rgba(238, 241, 235, 0.94); border-radius: 6px; padding: 8px 10px; font-size: 0.78rem; display: grid; grid-template-columns: repeat(2, auto); gap: 2px 14px; max-width: 360px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 12px; display: inline-block; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.side { background: var(--paper); border-left: 1px solid var(--rule); overflow-y: auto; padding: 14px 16px 30px; }
.side section { border-top: 1px solid var(--rule-soft); padding-top: 10px; margin-top: 12px; }
.side section:first-child { border-top: 0; margin-top: 0; padding-top: 0; }

/* ---------- tables ---------- */
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
th { font-family: var(--f-head); font-weight: 600; font-size: 0.95rem; border-bottom: 1.5px solid var(--rule); background: var(--paper-2); position: sticky; top: 0; z-index: 1; }
td.n, th.n { text-align: right; font-family: var(--f-head); font-variant-numeric: tabular-nums; }
tr.sub td { background: var(--paper-2); font-family: var(--f-head); font-weight: 600; }
.ledger { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; overflow: auto; }
.ledger + .ledger { margin-top: 14px; }
.full { color: var(--signal); font-weight: 600; }
.near { color: #8a6914; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 0.92rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.goodsgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px 12px; font-size: 0.86rem; }
.goodsgrid div { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--rule-soft); }
.goodsgrid .z { color: var(--muted); }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: middle; }
.pdot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0, 0, 0, 0.35); }
.tag { display: inline-block; font-size: 0.78rem; padding: 0 7px; border-radius: 9px; background: var(--paper-2); border: 1px solid var(--rule-soft); }
.tag.war { background: var(--signal-soft); border-color: #dca7a1; color: var(--signal); }
.tag.ok { background: var(--ok-soft); border-color: #9cc3a6; color: var(--ok); }
.tag.brass { background: var(--brass-soft); border-color: #d9c27c; }

/* ---------- forms & lists ---------- */
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
input[type=number], input[type=text], select { border: 1px solid var(--rule); border-radius: 5px; background: #fff; padding: 3px 6px; }
input[type=number] { width: 70px; }
input.w-sm { width: 56px; }
label.ck { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; padding: 4px 0; border-bottom: 1px dotted var(--rule-soft); font-size: 0.9rem; }
.unitrow { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 5px; padding: 3px 6px; cursor: pointer; }
.unitrow:hover { background: var(--paper-2); }
.unitrow.on { border-color: var(--brass); background: var(--brass-soft); }
.menu-actions { display: grid; gap: 4px; }
.buildlist { display: grid; gap: 3px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
.buildlist .opt { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--rule-soft); background: #fff; }
.buildlist .opt .cost { grid-column: 1 / 2; font-size: 0.78rem; color: var(--muted); }
.buildlist .opt.no { opacity: 0.55; }
.notice { background: var(--brass-soft); border: 1px solid #d9c27c; border-radius: 6px; padding: 8px 12px; margin: 0 0 12px; }
.notice.bad { background: var(--signal-soft); border-color: #dca7a1; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; align-items: start; }
.panel { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; }
.goodsform { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; }
.goodsform label { display: flex; justify-content: space-between; gap: 6px; font-size: 0.86rem; align-items: center; }
.reports .turnhead { font-family: var(--f-head); font-size: 1.15rem; margin: 16px 0 4px; }
.reports li { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 4px 0; border-bottom: 1px dotted var(--rule-soft); }
.cat { font-size: 0.78rem; text-align: center; border-radius: 9px; padding: 1px 6px; background: var(--paper-2); height: fit-content; }
.cat.conflict, .cat.supply, .cat.shortfall { background: var(--signal-soft); color: var(--signal); }
.cat.combat { background: #f0dccc; }
.cat.diplomacy { background: #dde3f1; }
.cat.logistics { background: var(--brass-soft); }
.cat.market { background: #e3ecd9; }
.prio li { padding: 2px 0; }
.menu { position: absolute; right: 12px; top: 56px; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.2); padding: 8px; z-index: 30; display: grid; gap: 4px; min-width: 230px; }
.menu hr { border: 0; border-top: 1px solid var(--rule-soft); margin: 4px 0; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 6px; z-index: 50; }
.gameover { background: var(--ink); color: var(--paper); padding: 10px 16px; font-family: var(--f-head); font-size: 1.15rem; }

/* ---------- setup ---------- */
.setup { max-width: 760px; margin: 40px auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 26px 30px; }
.setup h1 { font-size: 2.6rem; line-height: 1; margin-bottom: 6px; }
.setup .lede { color: var(--ink-2); margin-bottom: 18px; }
.players { display: grid; gap: 6px; margin: 10px 0 16px; }
.players .prow { display: grid; grid-template-columns: 26px 1fr 1fr 44px; gap: 8px; align-items: center; }
.players .prow:has(input[id^=sp-pin]) { grid-template-columns: 26px 1fr 1fr 96px 44px; }
.setup.login { max-width: 460px; }
.menu table td { padding: 2px 4px; }
.players input[type=color] { width: 40px; height: 30px; border: 1px solid var(--rule); border-radius: 5px; padding: 1px; background: #fff; }

/* ---------- svg map ---------- */
.hx { stroke: rgba(30, 38, 32, 0.28); stroke-width: 0.6; }
.glyph { font-size: 11px; fill: rgba(20, 24, 20, 0.55); text-anchor: middle; dominant-baseline: central; }
.lbl { font-family: var(--f-head); font-weight: 600; font-size: 11px; fill: #fff; paint-order: stroke; stroke: rgba(20, 26, 22, 0.85); stroke-width: 3px; text-anchor: middle; }
.blbl { font-family: var(--f-head); font-weight: 600; font-size: 8.5px; text-anchor: middle; dominant-baseline: central; fill: #fff; }
.tok { font-family: var(--f-head); font-weight: 700; font-size: 9px; text-anchor: middle; dominant-baseline: central; }

@media (max-width: 900px) {
  .split { grid-template-columns: 1fr; grid-template-rows: 60vh auto; }
  .side { border-left: 0; border-top: 1px solid var(--rule); }
  .bar { padding: 8px 12px 8px 0; gap: 10px; }
  .bar > :not(.nation) { margin-left: 12px; }
  .res { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .tabs button { transition: color 0.12s; }
}

</style>
<script>
/* Campaign server settings. The game rules (costs, production, damage, starting
   stock...) are in rules.js; the auto-resolve time is in wrangler.jsonc. */
window.SUPPLY_LINES_CONFIG = {
  title: 'Guns, Pacts, and Commerce',
  CAMPAIGN_API: '/api',
  POLL_SECONDS: 45,
};
</script>
</head>
<body>
<div id="app"><p style="padding:24px">Loading…</p></div>
<script src="rules.js"></script>
<script src="engine.js"></script>
<script>
/* ---- ui-core.js ---- */
/* =====================================================================
   SUPPLY LINES — INTERFACE: state, sync, map, header and actions
   ===================================================================== */
const CONFIG = Object.assign({ title: 'Guns, Pacts, and Commerce', CAMPAIGN_API: '', SERVER_URL: '', STATE_URL: '', POLL_SECONDS: 30 }, (typeof window !== 'undefined' && window.SUPPLY_LINES_CONFIG) || {});
const RR = RULES, Q = Engine.q, HX = Engine.hex;
const BLD = RR.BUILDINGS, UNI = RR.UNITS;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const GN = (g) => RR.GOOD_NAMES[g] || g;
const gl = (g) => GN(g).toLowerCase();
const clone = (o) => JSON.parse(JSON.stringify(o));
const fmtGoods = (o) => Object.entries(o || {}).filter(([, v]) => v > 0).map(([g, v]) => `${v} ${gl(g)}`).join(', ');
const costText = (cost) => [cost.mp ? `${cost.mp} manpower` : null, ...Object.entries(cost).filter(([g]) => g !== 'mp').map(([g, v]) => `${v} ${gl(g)}`)].filter(Boolean).join(', ');

const UI = {
  bundle: null, me: 0, locked: false, tab: 'map', sel: null, mode: null, views: {}, menu: false,
  reportCat: 'all', routeEdit: null, marketCity: null, toast: null, hl: { move: new Map(), attack: new Set(), build: new Set() },
};
const st = () => UI.bundle.state;
const meP = () => st().players[UI.me];
const pcol = (id) => (st().players[id] ? st().players[id].color : '#888');
const pname = (id) => (st().players[id] ? st().players[id].name : '?');
const cityName = (id) => { const c = Q.cityById(st(), id); return c ? c.name : `city #${id}`; };
const tl = (t) => Q.tileLabel(st(), t);
const uname = (id) => { const u = Q.unitById(st(), id); return u ? Q.unitName(u) : `unit #${id}`; };
function textOn(hex) {
  const h = hex.replace('#', ''); const r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#1e2620' : '#ffffff';
}
function toast(msg) { UI.toast = msg; renderToast(); clearTimeout(UI._tt); UI._tt = setTimeout(() => { UI.toast = null; renderToast(); }, 2600); }
function renderToast() { let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); } el.className = UI.toast ? 'toast' : ''; el.textContent = UI.toast || ''; el.setAttribute('role', 'status'); }
function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function pickFiles(multiple) {
  return new Promise((resolve) => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json'; inp.multiple = !!multiple;
    inp.onchange = async () => { const out = []; for (const f of inp.files) { try { out.push(JSON.parse(await f.text())); } catch (e) { toast(`${f.name} is not valid JSON`); } } resolve(out); };
    inp.click();
  });
}

/* ---------------------------------------------------------------------
   SYNC — where the shared game lives. A "bundle" is { state, pending },
   pending[playerId] = { orders, turn, at }.
   - This browser (default): everything in localStorage; pass-and-play.
   - SERVER_URL: GET {url}/game -> bundle, PUT {url}/game (bundle),
                 PUT {url}/orders/{playerId} ({ orders, turn }).
   - STATE_URL (e.g. 'state.json' in your GitHub repo): read-only state;
                 players download their orders file and send it to the host.
   --------------------------------------------------------------------- */
const Sync = (() => {
  const KEY = 'supplylines.bundle';
  const local = {
    mode: 'local', label: 'Saved in this browser',
    async load() { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; },
    async publish(bundle) { localStorage.setItem(KEY, JSON.stringify(bundle)); },
    async submit(bundle, pid, orders) { bundle.pending[pid] = { orders, turn: bundle.state.turn, at: Date.now() }; await this.publish(bundle); return bundle; },
  };
  const server = {
    mode: 'server', label: 'Synced with server',
    async load() { const r = await fetch(`${CONFIG.SERVER_URL}/game`, { cache: 'no-store' }); if (r.status === 404) return null; if (!r.ok) throw new Error(`Server returned ${r.status}`); return r.json(); },
    async publish(bundle) { const r = await fetch(`${CONFIG.SERVER_URL}/game`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bundle) }); if (!r.ok) throw new Error(`Server returned ${r.status}`); },
    async submit(bundle, pid, orders) {
      const r = await fetch(`${CONFIG.SERVER_URL}/orders/${pid}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orders, turn: bundle.state.turn }) });
      if (!r.ok) throw new Error(`Server returned ${r.status}`);
      return (await this.load()) || bundle;
    },
  };
  const file = {
    mode: 'file', label: 'Shared state file',
    async load() { const r = await fetch(`${CONFIG.STATE_URL}${CONFIG.STATE_URL.includes('?') ? '&' : '?'}v=${Date.now()}`, { cache: 'no-store' }); if (!r.ok) return null; return r.json(); },
    async publish(bundle) { download('state.json', bundle); localStorage.setItem(KEY, JSON.stringify(bundle)); },
    async submit(bundle, pid, orders) {
      download(`orders-p${pid + 1}-turn${bundle.state.turn}.json`, { player: pid, turn: bundle.state.turn, orders });
      bundle.pending[pid] = { orders, turn: bundle.state.turn, at: Date.now() };
      return bundle;
    },
  };
  // The campaign server: one running campaign, players log in with a PIN.
  const PK = 'gpc.pin', AK = 'gpc.adminPin';
  const ls = { get: (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { /* blocked */ } } };
  const campaign = {
    mode: 'campaign', label: 'Campaign server', you: null, schedule: null,
    pin: () => ls.get(PK), adminPin: () => ls.get(AK),
    hasPin() { return !!(this.pin() || this.adminPin()); },
    setPins(pin, admin) { if (pin !== undefined) ls.set(PK, pin); if (admin !== undefined) ls.set(AK, admin); },
    logout() { ls.set(PK, ''); ls.set(AK, ''); this.you = null; },
    async call(method, path, body) {
      const r = await fetch(`${CONFIG.CAMPAIGN_API}${path}`, { method, cache: 'no-store', headers: { 'Content-Type': 'application/json', 'X-Pin': this.pin(), 'X-Admin-Pin': this.adminPin() }, body: body ? JSON.stringify(body) : undefined });
      let j = null; try { j = await r.json(); } catch (e) { j = null; }
      if (!r.ok) { const err = new Error((j && j.error) || `Server returned ${r.status}`); err.status = r.status; err.body = j; throw err; }
      return j;
    },
    take(j) { this.you = j.you || this.you; this.schedule = j.schedule || this.schedule; return j.state ? { state: j.state, pending: j.pending || {} } : null; },
    async login(pin) { return this.call('POST', '/login', { pin }); },
    async load() {
      try { return this.take(await this.call('GET', '/game')); } catch (e) { if (e.status === 404 && e.body) { this.take(e.body); return null; } throw e; }
    },
    async publish(bundle) { return this.take(await this.call('PUT', '/state', { state: bundle.state })); },
    async submit(bundle, pid, orders) { return this.take(await this.call('PUT', '/orders', { turn: bundle.state.turn, orders })) || bundle; },
    async resolve(turn) { return this.take(await this.call('POST', '/resolve', { turn })); },
    async create(state, pins, replace) { return this.take(await this.call('POST', '/campaign', { state, pins, replace: !!replace })); },
    async pins() { return (await this.call('GET', '/pins')).pins; },
    async setPin(pid, pin) { return this.call('PUT', '/pins', { pid, pin }); },
  };
  return CONFIG.CAMPAIGN_API ? campaign : CONFIG.SERVER_URL ? server : CONFIG.STATE_URL ? file : local;
})();
const isCampaign = () => Sync.mode === 'campaign';
const isAdmin = () => isCampaign() && !!(Sync.you && Sync.you.admin);
const canPlay = () => !isCampaign() || !!(Sync.you && Sync.you.role === 'player');
function scheduleText() {
  const sc = Sync.schedule; if (!sc) return '';
  const h = sc.hour % 12 || 12, ap = sc.hour < 12 ? 'AM' : 'PM';
  return `Turns resolve automatically at ${h} ${ap} (${sc.tz.replace(/_/g, ' ')})`;
}

/* ---------- draft orders (per game, turn and player) ---------- */
function draftKey() { const S = st(); return `supplylines.draft.${S.id}.${S.turn}.${UI.me}`; }
function draft() {
  const k = draftKey();
  if (UI._dk !== k || !UI._d) {
    UI._dk = k;
    let d = null;
    try { d = JSON.parse(localStorage.getItem(k)); } catch (e) { d = null; }
    if (!d) { const pe = UI.bundle.pending[UI.me]; d = pe && pe.turn === st().turn ? clone(pe.orders) : {}; }
    UI._d = Engine.normalizeOrders(d);
    if (d.settings) UI._d.settings = d.settings;
  }
  return UI._d;
}
function saveDraft() { try { localStorage.setItem(UI._dk, JSON.stringify(UI._d)); } catch (e) { /* storage full or blocked */ } }
function mutate(fn) { fn(draft()); saveDraft(); render(); }
function settings() { const d = draft(); if (!d.settings) d.settings = {}; return d.settings; }
function draftCount(d) { return ['attacks', 'sabotage', 'moves', 'board', 'unload', 'buys', 'sells', 'research', 'demolish', 'clear', 'builds', 'trains', 'found', 'cargo', 'routeOps', 'diplo'].reduce((n, k) => n + d[k].length, 0) + (d.settings && (d.settings.priority || ['products', 'halt', 'pay', 'labor'].some((k) => d.settings[k] && Object.keys(d.settings[k]).length)) ? 1 : 0); }
// goods and manpower already committed by this turn's orders, per city
function reserved(cityId) {
  const d = draft(), goods = {};
  let mp = 0;
  const addCost = (cost) => { for (const [g, v] of Object.entries(cost)) { if (g === 'mp') mp += v; else goods[g] = (goods[g] || 0) + v; } };
  for (const b of d.builds) if (b.city === cityId && BLD[b.key]) addCost(BLD[b.key].cost);
  for (const t of d.trains) if (t.city === cityId && UNI[t.type]) addCost(UNI[t.type].cost);
  for (const s of d.sells) if (s.city === cityId) goods[s.good] = (goods[s.good] || 0) + Number(s.amount || 0);
  for (const c of d.cargo) if (c.city === cityId && c.amount > 0) goods[c.good] = (goods[c.good] || 0) + Number(c.amount);
  for (const o of d.clear) { const oc = Q.tileOwnerCity(st(), o.t); if (oc && oc.id === cityId) goods.tools = (goods.tools || 0) + RR.CLEAR_FOREST.tools; }
  return { goods, mp };
}
function reservedMp() {
  const d = draft(); let mp = 0;
  for (const b of d.builds) if (BLD[b.key]) mp += BLD[b.key].cost.mp || 0;
  for (const t of d.trains) if (UNI[t.type]) mp += UNI[t.type].cost.mp || 0;
  if (d.found.length) mp += RR.CITY.foundMp * d.found.length;
  mp += RR.DEMOLISH.mp * d.demolish.length;
  mp += RR.CLEAR_FOREST.mp * d.clear.length;
  return mp;
}

/* ---------- bundle helpers ---------- */
function activePlayers() { return st().players.filter((p) => !p.eliminated); }
function submitted(pid) { const pe = UI.bundle.pending[pid]; return !!(pe && pe.turn === st().turn); }
function allSubmitted() { return activePlayers().every((p) => submitted(p.id)); }

/* =====================================================================
   MAP
   ===================================================================== */
const HS = 24, SQ3 = Math.sqrt(3), PAD = 8;
const CORN = [0, 1, 2, 3, 4, 5].map((k) => { const a = (Math.PI / 180) * (60 * k - 30); return [HS * Math.cos(a), HS * Math.sin(a)]; });
function center(m, i) { const c = i % m.w, r = Math.floor(i / m.w); return [HS * SQ3 * (c + 0.5 * (r & 1)) + (HS * SQ3) / 2 + PAD, HS * 1.5 * r + HS + PAD]; }
const hexPts = (x, y, s = 1) => CORN.map(([dx, dy]) => `${(x + dx * s).toFixed(1)},${(y + dy * s).toFixed(1)}`).join(' ');
function mapSize(m) { return [HS * SQ3 * (m.w + 0.5) + PAD * 2, HS * 1.5 * (m.h - 1) + HS * 2 + PAD * 2]; }

const d0 = () => draft();
function computeHL() {
  const S = st(), hl = { move: new Map(), attack: new Set(), build: new Set() };
  UI.hl = hl;
  if (UI.mode) {
    const md = UI.mode;
    if (md.kind === 'build') {
      const d = BLD[md.key], c = Q.cityById(S, md.city);
      const pool = d.place === 'tile' ? S.map.tiles.map((x, i) => i).filter((i) => S.map.tiles[i].owner === c.id) : S.map.tiles.map((x, i) => i);
      const taken = new Set(draft().builds.filter((b) => b.t != null && (BLD[b.key].place !== 'infra' || b.key === md.key)).map((b) => b.t));
      for (const t of pool) if (!taken.has(t) && !Q.checkBuild(S, UI.me, { city: c.id, key: md.key, t })) hl.build.add(t);
    } else if (md.kind === 'weapon') {
      for (const t of Q.cityWeaponTargets(S, Q.cityById(S, md.city), md.w)) hl.attack.add(t);
    } else if (md.kind === 'unload') {
      const u = Q.unitById(S, md.unit), tr = u && Q.unitById(S, u.carriedBy);
      if (tr) for (const t of HX.nbrs(S.map, tr.t).concat([tr.t])) {
        const probe = Object.assign({}, u, { carriedBy: null });
        const c = Q.cityAt(S, t);
        if (Q.canEnter(S, probe, t, { final: true }) && !(c && !Q.friendly(S, c.owner, UI.me)) && Q.slotFree(S, probe, t)) hl.build.add(t);
      }
    } else if (md.kind === 'cede' && UI.peace) {
      const pd = UI.peace;
      S.map.tiles.forEach((tile, t) => {
        const oc = Q.tileOwnerCity(S, t);
        if (!oc || oc.t === t) return;
        if ((oc.owner === UI.me && !pd.give.cities.includes(oc.id)) || (oc.owner === pd.to && !pd.get.cities.includes(oc.id))) hl.build.add(t);
      });
    }
    return;
  }
  const u = UI.sel && UI.sel.unit != null ? Q.unitById(S, UI.sel.unit) : null;
  if (!u || u.owner !== UI.me || u.carriedBy != null || S.gameOver || !Q.isReady(u)) return;
  if (d0().sabotage.some((o) => o.unit === u.id)) return;
  if (u.route == null) {
    for (const [t, path] of Q.reachable(S, u)) {
      if (!Q.slotFree(S, u, t)) continue;
      hl.move.set(t, path);
    }
  }
  for (const t of Q.attackTargets(S, u)) hl.attack.add(t);
}

function unitToken(u, x, y, small) {
  const d = UNI[u.type], col = pcol(u.owner), fg = textOn(col);
  const hp = u.hp / d.hp;
  const ring = u.id === (UI.sel && UI.sel.unit) ? '<circle r="13" fill="none" stroke="#fff" stroke-width="2.2"/>' : '';
  let shape;
  if (d.cls === 'ship') shape = `<path d="M-11,-5 L11,-5 L7,6 L-7,6 Z" fill="${col}" stroke="#141a16" stroke-width="1.2"/>`;
  else if (d.role === 'logistic') shape = `<rect x="${small ? -8 : -10}" y="-6" width="${small ? 16 : 20}" height="12" rx="2.5" fill="${col}" stroke="#141a16" stroke-width="1.1"/>`;
  else shape = `<circle r="${small ? 7 : 9.5}" fill="${col}" stroke="#141a16" stroke-width="1.3"/>`;
  const bar = hp < 1 ? `<rect x="-9" y="${small ? 8 : 10}" width="18" height="3" fill="#1e2620"/><rect x="-9" y="${small ? 8 : 10}" width="${(18 * Math.max(0, hp)).toFixed(1)}" height="3" fill="${hp > 0.5 ? '#6fbf7f' : hp > 0.25 ? '#e2b33c' : '#d6463e'}"/>` : '';
  const cargo = Q.carried(st(), u).length ? `<circle cx="9" cy="-7" r="5" fill="#fff" stroke="#141a16" stroke-width="0.8"/><text class="tok" x="9" y="-7" fill="#141a16" style="font-size:7px">${Q.carried(st(), u).length}</text>` : '';
  return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})">${ring}${shape}<text class="tok" fill="${fg}" style="font-size:${small ? 7.5 : 9}px">${d.abbr}</text>${bar}${cargo}</g>`;
}

function buildMapSvg(kind) {
  const S = st(), m = S.map, n = m.tiles.length, out = [];
  const [W, H] = mapSize(m);
  const flow = kind === 'flow';
  const tileOwnerP = (i) => { const o = m.tiles[i].owner; if (o == null) return null; const c = Q.cityById(S, o); return c ? c.owner : null; };
  out.push(`<defs>
    <marker id="arr-brass" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2d37a"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b5e"/></marker>
    ${RR.GOODS.map((g) => `<marker id="arr-${g}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${RR.GOOD_COLORS[g]}"/></marker>`).join('')}
  </defs>`);
  out.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="#24405a"/>`);
  // tiles
  out.push(`<g${flow ? ' opacity="0.55"' : ''}>`);
  for (let i = 0; i < n; i++) { const [x, y] = center(m, i); out.push(`<polygon class="hx" data-t="${i}" points="${hexPts(x, y)}" fill="${RR.TILES[m.tiles[i].type].color}"/>`); }
  out.push('</g><g pointer-events="none">');
  // territory tint
  for (let i = 0; i < n; i++) { const p = tileOwnerP(i); if (p == null) continue; const [x, y] = center(m, i); out.push(`<polygon points="${hexPts(x, y)}" fill="${pcol(p)}" opacity="${flow ? 0.08 : 0.11}"/>`); }
  // glyphs
  if (!flow) for (let i = 0; i < n; i++) { const tt = RR.TILES[m.tiles[i].type], g = tt.glyph; if (!g) continue; const [x, y] = center(m, i); out.push(`<text class="glyph" x="${x - 8}" y="${y - 6}"${tt.glyphColor ? ` style="fill:${tt.glyphColor}"` : ''}>${g}</text>`); }
  // bridges
  for (let i = 0; i < n; i++) if (m.tiles[i].bridge) {
    const [x, y] = center(m, i), rail = m.tiles[i].bridge === 'rail';
    out.push(`<g transform="translate(${x},${y})"><rect x="-13" y="-5" width="26" height="10" fill="${rail ? '#6f7880' : '#9c7a52'}" stroke="#2b2b2b" stroke-width="1"/><line x1="-13" y1="-5" x2="13" y2="-5" stroke="#2b2b2b"/><line x1="-13" y1="5" x2="13" y2="5" stroke="#2b2b2b"/>${rail ? '<line x1="-11" y1="0" x2="11" y2="0" stroke="#e6dcc8" stroke-width="1.6" stroke-dasharray="2 2"/>' : ''}</g>`);
  }
  // rails
  const railish = (i) => m.tiles[i].rail != null || !!Q.cityAt(S, i);
  for (let i = 0; i < n; i++) {
    if (!railish(i)) continue;
    for (const j of HX.nbrs(m, i)) {
      if (j < i || !railish(j) || (m.tiles[i].rail == null && m.tiles[j].rail == null)) continue;
      const [x1, y1] = center(m, i), [x2, y2] = center(m, j);
      out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2b221b" stroke-width="4" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#c8b59a" stroke-width="1.4" stroke-dasharray="2 3"/>`);
    }
  }
  // who built the railroads and bridges that lie outside every nation's territory
  for (let i = 0; i < n; i++) {
    const tile = m.tiles[i];
    if (tileOwnerP(i) != null || Q.cityAt(S, i)) continue;
    const owner = tile.bridge ? tile.bridgeBy : tile.rail;
    if (owner == null) continue;
    const [x, y] = center(m, i);
    out.push(`<g transform="translate(${x + 9},${y - 10})"><line x1="0" y1="0" x2="0" y2="9" stroke="#2b2b2b" stroke-width="1.2"/><path d="M0 0 L8 2.5 L0 5 Z" fill="${pcol(owner)}" stroke="#2b2b2b" stroke-width="0.6"><title>Built by ${esc(pname(owner))}</title></path></g>`);
  }
  // borders
  for (let i = 0; i < n; i++) {
    const p = tileOwnerP(i); if (p == null) continue;
    const [x, y] = center(m, i), dd = HX.dirs(m, i);
    for (let k = 0; k < 6; k++) {
      const j = dd[k]; const q = j < 0 ? null : tileOwnerP(j);
      if (q === p) continue;
      const a = CORN[k], b = CORN[(k + 1) % 6], s = 0.9;
      out.push(`<line x1="${(x + a[0] * s).toFixed(1)}" y1="${(y + a[1] * s).toFixed(1)}" x2="${(x + b[0] * s).toFixed(1)}" y2="${(y + b[1] * s).toFixed(1)}" stroke="${pcol(p)}" stroke-width="3.2" stroke-linecap="round"/>`);
    }
  }
  // tile buildings and traps
  for (const b of S.buildings) {
    if (BLD[b.key].place !== 'tile') continue;
    const [x, y] = center(m, b.t);
    const idle = b.status && b.status.startsWith('Idle');
    out.push(`<g transform="translate(${x},${y - 11})"><rect x="-11" y="-6" width="22" height="12" rx="3" fill="${idle ? '#7a2b26' : '#1e2620'}" opacity="0.88"/><text class="blbl">${BLD[b.key].abbr}</text></g>`);
  }
  for (let i = 0; i < n; i++) if (m.tiles[i].trap != null) { const [x, y] = center(m, i); out.push(`<text x="${x + 11}" y="${y - 6}" style="font-size:12px;font-weight:700" fill="#1e2620" text-anchor="middle">✕</text>`); }
  // cities
  for (const c of S.cities) {
    const [x, y] = center(m, c.t), col = pcol(c.owner), mh = Q.maxHp(S, c);
    out.push(`<g transform="translate(${x},${y})"><rect x="-9" y="-9" width="18" height="18" rx="2" fill="${col}" stroke="#141a16" stroke-width="1.6"/><rect x="-4" y="-4" width="8" height="8" fill="#fff" opacity="0.9"/>
      <text class="lbl" y="-14">${esc(c.name)}</text><text class="lbl" y="22" style="font-size:9.5px">${c.hp}/${mh}</text></g>`);
  }
  // units
  if (!flow || true) {
    const byTile = new Map();
    for (const u of S.units) if (u.carriedBy == null) { if (!byTile.has(u.t)) byTile.set(u.t, []); byTile.get(u.t).push(u); }
    for (const [t, list] of byTile) {
      const [x, y] = center(m, t), city = !!Q.cityAt(S, t);
      const combat = list.filter((u) => UNI[u.type].role === 'combat');
      const logi = list.filter((u) => UNI[u.type].role !== 'combat');
      combat.slice(0, 2).forEach((u, k) => out.push(unitToken(u, x + (city ? 10 : 0) + k * 6, y + (city ? 9 : 2) + k * 3, false)));
      logi.slice(0, 3).forEach((u, k) => out.push(unitToken(u, x - 11 + k * 11, y + (city || combat.length ? 14 : 4), true)));
      if (logi.length > 3) out.push(`<text class="lbl" x="${x + 16}" y="${y + 18}" style="font-size:9px">+${logi.length - 3}</text>`);
    }
  }
  // overlays
  if (!flow) {
    const sel = UI.sel;
    for (const t of UI.hl.build) { const [x, y] = center(m, t); out.push(`<polygon points="${hexPts(x, y, 0.9)}" fill="rgba(242,211,122,0.28)" stroke="#f2d37a" stroke-width="2"/>`); }
    for (const [t] of UI.hl.move) { const [x, y] = center(m, t); out.push(`<polygon points="${hexPts(x, y, 0.88)}" fill="rgba(255,255,255,0.18)" stroke="#fdf4d0" stroke-width="1.4"/>`); }
    for (const t of UI.hl.attack) { const [x, y] = center(m, t); out.push(`<polygon points="${hexPts(x, y, 0.88)}" fill="rgba(214,70,62,0.25)" stroke="#ff6b5e" stroke-width="2"/>`); }
    if (sel) { const [x, y] = center(m, sel.t); out.push(`<polygon points="${hexPts(x, y, 0.97)}" fill="none" stroke="#fff" stroke-width="2.6"/>`); }
    // my planned orders
    const d = draft();
    for (const mv of d.moves) {
      const pts = mv.path.map((t) => center(m, t).map((v) => v.toFixed(1)).join(',')).join(' ');
      out.push(`<polyline points="${pts}" fill="none" stroke="#1e2620" stroke-width="5" opacity="0.5" stroke-linejoin="round"/><polyline points="${pts}" fill="none" stroke="#f2d37a" stroke-width="2.6" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arr-brass)"/>`);
    }
    for (const a of d.attacks) {
      const from = a.unit != null ? (Q.unitById(S, a.unit) || {}).t : (Q.cityById(S, a.city) || {}).t;
      if (from == null) continue;
      const [x1, y1] = center(m, from), [x2, y2] = center(m, a.t);
      out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ff6b5e" stroke-width="2.6" marker-end="url(#arr-red)"/>`);
    }
    for (const b of d.builds) {
      if (b.t == null) continue;
      const [x, y] = center(m, b.t);
      out.push(`<polygon points="${hexPts(x, y, 0.8)}" fill="none" stroke="#f2d37a" stroke-width="2" stroke-dasharray="4 3"/><g transform="translate(${x},${y + 11})"><rect x="-12" y="-6" width="24" height="12" rx="3" fill="#a8801f"/><text class="blbl">+${esc(BLD[b.key].abbr || BLD[b.key].name.slice(0, 3))}</text></g>`);
    }
    for (const dm of d.demolish) {
      const [x, y] = center(m, dm.t);
      out.push(`<polygon points="${hexPts(x, y, 0.8)}" fill="rgba(163,49,43,0.18)" stroke="#ff6b5e" stroke-width="2" stroke-dasharray="4 3"/><text x="${x}" y="${y + 4}" text-anchor="middle" style="font-size:16px;font-weight:700" fill="#ff6b5e">✕</text>`);
    }
    for (const o of d.clear) {
      const [x, y] = center(m, o.t);
      out.push(`<polygon points="${hexPts(x, y, 0.8)}" fill="rgba(194,160,82,0.25)" stroke="#e0b860" stroke-width="2" stroke-dasharray="4 3"/><text x="${x}" y="${y + 5}" text-anchor="middle" style="font-size:14px;font-weight:700" fill="#f2d37a">🪓</text>`);
    }
    if (UI.peace) {
      for (const [list, col] of [[UI.peace.give.tiles, '#f2d37a'], [UI.peace.get.tiles, '#8fe0ff']]) for (const t of list) {
        const [x, y] = center(m, t);
        out.push(`<polygon points="${hexPts(x, y, 0.78)}" fill="${col}" fill-opacity="0.35" stroke="${col}" stroke-width="2.4"/>`);
      }
    }
    for (const un of d.unload) {
      const u = Q.unitById(S, un.unit); if (!u) continue;
      const [x1, y1] = center(m, Q.posOf(S, u)), [x2, y2] = center(m, un.t);
      out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f2d37a" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-brass)"/>`);
    }
  } else {
    out.push(flowOverlay());
  }
  out.push('</g>');
  return { W, H, body: out.join('') };
}

function routeTiles(r) {
  const S = st(), from = Q.cityById(S, r.from), to = r.to.type === 'city' ? Q.cityById(S, r.to.id) : Q.unitById(S, r.to.id);
  if (!from || !to) return null;
  const u = r.transports.map((id) => Q.unitById(S, id)).find(Boolean) || { type: 'caravan', owner: r.owner, cargo: {} };
  return Q.findPath(S, u, from.t, to.t, { partner: r.partner, ignoreUnits: true });
}
function visibleRoutes() { const S = st(); return S.routes.filter((r) => r.owner === UI.me || r.partner === UI.me); }
function flowOverlay() {
  const S = st(), m = S.map, out = [];
  visibleRoutes().forEach((r, k) => {
    const path = routeTiles(r);
    if (!path || path.length < 2) return;
    const off = ((k % 3) - 1) * 3;
    const pts = path.map((t) => { const [x, y] = center(m, t); return `${(x + off).toFixed(1)},${(y + off).toFixed(1)}`; });
    const goods = Object.keys(r.goods);
    const g = goods[0] || 'food';
    const est = Q.routeEstimate(S, r);
    out.push(`<polyline points="${pts.join(' ')}" fill="none" stroke="#141a16" stroke-width="7" opacity="0.55" stroke-linejoin="round"/>`);
    out.push(`<polyline points="${pts.join(' ')}" fill="none" stroke="${RR.GOOD_COLORS[g]}" stroke-width="4" stroke-linejoin="round" marker-end="url(#arr-${g})" ${r.accepted ? '' : 'stroke-dasharray="6 5"'}/>`);
    if (Object.keys(r.back || {}).length) {
      const bg = Object.keys(r.back)[0];
      const back = path.slice().reverse().map((t) => { const [x, y] = center(m, t); return `${(x - off - 5).toFixed(1)},${(y - off + 5).toFixed(1)}`; });
      out.push(`<polyline points="${back.join(' ')}" fill="none" stroke="${RR.GOOD_COLORS[bg]}" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arr-${bg})"/>`);
    }
    const mid = center(m, path[Math.floor(path.length / 2)]);
    const label = r.rule === 'stock' ? `#${r.id} keep ${fmtGoods(r.goods)}` : `#${r.id} ${fmtGoods(r.goods)}/turn`;
    out.push(`<text class="lbl" x="${mid[0]}" y="${mid[1] - 14}" style="font-size:10px">${esc(label)} (capacity ${est.perTurn}/turn)</text>`);
  });
  return out.join('');
}

/* ---------- pan & zoom ---------- */
function fitView(kind) {
  const [W, H] = mapSize(st().map);
  UI.views[kind] = { x: 0, y: 0, w: W, h: H };
}
function attachMap(svg, kind) {
  let drag = null;
  const v = () => UI.views[kind];
  const apply = () => svg.setAttribute('viewBox', `${v().x} ${v().y} ${v().w} ${v().h}`);
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = svg.getBoundingClientRect(), V = v();
    const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    const k = e.deltaY > 0 ? 1.15 : 1 / 1.15;
    const [W] = mapSize(st().map);

/* ---------- map clicks ---------- */
function onTileClick(t) {
  const S = st();
  if (S.gameOver && UI.mode) UI.mode = null;
  if (UI.mode) {
    const md = UI.mode;
    if (md.kind === 'build' && UI.hl.build.has(t)) {
      mutate((d) => d.builds.push({ city: md.city, key: md.key, t }));
      if (md.key !== 'railroad') UI.mode = null;
      computeHL(); render(); return;
    }
    if (md.kind === 'weapon' && UI.hl.attack.has(t)) {
      UI.mode = null;
      mutate((d) => { d.attacks = d.attacks.filter((a) => !(a.city === md.city && a.w === md.w)); d.attacks.push({ city: md.city, w: md.w, t }); });
      return;
    }
    if (md.kind === 'cede' && UI.peace) {
      const oc = Q.tileOwnerCity(S, t);
      if (UI.hl.build.has(t) && oc) {
        const part = oc.owner === UI.me ? UI.peace.give : UI.peace.get;
        part.tiles = part.tiles.includes(t) ? part.tiles.filter((x) => x !== t) : [...part.tiles, t];
        computeHL(); render(); return;
      }
      toast(`Click a tile held by you or ${pname(UI.peace.to)}, other than a city.`);
      return;
    }
    if (md.kind === 'unload' && UI.hl.build.has(t)) {
      UI.mode = null;
      mutate((d) => { d.unload = d.unload.filter((x) => x.unit !== md.unit); d.unload.push({ unit: md.unit, t }); });
      return;
    }
    toast('That tile is not a valid choice. Press Esc to cancel.');
    return;
  }
  const su = UI.sel && UI.sel.unit != null ? Q.unitById(S, UI.sel.unit) : null;
  if (su && su.owner === UI.me && t !== su.t) {
    if (UI.hl.attack.has(t)) { mutate((d) => { d.attacks = d.attacks.filter((a) => a.unit !== su.id); d.attacks.push({ unit: su.id, t }); }); return; }
    if (UI.hl.move.has(t)) { const path = UI.hl.move.get(t); mutate((d) => { d.moves = d.moves.filter((m) => m.unit !== su.id); d.moves.push({ unit: su.id, path }); }); return; }
  }
  const units = Q.unitsAt(S, t);
  let unit = null;
  if (UI.sel && UI.sel.t === t && units.length) {
    const i = units.findIndex((u) => u.id === UI.sel.unit);
    unit = units[(i + 1) % units.length].id;
  } else {
    const pick = units.find((u) => u.owner === UI.me && UNI[u.type].role === 'combat') || units.find((u) => u.owner === UI.me) || units[0];
    unit = pick ? pick.id : null;
  }
  UI.sel = { t, unit };
  computeHL(); render();
}

  const weapons = ['fort', 'navalBattery'].filter((w) => Q.countB(S, c.id, w)).map((w) => `<button class="btn small" data-act="mode-weapon" data-city="${c.id}" data-w="${w}">Aim ${BLD[w].name.toLowerCase()}</button>`).join(' ');
  return `${head}</section>
    <section><h3>Stockpile</h3>${goodsGrid(c.stock, c)}<p class="small muted" style="margin-top:4px">Red arrows show what is left after this turn's orders.</p></section>
    <section><h3>Buildings (${blds.length})</h3><p class="small">${Object.entries(counts).map(([k, n]) => `${esc(BLD[k].short || BLD[k].name)}${n > 1 ? ` ×${n}` : ''}`).join(', ') || '<span class="muted">None yet</span>'}</p>
      ${queued.length ? `<p class="small">Queued: ${queued.map((b) => `${esc(BLD[b.key].name)}${b.t != null ? ` at ${tl(b.t)}` : ''}`).join(', ')}</p>` : ''}
      <h4>Build</h4><div class="buildlist">${opts}</div></section>
    <section><h3>Recruit</h3>${qTrain.length ? `<p class="small">Queued: ${qTrain.map((x) => esc(UNI[x.type].name)).join(', ')}</p>` : ''}<div class="buildlist">${trainOpts || '<p class="muted small">Research units first.</p>'}</div></section>
    ${weapons ? `<section><h3>Defenses</h3>${weapons}</section>` : ''}`;
}
function unitPanel(u) {
  const S = st(), dd = UNI[u.type], d = draft(), own = u.owner === UI.me;
  const mv = d.moves.find((m) => m.unit === u.id), at = d.attacks.find((a) => a.unit === u.id);
  const tr = u.carriedBy != null ? Q.unitById(S, u.carriedBy) : null;
  const aboard = Q.carried(S, u);
  const out = [`<section><h3>${esc(Q.unitName(u))} <span class="muted small">${esc(pname(u.owner))}</span></h3><dl class="kv">
    <dt>HP</dt><dd class="num">${u.hp} / ${dd.hp}</dd><dt>Move</dt><dd>${dd.move} tiles${dd.cls === 'rail' ? ' (rail only)' : ''}</dd>
    ${dd.range ? `<dt>Attack</dt><dd>range ${dd.range}, ${dd.ammo} ammo per attack</dd>` : ''}
    ${dd.cargo ? `<dt>Cargo</dt><dd>${Q.cargoUsed(u)} / ${dd.cargo}${Q.cargoUsed(u) ? `: ${esc(fmtGoods(u.cargo))}` : ''}</dd>` : ''}
    ${dd.carry ? `<dt>Carrying</dt><dd>${aboard.reduce((a, x) => a + Q.carrySlots(u, x), 0)} / ${dd.carry} slots${dd.carryTypes ? ` (${Object.entries(dd.carryTypes).map(([k, n]) => `${UNI[k].name.toLowerCase()} ${n}`).join(', ')})` : ''}${aboard.length ? `: ${aboard.map((x) => esc(Q.unitName(x))).join(', ')}` : ''}</dd>` : ''}
    ${tr ? `<dt>Aboard</dt><dd>${esc(Q.unitName(tr))}</dd>` : ''}
    ${u.route != null ? `<dt>Route</dt><dd>#${u.route} (${esc(u.leg || '')})</dd>` : ''}
    ${own && dd.role === 'combat' ? `<dt>Status</dt><dd class="small">${Q.isReady(u) ? '<b>Ready</b>' : '<b class="warn">In reserve</b>: cannot move or attack this turn'}${u.payStatus ? ` · ${esc(u.payStatus)}` : ''}</dd>` : ''}
    ${Q.inRiver(S, u) ? '<dt>River</dt><dd class="small">Wading: cannot attack until it climbs out.</dd>' : ''}
    ${own ? `<dt>Supply</dt><dd class="small">${esc(u.supply || '—')}</dd><dt>Upkeep</dt><dd class="small">${esc(fmtGoods(Q.upkeepOf(S, u, mv ? mv.path.length - 1 : 0)) || 'none (in base)')}</dd>` : ''}</dl></section>`];
  if (!own) return out.join('');
  const ord = [];
  if (mv) ord.push(`<li>Move to ${tl(mv.path[mv.path.length - 1])} (${mv.path.length - 1} tiles)<button class="x" data-act="clear" data-list="moves" data-unit="${u.id}" aria-label="Cancel move">✕</button></li>`);
  if (at) ord.push(`<li>Attack ${tl(at.t)}<button class="x" data-act="clear" data-list="attacks" data-unit="${u.id}" aria-label="Cancel attack">✕</button></li>`);
  const brd = d.board.find((b) => b.unit === u.id); if (brd) ord.push(`<li>Board ${esc(uname(brd.transport))}<button class="x" data-act="clear" data-list="board" data-unit="${u.id}">✕</button></li>`);
  const unl = d.unload.find((b) => b.unit === u.id); if (unl) ord.push(`<li>Unload at ${tl(unl.t)}<button class="x" data-act="clear" data-list="unload" data-unit="${u.id}">✕</button></li>`);
  const fnd = d.found.find((f) => f.unit === u.id); if (fnd) ord.push(`<li>Found ${esc(fnd.name)}<button class="x" data-act="clear" data-list="found" data-unit="${u.id}">✕</button></li>`);
  const acts = [];
  if (u.route != null) acts.push(`<p class="small muted">This unit runs route #${u.route} automatically. Remove it from the route in the Supply tab to move it by hand.</p>`);
  else if (u.carriedBy == null) acts.push(`<p class="small muted">${UI.hl.move.size ? 'Highlighted tiles are in reach; red tiles can be attacked.' : 'No tiles in reach.'}</p>`);
  // boarding
  if (u.carriedBy == null && u.route == null && dd.cls === 'land') {
    const trs = Q.unitsOf(S, UI.me).filter((x) => x !== u && HX.dist(S.map, x.t, u.t) <= 1 && !Q.canCarry(S, x, u));
    for (const x of trs) acts.push(`<button class="btn small" data-act="board" data-unit="${u.id}" data-tr="${x.id}">Board ${esc(Q.unitName(x))}</button>`);
  }
  if (u.carriedBy != null) acts.push(`<button class="btn small" data-act="mode-unload" data-unit="${u.id}">Unload…</button>`);
  if (dd.role === 'combat') {
    const pend = d.settings && d.settings.pay && d.settings.pay[u.id] !== undefined ? d.settings.pay[u.id] : null;
    const on = pend != null ? pend : u.pay !== false;
    const free = Q.inBase(S, u);
    acts.push(`<label class="ck small"><input type="checkbox" data-chg="pay" data-id="${u.id}" ${on ? 'checked' : ''}> Pay this unit (${Q.payOf(u)} credits a turn${free ? '; free while in base' : ''})</label>
      <p class="small muted">${on ? (Q.isReady(u) ? 'Paid at the end of each turn to stay ready.' : 'It will be paid at the end of this turn and be ready next turn.') : 'Unpaid units sit in reserve: no pay, no moving or attacking, but they can still be attacked.'}</p>`);
    const sab = d.sabotage.find((o) => o.unit === u.id);
    if (sab) ord.push(`<li>Sabotage at ${tl(sab.t)}<button class="x" data-act="clear" data-list="sabotage" data-unit="${u.id}" aria-label="Cancel sabotage">✕</button></li>`);
    else if (dd.cls === 'land' && u.carriedBy == null) {
      for (const t of [u.t, ...HX.nbrs(S.map, u.t)]) {
        const tg = Q.sabotageTarget(S, t); if (!tg) continue;
        const err = Q.checkSabotage(S, UI.me, { unit: u.id, t });
        if (!err) acts.push(`<button class="btn small danger" data-act="sabotage" data-unit="${u.id}" data-t="${t}">Destroy ${esc(pname(tg.owner))}'s ${esc(BLD[tg.what].name.toLowerCase())} at ${tl(t)}</button>`);
      }
    }
  }
  if (dd.role === 'logistic' && u.carriedBy == null) {
    const err = Q.checkFound(S, UI.me, u.id);
    acts.push(err ? `<p class="small muted">Found a city: ${esc(err)}.</p>` : `<div class="row"><input type="text" id="found-name" placeholder="City name" aria-label="New city name"><button class="btn small brass" data-act="found" data-unit="${u.id}">Found city here</button></div>`);
    const c = Q.cityAt(S, u.t);
    if (c && c.owner === UI.me && dd.cargo) {
      acts.push(`<h4>Load or unload in ${esc(c.name)}</h4><div class="row"><select id="cg-good" aria-label="Good">${RR.GOODS.map((g) => `<option value="${g}">${GN(g)} (city ${c.stock[g] || 0}, aboard ${u.cargo[g] || 0})</option>`).join('')}</select><input type="number" id="cg-amt" min="1" value="10" aria-label="Amount"></div>
        <div class="row"><button class="btn small" data-act="cargo" data-unit="${u.id}" data-city="${c.id}" data-dir="1">Load</button><button class="btn small" data-act="cargo" data-unit="${u.id}" data-city="${c.id}" data-dir="-1">Unload</button></div>`);
    }
  }
  out.push(`<section><h3>Orders</h3>${ord.length ? `<ul class="list">${ord.join('')}</ul>` : '<p class="small muted">No orders for this unit.</p>'}<div class="menu-actions" style="margin-top:6px">${acts.join('')}</div></section>`);
  return out.join('');
}

/* =====================================================================
   SUPPLY LINES — INTERFACE: tabs, actions, setup and start-up
