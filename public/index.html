const goodsInputs = (prefix, values, attrs = '') => `<div class="goodsform">${RR.GOODS.map((g) => `<label><span><i class="swatch" style="background:${RR.GOOD_COLORS[g]}"></i>${GN(g)}</span><input type="number" min="0" class="w-sm" data-chg="${prefix}" data-good="${g}" value="${values[g] || ''}" ${attrs} aria-label="${GN(g)}"></label>`).join('')}</div>`;
const playerLabel = (id) => `<span class="pdot" style="background:${pcol(id)}"></span>${esc(pname(id))}`;

/* ---------- Flow ---------- */
TAB_RENDER.flow = function () {
  const S = st(), routes = visibleRoutes();
  const rows = routes.map((r) => {
    const est = Q.routeEstimate(S, r);
    const to = r.to.type === 'city' ? cityName(r.to.id) : uname(r.to.id);
    return `<li style="display:block"><div><strong>#${r.id}</strong> ${esc(cityName(r.from))} → ${esc(to)}${r.partner != null ? ` <span class="tag brass">trade with ${esc(pname(r.owner === UI.me ? r.partner : r.owner))}</span>` : ''}</div>
      <div class="small">${r.rule === 'stock' ? 'Keep stocked: ' : 'Send per turn: '}${esc(fmtGoods(r.goods) || 'nothing set')}${Object.keys(r.back || {}).length ? `; back: ${esc(fmtGoods(r.back))}` : ''}</div>
      <div class="small muted">Capacity ${est.perTurn}/turn over ${est.len == null ? '?' : est.len} tiles, ${r.transports.length} transport${r.transports.length === 1 ? '' : 's'}. ${esc(r.status || '')}</div></li>`;
  }).join('');
  return `<div class="split"><div class="mapwrap">${mapBlock('flow')}<div class="maptools"><button class="btn small" data-act="zoom-flow" data-k="0.8">+</button><button class="btn small" data-act="zoom-flow" data-k="1.25">−</button><button class="btn small" data-act="fit" data-kind="flow">Whole map</button></div></div>
    <aside class="side"><h2>Resource flow</h2><p class="small muted">Each line runs from source to destination, colored by its first good. Dashed lines are trade routes still waiting for the partner, or goods coming back on a trade route.</p>
    <ul class="list">${rows || '<li class="muted">No routes yet. Set one up in the Supply tab.</li>'}</ul>
    <h3>Key</h3><div class="goodsgrid">${RR.GOODS.map((g) => `<div><span><i class="swatch" style="background:${RR.GOOD_COLORS[g]}"></i>${GN(g)}</span></div>`).join('')}</div></aside></div>`;
};

/* ---------- Supply ---------- */
function newRouteForm() {
  const c = Q.citiesOf(st(), UI.me)[0];
  return { id: null, from: c ? c.id : null, to: '', transports: [], rule: 'send', goods: {}, back: {}, priority: 'normal' };
}
TAB_RENDER.supply = function () {
  const S = st(), d = draft();
  if (!UI.routeEdit) UI.routeEdit = newRouteForm();
  const f = UI.routeEdit;
  const myCities = Q.citiesOf(S, UI.me);
  const myLog = Q.unitsOf(S, UI.me).filter((u) => UNI[u.type].role === 'logistic');
  const routes = visibleRoutes();
  const ops = d.routeOps;
  const routeRows = routes.map((r) => {
    const est = Q.routeEstimate(S, r), mine = r.owner === UI.me;
    const to = r.to.type === 'city' ? cityName(r.to.id) : uname(r.to.id);
    const pendingOp = ops.find((o) => o.id === r.id);
    return `<tr><td class="n">#${r.id}</td><td>${esc(cityName(r.from))} → ${esc(to)}</td><td>${r.partner != null ? playerLabel(mine ? r.partner : r.owner) : '<span class="muted">Domestic</span>'}</td>
      <td class="small">${r.transports.map((id) => esc(uname(id))).join(', ') || '<span class="warn">none</span>'}</td>
      <td>${r.rule === 'stock' ? 'Keep stocked at' : 'Send per turn'}</td><td class="small">${esc(fmtGoods(r.goods) || '—')}${Object.keys(r.back || {}).length ? `<br><span class="muted">back: ${esc(fmtGoods(r.back))}</span>` : ''}</td>
      <td>${esc(r.priority)}</td><td class="n">${est.perTurn}</td><td class="small">${esc(r.status || '')}${r.endsTurn ? ` <span class="warn">closes turn ${r.endsTurn}</span>` : ''}${pendingOp ? ` <span class="tag brass">${pendingOp.op === 'remove' ? 'closing' : 'edited'} this turn</span>` : ''}</td>
      <td>${mine ? `<button class="btn small" data-act="route-edit" data-id="${r.id}">Edit</button> ` : ''}<button class="btn small danger" data-act="route-remove" data-id="${r.id}">Close</button></td></tr>`;
  }).join('');
  const newOps = ops.filter((o) => o.op === 'create').map((o, i) => `<tr><td class="muted">new</td><td>${esc(cityName(o.from))} → ${esc(o.to.type === 'city' ? cityName(o.to.id) : uname(o.to.id))}</td><td colspan="7" class="small">${o.rule === 'stock' ? 'Keep stocked at' : 'Send per turn'} ${esc(fmtGoods(o.goods))}${Object.keys(o.back || {}).length ? `; asking ${esc(fmtGoods(o.back))}` : ''} with ${o.transports.length} transport(s)</td><td><button class="x" data-act="rm-op" data-idx="${ops.indexOf(o)}" aria-label="Remove">✕</button></td></tr>`).join('');

  // destination choices
  const toOpts = [
    `<optgroup label="Your cities">${myCities.filter((c) => c.id !== f.from).map((c) => `<option value="city:${c.id}" ${f.to === `city:${c.id}` ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>`,
    `<optgroup label="Your field supply units">${myLog.filter((u) => ['caravan', 'supplyTruck', 'train'].includes(u.type) && u.route == null).map((u) => `<option value="unit:${u.id}" ${f.to === `unit:${u.id}` ? 'selected' : ''}>${esc(Q.unitName(u))} at ${tl(u.t)}</option>`).join('')}</optgroup>`,
    `<optgroup label="Trade with another nation">${S.cities.filter((c) => c.owner !== UI.me && !S.players[c.owner].eliminated).map((c) => `<option value="city:${c.id}" ${f.to === `city:${c.id}` ? 'selected' : ''}>${esc(c.name)} (${esc(pname(c.owner))})</option>`).join('')}</optgroup>`,
  ].join('');
  const toCity = f.to.startsWith('city:') ? Q.cityById(S, Number(f.to.slice(5))) : null;
  const trade = toCity && toCity.owner !== UI.me;
  const transportOpts = myLog.filter((u) => u.carriedBy == null && (u.route == null || u.route === f.id) && `unit:${u.id}` !== f.to).map((u) => `<label class="ck"><input type="checkbox" data-chg="rf-tr" value="${u.id}" ${f.transports.includes(u.id) ? 'checked' : ''}> ${esc(Q.unitName(u))} <span class="small muted">(${UNI[u.type].cargo} cargo, move ${UNI[u.type].move}, at ${tl(u.t)})</span></label>`).join('<br>');
  let preview = '';
  if (f.from != null && f.to) {
    const r = { id: f.id || 0, owner: UI.me, from: f.from, to: { type: f.to.split(':')[0], id: Number(f.to.split(':')[1]) }, partner: trade ? toCity.owner : null, transports: f.transports, rule: f.rule, goods: f.goods, back: f.back };
    const est = Q.routeEstimate(S, r);
    const want = Object.values(f.goods).reduce((a, b) => a + Number(b || 0), 0);
    preview = f.transports.length ? `<p class="${est.ok ? '' : 'warn'}">${est.ok ? `Capacity about <strong class="num">${est.perTurn}</strong> per turn over ${est.len} tiles.` : 'At least one transport has no open path between these points (terrain, rail or borders).'}${f.rule === 'send' && want > est.perTurn && est.ok ? ` <span class="warn">You ask for ${want}/turn, more than the capacity.</span>` : ''}</p>` : '<p class="muted small">Pick transports to see the capacity.</p>';
  }
  const unitRows = Q.unitsOf(S, UI.me).map((u) => {
    const mv = d.moves.find((m) => m.unit === u.id);
    const src = Q.supplySources(S, u).filter((s) => s.ref !== u).map(Q.sourceName);
    const up = Q.upkeepOf(S, u, mv ? mv.path.length - 1 : 0);
    const bad = (u.supply || '').startsWith('Out');
    return `<tr><td>${esc(Q.unitName(u))}</td><td>${tl(Q.posOf(S, u))}</td><td class="small">${esc(fmtGoods(up) || 'none (in base)')}</td><td class="small">${Q.inBase(S, u) ? 'In base' : src.length ? esc(src.join(', ')) : '<span class="warn">Nothing in range</span>'}</td><td class="small ${bad ? 'warn' : ''}">${esc(u.supply || '—')}</td><td class="small">${UNI[u.type].cargo ? esc(fmtGoods(u.cargo) || 'empty') : ''}</td></tr>`;
  }).join('');
  return `<div class="page"><h2>Supply</h2><p class="muted">Routes move goods automatically every turn until changed. Units inside a city's supply range draw upkeep from it; further out they draw from caravans, supply trucks or a stopped train within 2 tiles.</p>
    <h3>Routes</h3><div class="ledger"><table><thead><tr><th class="n">#</th><th>From → to</th><th>Partner</th><th>Transports</th><th>Rule</th><th>Goods</th><th>Priority</th><th class="n">Cap/turn</th><th>Status</th><th></th></tr></thead><tbody>${routeRows}${newOps}${!routeRows && !newOps ? '<tr><td colspan="10" class="muted">No routes yet.</td></tr>' : ''}</tbody></table></div>
    <div class="cols" style="margin-top:16px"><div class="panel"><h3 style="margin-top:0">${f.id ? `Edit route #${f.id}` : 'New route'}</h3>
      <div class="row"><label>From <select data-chg="rf-from" ${f.id ? 'disabled' : ''}>${myCities.map((c) => `<option value="${c.id}" ${c.id === f.from ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label>To <select data-chg="rf-to" ${f.id ? 'disabled' : ''}><option value="">Choose…</option>${toOpts}</select></label></div>
      ${trade ? `<p class="small notice">This is a trade route with ${esc(pname(toCity.owner))}. They must accept it next turn; your transports carry goods both ways.</p>` : ''}
      <h4>Transports</h4><div class="small">${transportOpts || '<span class="muted">No free logistics units. Build caravans at stables, trains or supply trucks at a machinery workshop, or ships at a shipyard.</span>'}</div>
      <h4>Rule</h4><div class="row"><label class="ck"><input type="radio" name="rf-rule" data-chg="rf-rule" value="send" ${f.rule === 'send' ? 'checked' : ''}> Send an amount per turn</label><label class="ck"><input type="radio" name="rf-rule" data-chg="rf-rule" value="stock" ${f.rule === 'stock' ? 'checked' : ''}> Keep the destination stocked at</label></div>
      <h4>Goods sent</h4>${goodsInputs('rf-goods', f.goods)}
      ${trade ? `<h4>Goods you receive back (per turn)</h4>${goodsInputs('rf-back', f.back)}` : ''}
      <div class="row"><label>Priority <select data-chg="rf-prio">${['high', 'normal', 'low'].map((x) => `<option ${f.priority === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label></div>
      ${preview}
      <div class="row"><button class="btn primary" data-act="route-save" ${f.from == null || !f.to ? 'disabled' : ''}>${f.id ? 'Save changes' : 'Add route'}</button>${f.id ? '<button class="btn" data-act="route-new">New route instead</button>' : ''}</div></div>
      <div class="panel"><h3 style="margin-top:0">Load and unload by hand</h3><p class="small muted">Select a logistics unit standing in one of your cities on the Map tab to load or unload goods. Units waiting in a city:</p>
      <ul class="list">${myLog.filter((u) => Q.cityAt(S, u.t) && Q.cityAt(S, u.t).owner === UI.me && u.carriedBy == null).map((u) => `<li><button class="linkbtn" data-act="goto-unit" data-id="${u.id}">${esc(Q.unitName(u))}</button><span class="small">${esc(cityName(Q.cityAt(S, u.t).id))}, ${esc(fmtGoods(u.cargo) || 'empty')}</span></li>`).join('') || '<li class="muted">None</li>'}</ul>
      ${d.cargo.length ? `<h4>Queued transfers</h4><ul class="list">${d.cargo.map((c, i) => `<li>${esc(uname(c.unit))} ${c.amount > 0 ? 'loads' : 'unloads'} ${Math.abs(c.amount)} ${gl(c.good)}<button class="x" data-act="rm" data-list="cargo" data-idx="${i}">✕</button></li>`).join('')}</ul>` : ''}</div></div>
    <h3>Unit supply</h3><p class="small muted">Upkeep includes this turn's planned movement. "Last turn" is what happened at the end of the previous turn.</p>
    <div class="ledger"><table><thead><tr><th>Unit</th><th>Tile</th><th>Upkeep this turn</th><th>Supplied from</th><th>Last turn</th><th>Cargo</th></tr></thead><tbody>${unitRows || '<tr><td colspan="6" class="muted">No units.</td></tr>'}</tbody></table></div></div>`;
};

/* ---------- Stockpiles ---------- */
TAB_RENDER.stock = function () {
  const S = st(), p = meP();
  const cities = Q.citiesOf(S, UI.me);
  const head = `<tr><th>Location</th>${RR.GOODS.map((g) => `<th class="n">${GN(g)}</th>`).join('')}</tr>`;
  const cityRows = cities.map((c) => `<tr><td><button class="linkbtn" data-act="goto" data-t="${c.t}">${esc(c.name)}</button></td>${RR.GOODS.map((g) => { const v = c.stock[g] || 0, cap = Q.capacity(S, c, g); return `<td class="n ${v >= cap ? 'full' : v >= cap * 0.9 ? 'near' : ''}">${v}<span class="muted small">/${cap}</span></td>`; }).join('')}</tr>`).join('');
  const units = Q.unitsOf(S, UI.me).filter((u) => UNI[u.type].cargo);
  const unitRows = units.map((u) => `<tr><td><button class="linkbtn" data-act="goto-unit" data-id="${u.id}">${esc(Q.unitName(u))}</button> <span class="small muted">${tl(Q.posOf(S, u))}, ${Q.cargoUsed(u)}/${UNI[u.type].cargo}</span></td>${RR.GOODS.map((g) => `<td class="n">${u.cargo[g] || ''}</td>`).join('')}</tr>`).join('');
  const tot = {}; for (const c of cities) for (const g of RR.GOODS) tot[g] = (tot[g] || 0) + (c.stock[g] || 0); for (const u of units) for (const g of RR.GOODS) tot[g] = (tot[g] || 0) + (u.cargo[g] || 0);
  return `<div class="page"><h2>Stockpiles</h2><p class="muted">Credits, manpower and science belong to the whole nation. Every other good sits in a city or a logistics unit and only moves by transport. Amounts show stock/capacity.</p>
    <div class="row" style="gap:24px;margin:10px 0 14px"><span>Credits <b class="num" style="font-size:1.3rem">${p.credits}</b></span><span>Manpower <b class="num" style="font-size:1.3rem">${p.manpower}</b></span><span>Science <b class="num" style="font-size:1.3rem">${p.science}</b></span></div>
    <div class="ledger"><table><thead>${head}</thead><tbody>${cityRows ? `<tr class="sub"><td colspan="${RR.GOODS.length + 1}">Cities</td></tr>${cityRows}` : ''}${unitRows ? `<tr class="sub"><td colspan="${RR.GOODS.length + 1}">Logistics units</td></tr>${unitRows}` : ''}
    <tr class="sub"><td>Total</td>${RR.GOODS.map((g) => `<td class="n">${tot[g] || 0}</td>`).join('')}</tr></tbody></table></div></div>`;
};

/* ---------- Buildings ---------- */
TAB_RENDER.buildings = function () {
  const S = st();
  const blocks = Q.citiesOf(S, UI.me).map((c) => {
    const blds = Q.cityBuildings(S, c.id).sort((a, b) => a.key.localeCompare(b.key));
    const rails = S.map.tiles.filter((t) => t.owner === c.id && t.rail != null).length;
    const bridges = S.map.tiles.filter((t) => t.owner === c.id && t.bridge).length;
    const trap = S.map.tiles.findIndex((t) => t.trap === c.id);
    const effect = (b) => {
      const d = BLD[b.key];
      if (d.recipes) { const rc = Q.recipeOf(b), out = Q.buildingOutput(S, b); return `${fmtGoods(rc.in) || 'no inputs'} → ${fmtGoods(out) || [rc.mpOut ? `${rc.mpOut} manpower` : '', rc.sciOut ? `${rc.sciOut} science` : '', Q.creditsOutOf(S, b) || rc.creditsPerResidence ? `${Q.creditsOutOf(S, b)} credits${rc.creditsPerResidence ? ` (${rc.creditsPerResidence} per working residence)` : ''}` : ''].filter(Boolean).join(', ')}`; }
      if (d.storage) return `Stores ${fmtGoods(d.storage)}`;
      if (d.storageAll) return `Stores +${d.storageAll} of every good except food and fuel${d.supplyBonus ? '; +1 supply range' : ''}`;
      if (d.builds) return `Builds ${d.builds.map((k) => UNI[k].name.toLowerCase()).join(', ')}`;
      if (d.dock) return d.dock === 'sail' ? 'Docks sailing ships' : 'Docks all ships';
      if (d.hp) return `+${d.hp} city HP${d.weapon ? ', fires at range 2' : ''}`;
      if (d.territoryBonus) return 'Territory 3 tiles';
      return '';
    };
    return `<div class="ledger"><table><thead><tr><th colspan="4">${esc(c.name)} <span class="muted small">HP ${c.hp}/${Q.maxHp(S, c)}, territory ${Q.territoryRadius(S, c)}, supply range ${Q.supplyRadius(S, c)}</span></th></tr>
      <tr><th>Building</th><th>Where</th><th>Does</th><th>Last turn</th></tr></thead><tbody>
      ${blds.map((b) => `<tr><td>${esc(BLD[b.key].name)}</td><td>${BLD[b.key].place === 'tile' ? `<button class="linkbtn" data-act="goto" data-t="${b.t}">${esc(RR.TILES[S.map.tiles[b.t].type].name)} ${tl(b.t)}</button>` : 'City'}</td><td class="small">${esc(effect(b))}</td><td class="small ${b.status && b.status.startsWith('Idle') ? 'warn' : 'muted'}">${esc(b.status || '')}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No buildings yet.</td></tr>'}
      ${rails || bridges || trap >= 0 ? `<tr class="sub"><td colspan="4">Infrastructure in territory: ${rails} railroad tile${rails === 1 ? '' : 's'}, ${bridges} bridge${bridges === 1 ? '' : 's'}${trap >= 0 ? `, tank trap at ${tl(trap)}` : ''}</td></tr>` : ''}
      </tbody></table></div>`;
  }).join('');
  return `<div class="page"><h2>Buildings</h2>${blocks || '<p class="muted">You have no cities.</p>'}</div>`;
};

/* ---------- Production ---------- */
TAB_RENDER.production = function () {
  const S = st(), p = meP(), st0 = settings();
  const prio = st0.priority || p.priority;
  const products = st0.products || {};
  const halts = st0.halt || {};
  const labors = (draft().settings && draft().settings.labor) || {};
  const isHalted = (b) => (halts[b.id] != null ? !!halts[b.id] : !!b.halted);
  const usedKeys = new Set(S.buildings.filter((b) => Q.buildingOwner(S, b) === UI.me && BLD[b.key].recipes).map((b) => b.key));
  const prioList = prio.filter((k) => usedKeys.has(k)).map((k, i, arr) => `<li class="row" style="margin:0;justify-content:space-between"><span><span class="num muted">${i + 1}.</span> ${esc(BLD[k].short || BLD[k].name)}</span><span><button class="btn small" data-act="prio" data-key="${k}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button> <button class="btn small" data-act="prio" data-key="${k}" data-dir="1" ${i === arr.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button></span></li>`).join('');
  const blocks = Q.citiesOf(S, UI.me).map((c) => {
    const lines = Q.cityBuildings(S, c.id).filter((b) => BLD[b.key].recipes).sort((a, b) => prio.indexOf(a.key) - prio.indexOf(b.key));
    const totIn = {}, totOut = {}; let mp = 0, mpOut = 0, cr = 0, crOut = 0, sci = 0;
    const rows = lines.map((b) => {
      const d = BLD[b.key], keys = Object.keys(d.recipes);
      const cur = products[b.id] || Q.recipeKey(b);
      const rc = d.recipes[cur], out = Q.buildingOutput(S, Object.assign({}, b, { product: cur }));
      const off = isHalted(b);
      const labor = rc.labor ? (labors[b.id] != null ? labors[b.id] : Q.laborOf(b)) : 0;
      const credOut = rc.labor ? labor * rc.creditsPerMp : Q.creditsOutOf(S, b);
      const mpUse = rc.labor ? labor : (rc.mp || 0);
      if (!off) {
        for (const [g, v] of Object.entries(rc.in || {})) totIn[g] = (totIn[g] || 0) + v;
        for (const [g, v] of Object.entries(out)) totOut[g] = (totOut[g] || 0) + v;
        mp += mpUse; mpOut += rc.mpOut || 0; cr += rc.credits || 0; crOut += credOut; sci += rc.sciOut || 0;
      }
      const sel = keys.length > 1 ? `<select data-chg="product" data-id="${b.id}" aria-label="Product">${keys.map((k) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${GN(k) || k}</option>`).join('')}</select>` : '';
      const outs = [fmtGoods(out), rc.mpOut ? `${rc.mpOut} manpower` : '', rc.sciOut ? `${rc.sciOut} science` : '', credOut || rc.creditsPerResidence || rc.labor ? `${credOut} credits${rc.creditsPerResidence ? ` (${rc.creditsPerResidence} × residences)` : rc.labor ? ` (${rc.creditsPerMp} per worker, up to ${rc.maxLabor})` : ''}` : ''].filter(Boolean).join(', ');
      const toggle = `<label class="ck small"><input type="checkbox" data-chg="halt" data-id="${b.id}" ${off ? '' : 'checked'}> On</label>`;
      return `<tr class="${off ? 'muted' : ''}"><td>${toggle}</td><td>${esc(d.short || d.name)}${d.place === 'tile' ? ` <span class="small muted">${tl(b.t)}</span>` : ''}</td><td>${sel}</td><td class="small">${esc(fmtGoods(rc.in) || '—')}${rc.credits ? `${rc.in ? ', ' : ''}${rc.credits} credits` : ''}</td><td class="small">${esc(outs)}</td><td class="n">${rc.labor ? `<input type="number" min="0" max="${rc.maxLabor || ''}" step="1" class="w-sm" data-chg="labor" data-id="${b.id}" value="${labor}" aria-label="Workers" title="Manpower put to work each turn${rc.maxLabor ? ` (up to ${rc.maxLabor})` : ''}" style="width:64px">` : (rc.mp || 0)}</td><td class="small ${b.status && b.status.startsWith('Idle') ? 'warn' : 'muted'}">${esc(off ? (b.halted ? 'Halted' : 'Halts this turn') : b.halted ? 'Restarts this turn' : (b.status || 'New'))}</td></tr>`;
    }).join('');
    return `<div class="ledger"><table><thead><tr><th colspan="7">${esc(c.name)}</th></tr><tr><th>Running</th><th>Production line</th><th>Making</th><th>Uses per turn</th><th>Makes per turn</th><th class="n">Manpower</th><th>Last turn</th></tr></thead><tbody>
      ${rows || '<tr><td colspan="7" class="muted">No production buildings yet.</td></tr>'}
      ${rows ? `<tr class="sub"><td colspan="3">If every line that is on runs</td><td class="small">${esc(fmtGoods(totIn) || '—')}${cr ? `, ${cr} credits` : ''}</td><td class="small">${esc([fmtGoods(totOut), mpOut ? `${mpOut} manpower` : '', sci ? `${sci} science` : '', crOut ? `${crOut} credits` : ''].filter(Boolean).join(', '))}</td><td class="n">${mp}</td><td></td></tr>` : ''}</tbody></table></div>`;
  }).join('');
  return `<div class="page"><h2>Production</h2><p class="muted">Untick a line to halt it: it uses no manpower or inputs and makes nothing until you switch it back on.</p><div class="cols" style="grid-template-columns: 1fr 300px">
    <div>${blocks}</div>
    <div class="panel"><h3 style="margin-top:0">Priority</h3><p class="small muted">When manpower or inputs run short, buildings lower on this list stop first. Changes apply when the turn resolves.</p><ol class="list prio">${prioList || '<li class="muted">Build something first.</li>'}</ol></div></div></div>`;
};

/* ---------- Research ---------- */
TAB_RENDER.research = function () {
  const S = st(), p = meP(), d = draft();
  const queuedCost = d.research.reduce((a, k) => a + (BLD[k] ? BLD[k].sci : 0), 0);
  const eras = [1, 2, 3].map((era) => {
    const rows = Object.entries(BLD).filter(([, b]) => b.era === era).sort((a, b) => a[1].sci - b[1].sci).map(([k, b]) => {
      const free = b.sci === 0, res = p.researched.includes(k), bp = p.blueprints.includes(k), q = d.research.includes(k);
      const units = Object.entries(UNI).filter(([, u]) => u.unlock === k).map(([, u]) => u.name).join(', ');
      const status = free ? '<span class="tag">Start</span>' : res ? '<span class="tag ok">Researched</span>' : bp ? '<span class="tag ok">Blueprint</span>' : `<label class="ck"><input type="checkbox" data-chg="research" value="${k}" ${q ? 'checked' : ''}> Research</label>`;
      return `<tr><td>${esc(b.name)}</td><td class="n">${b.sci}</td><td class="small">${esc(units)}</td><td>${status}</td></tr>`;
    }).join('');
    return `<div class="ledger"><table><thead><tr><th colspan="4">Era ${era}: ${RR.ERA_NAMES[era]}</th></tr><tr><th>Building</th><th class="n">Science</th><th>Unlocks units</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  const sellable = p.researched.filter((k) => BLD[k]);
  const others = activePlayers().filter((x) => x.id !== UI.me);
  const offers = d.diplo.filter((o) => o.type === 'propose' && o.kind === 'blueprint');
  return `<div class="page"><h2>Research</h2><p class="muted">Universities turn 6 manpower and 50 credits into 1 science each turn. Research any building in any order; later eras cost more. Science is never lost.</p>
    <div class="row" style="gap:24px"><span>Science available <b class="num" style="font-size:1.3rem">${p.science}</b></span><span>Queued this turn <b class="num ${queuedCost > p.science ? 'warn' : ''}" style="font-size:1.3rem">${queuedCost}</b></span></div>
    <div class="cols" style="margin-top:12px"><div>${eras}</div>
    <div class="panel"><h3 style="margin-top:0">Sell a blueprint</h3><p class="small muted">Only buildings you researched yourself can be sold. The buyer accepts next turn and pays on acceptance.</p>
      ${sellable.length && others.length ? `<div class="row"><select id="bp-key" aria-label="Blueprint">${sellable.map((k) => `<option value="${k}">${esc(BLD[k].name)}</option>`).join('')}</select><select id="bp-to" aria-label="Buyer">${others.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input type="number" id="bp-price" min="0" value="200" aria-label="Price in credits"><button class="btn small" data-act="bp-offer">Offer</button></div>` : '<p class="small muted">Nothing to sell yet.</p>'}
      ${offers.length ? `<ul class="list">${offers.map((o) => `<li>${esc(BLD[o.payload.key].name)} to ${esc(pname(o.to))} for ${o.payload.price}<button class="x" data-act="rm" data-list="diplo" data-idx="${d.diplo.indexOf(o)}">✕</button></li>`).join('')}</ul>` : ''}
      <h4>Bought blueprints</h4><p class="small">${p.blueprints.map((k) => esc(BLD[k].name)).join(', ') || '<span class="muted">None</span>'}</p></div></div></div>`;
};

/* ---------- Market ---------- */
TAB_RENDER.market = function () {
  const S = st(), p = meP(), d = draft();
  const cities = Q.citiesOf(S, UI.me);
  if (!cities.find((c) => c.id === UI.marketCity)) UI.marketCity = cities[0] ? cities[0].id : null;
  const c = Q.cityById(S, UI.marketCity);
  const blocked = false;
  const rows = RR.GOODS.map((g) => {
    const pr = S.market.prices[g] || { sell: RR.BASE_PRICE[g], pays: Math.round(RR.BASE_PRICE[g] * 0.8), pool: 0, world: 0, r: 0 };
    return `<tr><td><i class="swatch" style="background:${RR.GOOD_COLORS[g]}"></i>${GN(g)}</td><td class="n">${RR.BASE_PRICE[g]}</td><td class="n"><strong>${pr.sell}</strong></td><td class="n">${pr.pays}</td><td class="n">${pr.pool}</td><td class="n">${pr.world}</td><td class="n">${Math.round(pr.r * 100)}%</td>
      <td>${c ? `<span class="small muted">${c.stock[g] || 0}</span>` : ''}</td>
      <td><div class="row" style="margin:0;flex-wrap:nowrap"><input type="number" min="1" class="w-sm" id="mk-${g}" value="10" aria-label="${GN(g)} amount"><button class="btn small" data-act="buy" data-good="${g}" ${!c || blocked || !pr.pool ? 'disabled' : ''}>Buy</button><button class="btn small" data-act="sell" data-good="${g}" ${!c || blocked ? 'disabled' : ''}>Sell</button></div></td></tr>`;
  }).join('');
  const lines = [...d.buys.map((o, i) => ['buys', i, `Buy ${o.amount} ${gl(o.good)} for ${cityName(o.city)} (about ${o.amount * (S.market.prices[o.good] || {}).sell} credits)`]), ...d.sells.map((o, i) => ['sells', i, `Sell ${o.amount} ${gl(o.good)} from ${cityName(o.city)} (about ${o.amount * (S.market.prices[o.good] || {}).pays} credits)`])];
  return `<div class="page"><h2>Global market</h2><p class="muted">The market holds what players sell to it, plus ${Math.round(RR.MARKET.trickle * 100)}% of everything the world produces each turn (taken from no one). Its price for a good falls as more of the world's supply sits in the market: price = base ÷ (1 + 4 × share). It pays sellers 80% of its selling price. No transport is needed; goods arrive in the city you choose. Buys fill before sells, and prices hold for the whole turn.</p>
    <div class="row"><label>Deliver to and sell from <select data-chg="mk-city">${cities.map((x) => `<option value="${x.id}" ${x.id === UI.marketCity ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label><span class="small muted">Credits: <b class="num">${p.credits}</b></span></div>
    <div class="ledger"><table><thead><tr><th>Good</th><th class="n">Base</th><th class="n">Market sells at</th><th class="n">Market pays</th><th class="n">In market</th><th class="n">World total</th><th class="n">Share</th><th>In city</th><th>Order</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${S.market.lastTrickle && Object.keys(S.market.lastTrickle).length ? `<p class="small muted">Added to the market from last turn's world production: ${esc(fmtGoods(S.market.lastTrickle))}.</p>` : ''}
    <h3>This turn's market orders</h3><ul class="list">${lines.map(([l, i, t]) => `<li>${esc(t)}<button class="x" data-act="rm" data-list="${l}" data-idx="${i}">✕</button></li>`).join('') || '<li class="muted">None</li>'}</ul></div>`;
};

/* ---------- Diplomacy ---------- */
function peaceDraft(to) {
  if (!UI.peace || UI.peace.to !== to) UI.peace = { to, term: RR.PEACE.minTerm, give: { credits: 0, science: 0, cities: [], tiles: [] }, get: { credits: 0, science: 0, cities: [], tiles: [] } };
  return UI.peace;
}
function peaceBuilder() {
  const S = st(), pd = UI.peace;
  if (!pd || !S.players[pd.to] || S.players[pd.to].eliminated) return '';
  const them = S.players[pd.to], pl = Q.normPeace(pd), err = Q.checkPeace(S, UI.me, pd.to, pl);
  const side = (key, pid) => {
    const part = pd[key], P = S.players[pid], cities = Q.citiesOf(S, pid);
    return `<div><h4>${pid === UI.me ? 'You give' : `${esc(P.name)} gives`}</h4>
      <div class="row"><label>Credits <input type="number" min="0" data-chg="pc-num" data-side="${key}" data-f="credits" value="${part.credits || ''}" placeholder="0"></label><span class="small muted">has ${P.credits}</span></div>
      <div class="row"><label>Science <input type="number" min="0" data-chg="pc-num" data-side="${key}" data-f="science" value="${part.science || ''}" placeholder="0"></label><span class="small muted">has ${P.science}</span></div>
      <div class="small">${cities.map((c) => `<label class="ck"><input type="checkbox" data-chg="pc-city" data-side="${key}" value="${c.id}" ${part.cities.includes(c.id) ? 'checked' : ''}> ${esc(c.name)}</label>`).join('<br>') || '<span class="muted">No cities</span>'}</div>
      <p class="small">${part.tiles.length} tile${part.tiles.length === 1 ? '' : 's'} chosen${part.tiles.length ? ` (${part.tiles.map(tl).join(', ')})` : ''}</p></div>`;
  };
  return `<div class="panel" id="peace-builder"><h3 style="margin-top:0">Peace treaty with ${playerLabel(pd.to)}</h3>
    <p class="small muted">${Q.atWar(S, UI.me, pd.to) ? 'Signing ends your war.' : 'You are at peace; this adds a guaranteed term.'} Neither side may declare war until the term ends. ${esc(them.name)} answers next turn, and the transfers happen only if both sides still have what they promised.</p>
    <div class="row"><label>Term <select data-chg="pc-term">${Array.from({ length: RR.PEACE.maxTerm - RR.PEACE.minTerm + 1 }, (_, i) => i + RR.PEACE.minTerm).map((n) => `<option value="${n}" ${n === pl.term ? 'selected' : ''}>${n} turns</option>`).join('')}</select></label></div>
    <div class="cols" style="grid-template-columns:1fr 1fr;gap:12px">${side('give', UI.me)}${side('get', pd.to)}</div>
    <p class="small muted">Ceded cities keep their stockpiles and all their territory. Ceded tiles bring their buildings, joining the new owner's nearest city.</p>
    <div class="row"><button class="btn" data-act="pc-pick">Pick tiles on the map</button><button class="btn primary" data-act="pc-send" ${err ? 'disabled' : ''}>Propose treaty</button><button class="btn" data-act="pc-close">Cancel</button></div>
    ${err ? `<p class="small warn">${esc(err[0].toUpperCase() + err.slice(1))}.</p>` : ''}</div>`;
}
TAB_RENDER.diplomacy = function () {
  const S = st(), p = meP(), d = draft();
  const others = S.players.filter((x) => x.id !== UI.me);
  const queued = (pred) => d.diplo.some(pred);
  const pact = (x) => S.treaties.find((t) => t.type === 'peace' && ((t.a === UI.me && t.b === x.id) || (t.b === UI.me && t.a === x.id)));
  const rel = (x) => {
    if (x.eliminated) return '<span class="tag">Out of the game</span>';
    if (Q.atWar(S, UI.me, x.id)) return '<span class="tag war">At war</span>';
    const pc = pact(x);
    if (pc) return `<span class="tag ok">Peace treaty</span><div class="small muted">no war before turn ${pc.endsTurn}</div>`;
    return '<span class="tag ok">At peace</span>';
  };
  const rows = others.map((x) => {
    if (x.eliminated) return `<tr><td>${playerLabel(x.id)}</td><td>${rel(x)}</td><td colspan="3"></td></tr>`;
    const war = Q.atWar(S, UI.me, x.id);
    const tr = S.treaties.filter((t) => t.type !== 'peace' && ((t.a === UI.me && t.b === x.id) || (t.b === UI.me && t.a === x.id)));
    const acts = [];
    acts.push(queued((o) => o.type === 'propose' && o.kind === 'peace' && o.to === x.id) ? '<span class="tag brass">Peace offered</span>' : `<button class="btn small" data-act="pc-open" data-to="${x.id}">${war ? 'Propose peace…' : 'Offer peace treaty…'}</button>`);
    if (!war && !pact(x)) acts.push(queued((o) => o.type === 'declare' && o.to === x.id) ? '<span class="tag war">War declared this turn</span>' : `<button class="btn small danger" data-act="declare" data-to="${x.id}">Declare war</button>`);
    if (!war) for (const type of ['transit', 'port', 'rail']) if (!tr.some((t) => t.type === type) && !queued((o) => o.type === 'propose' && o.kind === 'treaty' && o.to === x.id && o.payload.type === type)) acts.push(`<button class="btn small" data-act="treaty" data-to="${x.id}" data-type="${type}">Offer ${type} rights</button>`);
    acts.push(`<span class="row" style="margin:0"><input type="number" min="1" class="w-sm" id="cr-${x.id}" placeholder="0" aria-label="Credits to send"><button class="btn small" data-act="credits" data-to="${x.id}">Send credits</button></span>`);
    return `<tr><td>${playerLabel(x.id)}</td><td>${rel(x)}</td>
      <td class="small">${tr.map((t) => `${t.type} rights${t.endsTurn ? ` (ends turn ${t.endsTurn})` : ` <button class="linkbtn" data-act="cancel-treaty" data-id="${t.id}">cancel</button>`}`).join('<br>') || '<span class="muted">None</span>'}</td>
      <td class="small">${citiesOf(x.id).length} cit${citiesOf(x.id).length === 1 ? 'y' : 'ies'}, ${Q.unitsOf(S, x.id).length} units</td><td><div class="row" style="margin:0">${acts.join(' ')}</div></td></tr>`;
  }).join('');
  const incoming = S.proposals.filter((pr) => pr.to === UI.me && pr.turn === S.turn).map((pr) => {
    const ans = d.diplo.find((o) => o.type === 'respond' && o.id === pr.id);

  }).join('');
  const outgoing = S.proposals.filter((pr) => pr.from === UI.me).map((pr) => `<li>${esc(Q.describeProposal(S, pr))} to ${esc(pname(pr.to))}<span class="small muted">answer due turn ${pr.turn}</span></li>`).join('');

    <div class="ledger" style="margin-top:14px"><table><thead><tr><th>Nation</th><th>Status</th><th>Rights treaties</th><th>Size</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="cols" style="margin-top:16px">
      <div class="panel"><h3 style="margin-top:0">Answer this turn</h3><ul class="list">${incoming || '<li class="muted">Nothing to answer.</li>'}</ul><h4>Waiting on others</h4><ul class="list">${outgoing || '<li class="muted">None</li>'}</ul></div>
      <div class="panel"><h3 style="margin-top:0">Wars and treaties</h3><ul class="list">${S.wars.map((w) => `<li>${playerLabel(w.a)} vs ${playerLabel(w.b)}<span class="small muted">since turn ${w.since}</span></li>`).join('') || '<li class="muted">No wars.</li>'}
        ${S.treaties.filter((t) => t.type === 'peace').map((t) => `<li>${playerLabel(t.a)} and ${playerLabel(t.b)}<span class="small muted">peace, no war before turn ${t.endsTurn}</span></li>`).join('')}</ul>
        <h4>End the game</h4><p class="small">The game ends when one nation is left, or when every remaining nation (${alive.map((x) => esc(x.name)).join(', ')}) votes to end it in the same turn while none are at war.</p>
        ${!p.eliminated ? `<label class="ck"><input type="checkbox" data-chg="endvote" ${queued((o) => o.type === 'endVote') ? 'checked' : ''}> Vote to end the game this turn</label>` : ''}</div>

};
const citiesOf = (pid) => Q.citiesOf(st(), pid);

/* ---------- Orders ---------- */
function orderGroups() {
  const S = st(), d = draft();
  const G = [];
  const add = (phase, list, i, text) => { let g = G.find((x) => x.phase === phase); if (!g) { g = { phase, items: [] }; G.push(g); } g.items.push({ list, i, text }); };
  d.diplo.forEach((o, i) => {
    const t = o.type === 'declare' ? `Declare war on ${pname(o.to)}`
      : o.type === 'propose' ? `Propose ${o.kind === 'treaty' ? `${o.payload.type} rights` : o.kind === 'blueprint' ? `selling ${BLD[o.payload.key].name} for ${o.payload.price}` : Q.describeProposal(S, { kind: 'peace', from: UI.me, to: o.to, payload: o.payload })} to ${pname(o.to)}`
        : o.type === 'respond' ? `${o.accept ? 'Accept' : 'Reject'} ${Q.describeProposal(S, S.proposals.find((p) => p.id === o.id) || { kind: '?' })}`
          : o.type === 'credits' ? `Send ${o.amount} credits to ${pname(o.to)}`
            : o.type === 'cancelTreaty' ? 'Cancel a treaty'
              : o.type === 'endVote' ? 'Vote to end the game' : o.type;
    add('Diplomacy', 'diplo', i, t);
  });
  d.attacks.forEach((o, i) => add('Combat', 'attacks', i, o.unit != null ? `${uname(o.unit)} attacks ${tl(o.t)}` : `${cityName(o.city)} ${BLD[o.w].name.toLowerCase()} fires at ${tl(o.t)}`));
  d.board.forEach((o, i) => add('Movement', 'board', i, `${uname(o.unit)} boards ${uname(o.transport)}`));
  d.moves.forEach((o, i) => add('Movement', 'moves', i, `${uname(o.unit)} moves to ${tl(o.path[o.path.length - 1])} (${o.path.length - 1} tiles)`));
  d.unload.forEach((o, i) => add('Movement', 'unload', i, `${uname(o.unit)} unloads at ${tl(o.t)}`));
  d.buys.forEach((o, i) => add('Market buys', 'buys', i, `Buy ${o.amount} ${gl(o.good)} for ${cityName(o.city)}`));
  d.sells.forEach((o, i) => add('Market sells', 'sells', i, `Sell ${o.amount} ${gl(o.good)} from ${cityName(o.city)}`));
  d.research.forEach((k, i) => add('Research', 'research', i, `Research ${BLD[k].name} (${BLD[k].sci} science)`));
  d.sabotage.forEach((o, i) => add('Combat', 'sabotage', i, `${uname(o.unit)} sabotages ${tl(o.t)}`));
  d.clear.forEach((o, i) => add('Buildings', 'clear', i, `Clear the forest at ${tl(o.t)} (+${RR.CLEAR_FOREST.lumber} lumber)`));
  d.demolish.forEach((o, i) => add('Buildings', 'demolish', i, `Demolish ${o.what === 'building' ? (Q.tileBuilding(S, o.t) ? BLD[Q.tileBuilding(S, o.t).key].name.toLowerCase() : 'building') : o.what === 'trap' ? 'tank trap' : o.what === 'rail' ? 'railroad' : 'bridge'} at ${tl(o.t)}`));
  d.found.forEach((o, i) => add('Buildings', 'found', i, `Found ${o.name} with ${uname(o.unit)}`));
  d.builds.forEach((o, i) => add('Buildings', 'builds', i, `Build ${BLD[o.key].name} for ${cityName(o.city)}${o.t != null ? ` at ${tl(o.t)}` : ''}`));
  d.trains.forEach((o, i) => add('Units', 'trains', i, `Build ${UNI[o.type].name} in ${cityName(o.city)}`));
  if (d.settings && (d.settings.priority || ['products', 'halt', 'labor'].some((k) => d.settings[k] && Object.keys(d.settings[k]).length))) add('Production', 'settings', 0, 'Production priority, products, workers or on/off switches changed');
  if (d.settings && d.settings.pay) for (const [uid, on] of Object.entries(d.settings.pay)) add('Logistics', 'settings', 0, `${on ? 'Pay' : 'Stop paying'} ${uname(Number(uid))}`);
  d.cargo.forEach((o, i) => add('Logistics', 'cargo', i, `${uname(o.unit)} ${o.amount > 0 ? 'loads' : 'unloads'} ${Math.abs(o.amount)} ${gl(o.good)}`));
  d.routeOps.forEach((o, i) => add('Logistics', 'routeOps', i, o.op === 'remove' ? `Close route #${o.id}` : o.op === 'update' ? `Change route #${o.id}` : `New route ${cityName(o.from)} → ${o.to.type === 'city' ? cityName(o.to.id) : uname(o.to.id)}`));
  const order = ['Diplomacy', 'Combat', 'Movement', 'Market buys', 'Market sells', 'Research', 'Production', 'Buildings', 'Units', 'Logistics'];
  return G.sort((a, b) => order.indexOf(a.phase) - order.indexOf(b.phase));
}
TAB_RENDER.orders = function () {
  const S = st(), groups = orderGroups();
  const status = activePlayers().map((x) => `<li><span>${playerLabel(x.id)}</span><span class="${submitted(x.id) ? 'good' : 'muted'}">${submitted(x.id) ? `Submitted ${new Date(UI.bundle.pending[x.id].at).toLocaleString()}` : 'Not yet'}</span></li>`).join('');
  return `<div class="page"><h2>Orders for turn ${S.turn}</h2><p class="muted">Orders resolve in this order: diplomacy, combat, movement, market buys, market sells, research, production, buildings, units, then logistics (routes, supply and repairs). Attacks use positions from the start of the turn.</p>
    <div class="cols"><div class="panel">${groups.map((g) => `<h4>${g.phase}</h4><ul class="list">${g.items.map((it) => `<li>${esc(it.text)}<button class="x" data-act="rm" data-list="${it.list}" data-idx="${it.i}" aria-label="Remove order">✕</button></li>`).join('')}</ul>`).join('') || '<p class="muted">No orders yet. Standing routes and production keep running anyway.</p>'}
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="submit">${submitted(UI.me) ? 'Resubmit orders' : 'Submit orders'}</button><button class="btn danger" data-act="clear-all">Clear all orders</button></div></div>
    <div class="panel"><h3 style="margin-top:0">Who has submitted</h3><ul class="list">${status}</ul>
      <p class="small muted" style="margin-top:8px">${isCampaign() ? `Orders go to the server and you can resubmit until the turn resolves. ${esc(scheduleText())}, or earlier if the admin resolves it.` : Sync.mode === 'file' ? 'Submitting downloads your orders file. Send it to the host, who imports everyone\'s files from the Game menu and resolves the turn.' : Sync.mode === 'server' ? 'Orders go to the server. Anyone can resolve once everyone has submitted.' : 'Pass-and-play: everyone uses this browser. Switch "Playing as", submit, then resolve when all are in.'}</p></div></div></div>`;
};

function routeFormFrom(r) { return { id: r.id, from: r.from, to: `${r.to.type}:${r.to.id}`, transports: r.transports.slice(), rule: r.rule, goods: clone(r.goods), back: clone(r.back || {}), priority: r.priority }; }
const ACT = {
  tab(el) { UI.tab = el.dataset.tab; UI.mode = null; UI.menu = false; render(); },
  menu() { UI.menu = !UI.menu; render(); },
  zoom(el) { zoomBy('main', Number(el.dataset.k)); },
  'zoom-flow'(el) { zoomBy('flow', Number(el.dataset.k)); },
  fit(el) { fitView(el.dataset.kind); render(); },
  legend() { UI.legend = !UI.legend; render(); },
  goto(el) { const t = Number(el.dataset.t); UI.tab = 'map'; UI.sel = { t, unit: null }; centerOn('main', t); render(); },
  'goto-unit'(el) { const u = Q.unitById(st(), Number(el.dataset.id)); if (!u) return; const t = Q.posOf(st(), u); UI.tab = 'map'; UI.sel = { t, unit: u.id }; centerOn('main', t); render(); },
  'sel-unit'(el) { UI.sel.unit = Number(el.dataset.id); render(); },
  clear(el) { const id = Number(el.dataset.unit), list = el.dataset.list; mutate((d) => { d[list] = d[list].filter((o) => o.unit !== id); }); },
  rm(el) {
    const list = el.dataset.list, i = Number(el.dataset.idx);
    mutate((d) => { if (list === 'settings') d.settings = null; else d[list].splice(i, 1); });
  },
  'rm-op'(el) { mutate((d) => d.routeOps.splice(Number(el.dataset.idx), 1)); },
  'clear-all'() { if (confirm('Clear every order for this turn?')) { UI._d = Engine.normalizeOrders({}); saveDraft(); render(); } },
  'build-city'(el) { mutate((d) => d.builds.push({ city: Number(el.dataset.city), key: el.dataset.key })); toast(`${BLD[el.dataset.key].name} queued`); },
  'mode-build'(el) { UI.mode = { kind: 'build', city: Number(el.dataset.city), key: el.dataset.key }; computeHL(); if (!UI.hl.build.size) { UI.mode = null; toast(`No valid tile for ${BLD[el.dataset.key].name.toLowerCase()} right now.`); } render(); },
  'mode-weapon'(el) { UI.mode = { kind: 'weapon', city: Number(el.dataset.city), w: el.dataset.w }; computeHL(); if (!UI.hl.attack.size) { UI.mode = null; toast('No enemy in range.'); } render(); },
  'mode-unload'(el) { UI.mode = { kind: 'unload', unit: Number(el.dataset.unit) }; render(); },
  'cancel-mode'() { const back = UI.mode && UI.mode.kind === 'cede'; UI.mode = null; if (back) UI.tab = 'diplomacy'; render(); },
  train(el) { mutate((d) => d.trains.push({ city: Number(el.dataset.city), type: el.dataset.type })); toast(`${UNI[el.dataset.type].name} queued`); },
  board(el) { const unit = Number(el.dataset.unit), transport = Number(el.dataset.tr); mutate((d) => { d.board = d.board.filter((b) => b.unit !== unit); d.moves = d.moves.filter((m) => m.unit !== unit); d.board.push({ unit, transport }); }); },
  found(el) { const name = ($('#found-name') || {}).value || ''; const unit = Number(el.dataset.unit); mutate((d) => { d.found = d.found.filter((f) => f.unit !== unit); d.found.push({ unit, name: name.trim() || 'New city' }); }); },
  cargo(el) { const good = $('#cg-good').value, amt = Math.abs(Math.floor(Number($('#cg-amt').value) || 0)) * Number(el.dataset.dir); if (!amt) return; mutate((d) => d.cargo.push({ unit: Number(el.dataset.unit), city: Number(el.dataset.city), good, amount: amt })); },
  // supply
  'route-edit'(el) { const r = st().routes.find((x) => x.id === Number(el.dataset.id)); if (r) UI.routeEdit = routeFormFrom(r); render(); },
  'route-new'() { UI.routeEdit = newRouteForm(); render(); },
  'route-remove'(el) { const id = Number(el.dataset.id); mutate((d) => { d.routeOps = d.routeOps.filter((o) => o.id !== id); d.routeOps.push({ op: 'remove', id }); }); },
  'route-save'() {
    const f = UI.routeEdit; const [type, id] = f.to.split(':');
    const op = { op: f.id ? 'update' : 'create', id: f.id || undefined, from: f.from, to: { type, id: Number(id) }, transports: f.transports, rule: f.rule, goods: f.goods, back: f.back, priority: f.priority };
    mutate((d) => { if (f.id) d.routeOps = d.routeOps.filter((o) => o.id !== f.id); d.routeOps.push(op); });
    toast(f.id ? `Route #${f.id} changes queued` : 'New route queued');
    UI.routeEdit = newRouteForm(); render();
  },
  // production
  prio(el) {
    const p = meP(), s = settings(); const list = (s.priority || p.priority).slice(); const k = el.dataset.key, dir = Number(el.dataset.dir);
    const used = new Set(st().buildings.filter((b) => Q.buildingOwner(st(), b) === UI.me && BLD[b.key].recipes).map((b) => b.key));
    const vis = list.filter((x) => used.has(x)); const i = vis.indexOf(k), j = i + dir; if (j < 0 || j >= vis.length) return;
    const a = list.indexOf(vis[i]), b = list.indexOf(vis[j]); [list[a], list[b]] = [list[b], list[a]];
    s.priority = list; saveDraft(); render();
  },
  // research & diplomacy
  'bp-offer'() { const key = $('#bp-key').value, to = Number($('#bp-to').value), price = Math.max(0, Math.floor(Number($('#bp-price').value) || 0)); mutate((d) => d.diplo.push({ type: 'propose', kind: 'blueprint', to, payload: { key, price } })); },
  buy(el) { const g = el.dataset.good, amount = Math.floor(Number($(`#mk-${g}`).value) || 0); if (amount > 0) mutate((d) => d.buys.push({ good: g, amount, city: UI.marketCity })); },
  sell(el) { const g = el.dataset.good, amount = Math.floor(Number($(`#mk-${g}`).value) || 0); if (amount > 0) mutate((d) => d.sells.push({ good: g, amount, city: UI.marketCity })); },
  declare(el) { const to = Number(el.dataset.to); if (confirm(`Declare war on ${pname(to)}? It takes effect at the start of this turn's resolution.`)) mutate((d) => d.diplo.push({ type: 'declare', to })); },
  'pc-open'(el) { peaceDraft(Number(el.dataset.to)); render(); const pb = $('#peace-builder'); if (pb) pb.scrollIntoView({ block: 'nearest' }); },
  'pc-close'() { UI.peace = null; render(); },
  'pc-pick'() { UI.mode = { kind: 'cede' }; UI.tab = 'map'; UI.sel = null; render(); },
  'pc-send'() {
    const pd = UI.peace; const payload = Q.normPeace(pd);
    mutate((d) => { d.diplo = d.diplo.filter((o) => !(o.type === 'propose' && o.kind === 'peace' && o.to === pd.to)); d.diplo.push({ type: 'propose', kind: 'peace', to: pd.to, payload }); });
    UI.peace = null; toast('Peace treaty queued'); render();
  },
  'clear-forest'(el) { const t = Number(el.dataset.t); mutate((d) => { if (!d.clear.some((x) => x.t === t)) d.clear.push({ t }); }); },
  sabotage(el) { const unit = Number(el.dataset.unit), t = Number(el.dataset.t); mutate((d) => { d.sabotage = d.sabotage.filter((x) => x.unit !== unit); d.sabotage.push({ unit, t }); d.moves = d.moves.filter((x) => x.unit !== unit); d.attacks = d.attacks.filter((x) => x.unit !== unit); }); computeHL(); render(); },
  demolish(el) { const t = Number(el.dataset.t), what = el.dataset.what; mutate((d) => { d.demolish = d.demolish.filter((x) => !(x.t === t && x.what === what)); d.demolish.push({ t, what }); }); },
  treaty(el) { mutate((d) => d.diplo.push({ type: 'propose', kind: 'treaty', to: Number(el.dataset.to), payload: { type: el.dataset.type } })); },
  credits(el) { const to = Number(el.dataset.to), amount = Math.floor(Number($(`#cr-${to}`).value) || 0); if (amount > 0) mutate((d) => d.diplo.push({ type: 'credits', to, amount })); },
  'cancel-treaty'(el) { mutate((d) => d.diplo.push({ type: 'cancelTreaty', id: Number(el.dataset.id) })); },
  // turn flow
  async submit() {
    try {
      const orders = clone(draft());
      UI.bundle = await Sync.submit(UI.bundle, UI.me, orders);
      if (!UI.bundle.pending) UI.bundle.pending = {};
      toast(Sync.mode === 'file' ? 'Orders file downloaded. Send it to the host.' : 'Orders submitted');
      if (Sync.mode === 'local' && allSubmitted()) toast('Everyone has submitted. Resolve the turn when ready.');
      render();
    } catch (e) { toast(`Could not submit: ${e.message}`); }
  },
  async resolve() {
    if (isCampaign()) {
      if (!allSubmitted()) {
        const missing = activePlayers().filter((x) => !submitted(x.id)).map((x) => x.name).join(', ');
        if (!confirm(`Still waiting on ${missing}. Resolve now anyway? Their standing routes and production still run, but they give no new orders.`)) return;
      }
      try {
        const turn = st().turn;
        UI.bundle = (await Sync.resolve(turn)) || UI.bundle;
        UI._d = null; UI.sel = null; UI.mode = null; UI.tab = 'reports'; UI.routeEdit = null;
        toast(`Turn ${turn} resolved`); render();
      } catch (e) { toast(`Could not resolve: ${e.message}`); }
      return;
    }
    if (!allSubmitted()) {
      const missing = activePlayers().filter((x) => !submitted(x.id)).map((x) => x.name).join(', ');
      if (!confirm(`Still waiting on ${missing}. Resolve anyway? Their standing routes and production still run, but they give no new orders.`)) return;
    }
    try {
      if (Sync.mode === 'server') UI.bundle = (await Sync.load()) || UI.bundle;
      const S = st(), orders = {};
      for (const p of S.players) { const pe = UI.bundle.pending[p.id]; if (pe && pe.turn === S.turn) orders[p.id] = pe.orders; }
      const NS = Engine.resolveTurn(S, orders);
      UI.bundle = { state: NS, pending: {} };
      await Sync.publish(UI.bundle);
      for (const p of S.players) try { localStorage.removeItem(`supplylines.draft.${S.id}.${S.turn}.${p.id}`); } catch (e) { /* ignore */ }
      UI._d = null; UI.sel = null; UI.mode = null; UI.tab = 'reports'; UI.routeEdit = null;
      toast(`Turn ${S.turn} resolved${Sync.mode === 'file' ? '. state.json downloaded; commit it to the repo.' : ''}`);
      render();
    } catch (e) { console.error(e); toast(`Could not resolve: ${e.message}`); }
  },
  'save-file'() { UI.menu = false; download(`${st().name.replace(/\W+/g, '-')}-turn${st().turn}.json`, UI.bundle); render(); },
  async 'load-file'() {
    UI.menu = false;

    if (bundle.state) Engine.migrate(bundle.state);
    if (!bundle.state.map || !bundle.state.players) { toast('That file is not a Guns, Pacts, and Commerce game.'); return render(); }
    if (isCampaign()) {
      if (!confirm(`Replace the running campaign with "${bundle.state.name}" (turn ${bundle.state.turn})? Everyone keeps their PIN, and orders submitted this turn are cleared.`)) return render();
      try { UI.bundle = (await Sync.publish(bundle)) || UI.bundle; UI._d = null; UI.views = {}; UI.sel = null; toast('Campaign restored from the file'); } catch (e) { toast(`Could not restore: ${e.message}`); }
      return render();
    }
    UI.bundle = Object.assign({ pending: {} }, bundle); UI._d = null; UI.views = {}; UI.sel = null;

  },
  'export-orders'() { UI.menu = false; download(`orders-p${UI.me + 1}-turn${st().turn}.json`, { player: UI.me, turn: st().turn, orders: draft() }); render(); },
  async 'import-orders'() {

    }
    if (Sync.mode === 'local') await Sync.publish(UI.bundle);

  async reload() { UI.menu = false; try { const b = await Sync.load(); if (b) { UI.bundle = b; Engine.migrate(b.state); UI.bundle.pending = UI.bundle.pending || {}; UI._d = null; } toast('Reloaded'); } catch (e) { toast(e.message); } render(); },
  'new-game'() {
    UI.menu = false;
    if (confirm(isCampaign() ? 'Start a new campaign? The current one is replaced when you click "Start campaign" on the next screen. Download a backup first if you want to keep it.' : 'Start a new game? Download the current game first if you want to keep it.')) { UI.keep = UI.bundle; UI.bundle = null; SETUP.replacing = isCampaign(); renderSetup(); } else render();
  },
  async 'pins-show'() { if (UI.pins) { UI.pins = null; return render(); } try { UI.pins = await Sync.pins(); } catch (e) { toast(e.message); } render(); },
  async 'pin-save'(el) { const pid = Number(el.dataset.pid), v = ($(`#pin-${pid}`) || {}).value || ''; try { await Sync.setPin(pid, v.trim()); UI.pins = await Sync.pins(); toast('PIN saved'); } catch (e) { toast(e.message); } render(); },
  async 'admin-unlock'() {
    const v = (($('#admin-pin') || {}).value || '').trim(); if (!v) return;
    try { const r = await Sync.login(v); if (!r.admin) { toast('That is not the admin PIN'); return; } Sync.setPins(undefined, v); UI.bundle = (await Sync.load()) || UI.bundle; toast('Admin unlocked'); } catch (e) { toast(e.message); }
    render();
  },
  logout() { Sync.logout(); UI.waiting = false; UI.bundle = null; UI.menu = false; UI.pins = null; UI._d = null; renderLogin(); },
};
const CHG = {
  me(el) { UI.me = Number(el.value); UI._d = null; UI.sel = null; UI.mode = null; UI.routeEdit = null; UI.views = {}; render(); },
  'rf-from'(el) { UI.routeEdit.from = Number(el.value); render(); },
  'rf-to'(el) { UI.routeEdit.to = el.value; UI.routeEdit.transports = UI.routeEdit.transports.filter((id) => `unit:${id}` !== el.value); render(); },
  'rf-tr'(el) { const id = Number(el.value), f = UI.routeEdit; f.transports = el.checked ? [...new Set([...f.transports, id])] : f.transports.filter((x) => x !== id); render(); },
  'rf-rule'(el) { UI.routeEdit.rule = el.value; render(); },
  'rf-goods'(el) { const v = Math.floor(Number(el.value) || 0); if (v > 0) UI.routeEdit.goods[el.dataset.good] = v; else delete UI.routeEdit.goods[el.dataset.good]; render(); },
  'rf-back'(el) { const v = Math.floor(Number(el.value) || 0); if (v > 0) UI.routeEdit.back[el.dataset.good] = v; else delete UI.routeEdit.back[el.dataset.good]; render(); },
  'rf-prio'(el) { UI.routeEdit.priority = el.value; render(); },
  pay(el) { const s = settings(); s.pay = s.pay || {}; const u = Q.unitById(st(), Number(el.dataset.id)); if (u && (u.pay !== false) === el.checked) delete s.pay[el.dataset.id]; else s.pay[el.dataset.id] = el.checked; saveDraft(); render(); },
  labor(el) { const s = settings(); s.labor = s.labor || {}; const b = st().buildings.find((x) => x.id === Number(el.dataset.id)); const rcl = b ? Q.recipeOf(b) : null; const v = Math.min((rcl && rcl.maxLabor) || Infinity, Math.max(0, Math.floor(Number(el.value) || 0))); if (b && Q.laborOf(b) === v) delete s.labor[el.dataset.id]; else s.labor[el.dataset.id] = v; saveDraft(); render(); },
  halt(el) { const s = settings(); s.halt = s.halt || {}; const b = st().buildings.find((x) => x.id === Number(el.dataset.id)); const want = !el.checked; if (b && !!b.halted === want) delete s.halt[el.dataset.id]; else s.halt[el.dataset.id] = want; saveDraft(); render(); },
  product(el) { const s = settings(); s.products = s.products || {}; s.products[el.dataset.id] = el.value; saveDraft(); render(); },
  research(el) { mutate((d) => { d.research = d.research.filter((k) => k !== el.value); if (el.checked) d.research.push(el.value); }); },
  'mk-city'(el) { UI.marketCity = Number(el.value); render(); },
  respond(el) { const id = Number(el.dataset.id); mutate((d) => { d.diplo = d.diplo.filter((o) => !(o.type === 'respond' && o.id === id)); d.diplo.push({ type: 'respond', id, accept: el.value === '1' }); }); },
  endvote(el) { mutate((d) => { d.diplo = d.diplo.filter((o) => o.type !== 'endVote'); if (el.checked) d.diplo.push({ type: 'endVote' }); }); },

  repcat(el) { UI.reportCat = el.value; render(); },
  'pc-term'(el) { UI.peace.term = Number(el.value); render(); },
  'pc-num'(el) { UI.peace[el.dataset.side][el.dataset.f] = Math.max(0, Math.floor(Number(el.value) || 0)); render(); },
  'pc-city'(el) { const part = UI.peace[el.dataset.side], id = Number(el.value); part.cities = el.checked ? [...new Set([...part.cities, id])] : part.cities.filter((x) => x !== id); render(); },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (UI.menu && !e.target.closest('.menu')) { UI.menu = false; render(); } return; }
  const fn = ACT[el.dataset.act] || SETUP_ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-chg]');
  if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (UI.mode) { UI.mode = null; render(); } else if (UI.menu) { UI.menu = false; render(); } else if (UI.sel) { UI.sel = null; render(); } }
});

/* =====================================================================
   SETUP
   ===================================================================== */
const SETUP = { n: 4, names: [], colors: [], mapType: RR.MAP.type, tpp: RR.MAP.tilesPerPlayer, start: null };
const startDefaults = () => ({ stock: Object.assign({}, RR.START.stock), credits: RR.START.credits, manpower: RR.START.manpower });
function renderSetup() {
  const st0 = SETUP.start || startDefaults();
  if (isCampaign()) { SETUP.pins = SETUP.pins || []; for (let i = 0; i < SETUP.n; i++) if (!SETUP.pins[i]) { let p; do { p = String(100000 + Math.floor(Math.random() * 900000)); } while (SETUP.pins.includes(p)); SETUP.pins[i] = p; } }
  const pinBox = (i) => (isCampaign() ? `<input type="text" inputmode="numeric" id="sp-pin-${i}" value="${esc(SETUP.pins[i])}" style="width:90px" aria-label="Player ${i + 1} PIN" title="This player's PIN">` : '');
  const rows = Array.from({ length: SETUP.n }, (_, i) => `<div class="prow"><span class="num muted">${i + 1}</span><input type="text" id="sp-name-${i}" value="${esc(SETUP.names[i] || `Player ${i + 1}`)}" aria-label="Player ${i + 1} name"><input type="text" id="sp-city-${i}" value="${esc(SETUP.names[`c${i}`] || '')}" placeholder="Capital name (optional)" aria-label="Player ${i + 1} capital">${pinBox(i)}<input type="color" id="sp-col-${i}" value="${SETUP.colors[i] || RR.PLAYER_COLORS[i]}" aria-label="Player ${i + 1} color"></div>`).join('');
  $('#app').innerHTML = `<div class="setup"><h1>${esc(CONFIG.title)}</h1><p class="lede">A game of diplomacy, trade and supply lines for ${RR.PLAYERS.min} to ${RR.PLAYERS.max} nations, one turn a day.</p>
    ${Sync.mode === 'file' && UI.loadError ? `<div class="notice bad">Could not load ${esc(CONFIG.STATE_URL)}: ${esc(UI.loadError)}. The host can create the game here and commit the downloaded state.json.</div>` : ''}
    <div class="row"><label>Game name <input type="text" id="sp-game" value="${esc(SETUP.game || CONFIG.title)}"></label>
    <label>Players <select id="sp-n" data-act="noop">${Array.from({ length: RR.PLAYERS.max - RR.PLAYERS.min + 1 }, (_, i) => RR.PLAYERS.min + i).map((n) => `<option ${n === SETUP.n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label>Map seed <input type="text" id="sp-seed" value="${esc(SETUP.seed || '')}" placeholder="random" style="width:110px"></label></div>
    <div class="row"><label>Map type <select id="sp-type">${Object.entries(RR.MAP.types).map(([k, v]) => `<option value="${k}" ${k === SETUP.mapType ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
    <label>Tiles per player <select id="sp-tpp">${RR.MAP.sizes.map((n) => `<option ${n === SETUP.tpp ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
    <div class="players">${rows}</div>
    <p class="small muted">The map is about ${SETUP.n * SETUP.tpp} hexes (${SETUP.tpp} per player). Every nation starts with one city and the resources below.</p>
    <fieldset class="startres"><legend>Starting resources for every nation</legend><div class="row">
      ${Object.keys(RR.START.stock).map((g) => `<label>${esc(gl(g)[0].toUpperCase() + gl(g).slice(1))} <input type="number" min="0" max="${RR.CITY.baseStorage}" step="1" id="sp-st-${g}" value="${st0.stock[g]}" style="width:70px"></label>`).join('')}
      <label>Manpower <input type="number" min="0" step="1" id="sp-st-manpower" value="${st0.manpower}" style="width:70px"></label>
      <label>Credits <input type="number" min="0" step="50" id="sp-st-credits" value="${st0.credits}" style="width:90px"></label>
      <button class="btn small" data-act="start-reset">Recommended</button></div>
      <p class="small muted">Recommended: ${Object.entries(RR.START.stock).map(([g, v]) => `${v} ${gl(g)}`).join(', ')}, ${RR.START.manpower} manpower and ${RR.START.credits.toLocaleString('en-US')} credits. Goods are capped at the starting city's storage of ${RR.CITY.baseStorage} each.</p></fieldset>
    ${isCampaign() ? `<p class="small muted">Each player gets the PIN beside their name; it is the only thing they need to log in. Write them down or view them later from the Game menu. ${esc(scheduleText())}.</p>` : ''}
    <div class="row"><button class="btn primary" data-act="create">${isCampaign() ? 'Start campaign' : 'Create game'}</button>${isCampaign() ? `${UI.keep ? '<button class="btn" data-act="setup-cancel">Back to the current campaign</button>' : ''}<button class="btn" data-act="logout">Log out</button>` : '<button class="btn" data-act="load-file">Load a game file</button>'}</div></div>`;
  const sel = $('#sp-n');
  sel.onchange = () => { captureSetup(); SETUP.n = Number(sel.value); renderSetup(); };
  $('#sp-tpp').onchange = () => { captureSetup(); renderSetup(); };
}
function captureSetup() {
  for (let i = 0; i < SETUP.n; i++) { const n = $(`#sp-name-${i}`), c = $(`#sp-col-${i}`), cap = $(`#sp-city-${i}`); if (n) SETUP.names[i] = n.value; if (c) SETUP.colors[i] = c.value; if (cap) SETUP.names[`c${i}`] = cap.value; }
  if (isCampaign()) for (let i = 0; i < SETUP.n; i++) { const pe = $(`#sp-pin-${i}`); if (pe) SETUP.pins[i] = pe.value.trim(); }
  if ($('#sp-game')) SETUP.game = $('#sp-game').value; if ($('#sp-seed')) SETUP.seed = $('#sp-seed').value;
  if ($('#sp-type')) SETUP.mapType = $('#sp-type').value; if ($('#sp-tpp')) SETUP.tpp = Number($('#sp-tpp').value);
  if ($('#sp-st-credits')) {
    const d = startDefaults(), num = (id, def, max) => { const v = Math.floor(Number($(id).value)); return Number.isFinite(v) && $(id).value !== '' ? Math.max(0, Math.min(max, v)) : def; };
    SETUP.start = { stock: {}, credits: num('#sp-st-credits', d.credits, 1e9), manpower: num('#sp-st-manpower', d.manpower, 1e6) };
    for (const g of Object.keys(d.stock)) SETUP.start.stock[g] = num(`#sp-st-${g}`, d.stock[g], RR.CITY.baseStorage);
  }
}
const SETUP_ACT = {
  noop() {},
  'setup-cancel'() { UI.bundle = UI.keep; UI.keep = null; SETUP.replacing = false; render(); },
  async login() {
    const pin = (($('#login-pin') || {}).value || '').trim();
    if (!pin) return;
    try {
      const r = await Sync.login(pin);
      if (r.role === 'admin') Sync.setPins('', pin); else Sync.setPins(pin, undefined);
      UI.loginError = null; await enterCampaign();
    } catch (e) { UI.loginError = e.message; renderLogin(); }
  },
  'start-reset'() { captureSetup(); SETUP.start = null; renderSetup(); },
  async create() {
    captureSetup();
    const players = Array.from({ length: SETUP.n }, (_, i) => ({ name: (SETUP.names[i] || `Player ${i + 1}`).trim().slice(0, 30), color: SETUP.colors[i] || RR.PLAYER_COLORS[i], cityName: (SETUP.names[`c${i}`] || '').trim().slice(0, 40) || undefined }));
    const S = Engine.newGame({ players, seed: SETUP.seed || undefined, name: SETUP.game || CONFIG.title, mapType: SETUP.mapType, tilesPerPlayer: SETUP.tpp, start: SETUP.start || undefined });
    if (isCampaign()) {
      const pins = SETUP.pins.slice(0, SETUP.n);
      if (pins.some((p) => !/^\d{4,10}$/.test(p))) { toast('PINs must be 4 to 10 digits'); return; }
      if (new Set(pins).size !== pins.length) { toast('Every player needs a different PIN'); return; }
      try {
        UI.bundle = await Sync.create(S, pins, SETUP.replacing || !!UI.keep);
      } catch (e) {
        if (e.body && e.body.exists && confirm('A campaign is already running. Replace it?')) { try { UI.bundle = await Sync.create(S, pins, true); } catch (e2) { toast(e2.message); return; } } else { toast(`Could not start the campaign: ${e.message}`); return; }
      }
      UI.keep = null; SETUP.replacing = false; UI._d = null; UI.views = {}; UI.sel = null; UI.tab = 'map';
      if (Sync.you && Sync.you.role === 'player') UI.me = Sync.you.pid; else UI.me = 0;
      toast('Campaign started. Give each player their PIN.');
      render(); return;
    }
    UI.bundle = { state: S, pending: {} }; UI._d = null; UI.views = {}; UI.sel = null; UI.tab = 'map';
    if (!UI.locked) UI.me = 0;
    try { await Sync.publish(UI.bundle); } catch (e) { toast(`Created locally, but could not publish: ${e.message}`); }
    render();
  },
};

/* =====================================================================
   START
   ===================================================================== */
function renderLogin() {
  $('#app').innerHTML = `<div class="setup login"><h1>${esc(CONFIG.title)}</h1><p class="lede">Enter your PIN to join the campaign.</p>
    ${UI.loginError ? `<div class="notice bad">${esc(UI.loginError)}</div>` : ''}
    <form class="row" onsubmit="event.preventDefault(); SETUP_ACT.login();"><input type="password" inputmode="numeric" autocomplete="current-password" id="login-pin" placeholder="PIN" aria-label="PIN" style="width:160px;font-size:1.2rem"><button class="btn primary" type="submit">Enter</button></form>
    <p class="small muted">Your PIN is remembered on this device. The host has the admin PIN.</p></div>`;
  const el = $('#login-pin'); if (el) el.focus();
}
function renderWaiting() {
  UI.waiting = true;
  $('#app').innerHTML = `<div class="setup"><h1>${esc(CONFIG.title)}</h1><p class="lede">No campaign is running right now.</p><p>Your host hasn't started the next campaign yet. This page will pick it up automatically.</p><div class="row"><button class="btn" data-act="logout">Log out</button></div></div>`;
}
async function enterCampaign() {
  try { UI.bundle = await Sync.load(); }
  catch (e) { if (e.status === 401) { Sync.logout(); UI.loginError = e.message; return renderLogin(); } UI.loginError = `Could not reach the server: ${e.message}`; return renderLogin(); }
  if (UI.bundle && UI.bundle.state) { Engine.migrate(UI.bundle.state); UI.bundle.pending = UI.bundle.pending || {}; }
  const you = Sync.you || {};
  if (you.role === 'player') { UI.me = you.pid; UI.locked = true; } else { UI.locked = false; }
  UI._d = null;
  render();
}
async function boot() {
  const params = new URLSearchParams(location.search);
  if (isCampaign()) {
    CONFIG.POLL_SECONDS = Math.max(CONFIG.POLL_SECONDS, 45);
    if (!Sync.hasPin()) renderLogin(); else await enterCampaign();
    startPolling();
    return;
  }
  if (params.has('player')) { UI.me = Math.max(0, Number(params.get('player')) - 1); UI.locked = true; }
  try { UI.bundle = await Sync.load(); } catch (e) { UI.loadError = e.message; UI.bundle = null; }
  if (UI.bundle && UI.bundle.state) Engine.migrate(UI.bundle.state);
  if (UI.bundle && !UI.bundle.state) UI.bundle = null;
  if (UI.bundle) UI.bundle.pending = UI.bundle.pending || {};
  render();
  startPolling();
}
function startPolling() {
  if (Sync.mode !== 'local' && CONFIG.POLL_SECONDS > 0) {
    setInterval(async () => {
      if (document.hidden) return;
      if (isCampaign() && !Sync.hasPin()) return;
      if (!UI.bundle) { if (UI.waiting) { try { const b = await Sync.load(); if (b && b.state) { UI.waiting = false; await enterCampaign(); } } catch (e) { /* offline */ } } return; }
      try {
        const b = await Sync.load();
        if (!b || !b.state) return;
        Engine.migrate(b.state);
        const sig = (x) => JSON.stringify(Object.entries(x || {}).map(([k, v]) => [k, v.turn, v.at]));
        const changed = b.state.turn !== st().turn || sig(b.pending) !== sig(UI.bundle.pending);
        if (changed) { const turnChanged = b.state.turn !== st().turn; UI.bundle = Object.assign({ pending: {} }, b); if (turnChanged) { UI._d = null; UI.sel = null; toast(`Turn ${st().turn} is ready`); } render(); }
      } catch (e) { if (isCampaign() && e.status === 401) { Sync.logout(); UI.bundle = null; UI.loginError = 'Your PIN no longer works (perhaps a new campaign started). Enter your new PIN.'; renderLogin(); } }
    }, CONFIG.POLL_SECONDS * 1000);
  }
}
if (typeof window !== 'undefined') window.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
