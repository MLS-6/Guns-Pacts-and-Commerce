    out.push(`<g transform="translate(${x},${y})"><rect x="-13" y="-5" width="26" height="10" fill="${rail ? '#6f7880' : '#9c7a52'}" stroke="#2b2b2b" stroke-width="1"/><line x1="-13" y1="-5" x2="13" y2="-5" stroke="#2b2b2b"/><line x1="-13" y1="5" x2="13" y2="5" stroke="#2b2b2b"/>${rail ? '<line x1="-11" y1="0" x2="11" y2="0" stroke="#e6dcc8" stroke-width="1.6" stroke-dasharray="2 2"/>' : ''}</g>`);
  }
  // rails
  const railish = (i) => m.tiles[i].rail != null || !!Q.cityAt(S, i);
  for (let i = 0; i < n; i++) {
    if (!railish(i)) continue;
    for (const j of HX.nbrs(m, i)) {
      if (j < i || !railish(j) || (m.tiles[i].rail == null && m.tiles[j].rail == null)) continue;
      const [x1, y1] = center(m, i), [x2, y2] = center(m, j);
      out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2b221b" stroke-width="4" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#c8b59a" stroke-width="1.4" stroke-dasharray="2 3"/>`);
    }
  }
  // borders
  for (let i = 0; i < n; i++) {
    const p = tileOwnerP(i); if (p == null) continue;
    const [x, y] = center(m, i), dd = HX.dirs(m, i);
    for (let k = 0; k < 6; k++) {
      const j = dd[k]; const q = j < 0 ? null : tileOwnerP(j);
      if (q === p) continue;
      const a = CORN[k], b = CORN[(k + 1) % 6], s = 0.9;
      out.push(`<line x1="${(x + a[0] * s).toFixed(1)}" y1="${(y + a[1] * s).toFixed(1)}" x2="${(x + b[0] * s).toFixed(1)}" y2="${(y + b[1] * s).toFixed(1)}" stroke="${pcol(p)}" stroke-width="3.2" stroke-linecap="round"/>`);
    }
  }
  // tile buildings and traps
  for (const b of S.buildings) {
    if (BLD[b.key].place !== 'tile') continue;
    const [x, y] = center(m, b.t);
    const idle = b.status && b.status.startsWith('Idle');
    out.push(`<g transform="translate(${x},${y - 11})"><rect x="-11" y="-6" width="22" height="12" rx="3" fill="${idle ? '#7a2b26' : '#1e2620'}" opacity="0.88"/><text class="blbl">${BLD[b.key].abbr}</text></g>`);
  }
  for (let i = 0; i < n; i++) if (m.tiles[i].trap != null) { const [x, y] = center(m, i); out.push(`<text x="${x + 11}" y="${y - 6}" style="font-size:12px;font-weight:700" fill="#1e2620" text-anchor="middle">✕</text>`); }
  // cities
  for (const c of S.cities) {
    const [x, y] = center(m, c.t), col = pcol(c.owner), mh = Q.maxHp(S, c);
    out.push(`<g transform="translate(${x},${y})"><rect x="-9" y="-9" width="18" height="18" rx="2" fill="${col}" stroke="#141a16" stroke-width="1.6"/><rect x="-4" y="-4" width="8" height="8" fill="#fff" opacity="0.9"/>
      <text class="lbl" y="-14">${esc(c.name)}</text><text class="lbl" y="22" style="font-size:9.5px">${c.hp}/${mh}</text></g>`);
  }
  // units
  if (!flow || true) {
    const byTile = new Map();
    for (const u of S.units) if (u.carriedBy == null) { if (!byTile.has(u.t)) byTile.set(u.t, []); byTile.get(u.t).push(u); }
    for (const [t, list] of byTile) {
      const [x, y] = center(m, t), city = !!Q.cityAt(S, t);
      const combat = list.filter((u) => UNI[u.type].role === 'combat');
      const logi = list.filter((u) => UNI[u.type].role !== 'combat');
      combat.slice(0, 2).forEach((u, k) => out.push(unitToken(u, x + (city ? 10 : 0) + k * 6, y + (city ? 9 : 2) + k * 3, false)));
      logi.slice(0, 3).forEach((u, k) => out.push(unitToken(u, x - 11 + k * 11, y + (city || combat.length ? 14 : 4), true)));
      if (logi.length > 3) out.push(`<text class="lbl" x="${x + 16}" y="${y + 18}" style="font-size:9px">+${logi.length - 3}</text>`);
    }
  }
  // overlays
  if (!flow) {
    const sel = UI.sel;
    for (const t of UI.hl.build) { const [x, y] = center(m, t); out.push(`<polygon points="${hexPts(x, y, 0.9)}" fill="rgba(242,211,122,0.28)" stroke="#f2d37a" stroke-width="2"/>`); }
    for (const [t] of UI.hl.move) { const [x, y] = center(m, t); out.push(`<polygon points="${hexPts(x, y, 0.88)}" fill="rgba(255,255,255,0.18)" stroke="#fdf4d0" stroke-width="1.4"/>`); }
    for (const t of UI.hl.attack) { const [x, y] = center(m, t); out.push(`<polygon points="${hexPts(x, y, 0.88)}" fill="rgba(214,70,62,0.25)" stroke="#ff6b5e" stroke-width="2"/>`); }
    if (sel) { const [x, y] = center(m, sel.t); out.push(`<polygon points="${hexPts(x, y, 0.97)}" fill="none" stroke="#fff" stroke-width="2.6"/>`); }
    // my planned orders
    const d = draft();
    for (const mv of d.moves) {
      const pts = mv.path.map((t) => center(m, t).map((v) => v.toFixed(1)).join(',')).join(' ');
      out.push(`<polyline points="${pts}" fill="none" stroke="#1e2620" stroke-width="5" opacity="0.5" stroke-linejoin="round"/><polyline points="${pts}" fill="none" stroke="#f2d37a" stroke-width="2.6" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arr-brass)"/>`);
    }
    for (const a of d.attacks) {
      const from = a.unit != null ? (Q.unitById(S, a.unit) || {}).t : (Q.cityById(S, a.city) || {}).t;
      if (from == null) continue;
      const [x1, y1] = center(m, from), [x2, y2] = center(m, a.t);
      out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ff6b5e" stroke-width="2.6" marker-end="url(#arr-red)"/>`);
    }
    for (const b of d.builds) {
      if (b.t == null) continue;
      const [x, y] = center(m, b.t);
      out.push(`<polygon points="${hexPts(x, y, 0.8)}" fill="none" stroke="#f2d37a" stroke-width="2" stroke-dasharray="4 3"/><g transform="translate(${x},${y + 11})"><rect x="-12" y="-6" width="24" height="12" rx="3" fill="#a8801f"/><text class="blbl">+${esc(BLD[b.key].abbr || BLD[b.key].name.slice(0, 3))}</text></g>`);
    }
    for (const dm of d.demolish) {
      const [x, y] = center(m, dm.t);
      out.push(`<polygon points="${hexPts(x, y, 0.8)}" fill="rgba(163,49,43,0.18)" stroke="#ff6b5e" stroke-width="2" stroke-dasharray="4 3"/><text x="${x}" y="${y + 4}" text-anchor="middle" style="font-size:16px;font-weight:700" fill="#ff6b5e">✕</text>`);
    }
    for (const o of d.clear) {
      const [x, y] = center(m, o.t);
      out.push(`<polygon points="${hexPts(x, y, 0.8)}" fill="rgba(194,160,82,0.25)" stroke="#e0b860" stroke-width="2" stroke-dasharray="4 3"/><text x="${x}" y="${y + 5}" text-anchor="middle" style="font-size:14px;font-weight:700" fill="#f2d37a">🪓</text>`);
    }
    if (UI.peace) {
      for (const [list, col] of [[UI.peace.give.tiles, '#f2d37a'], [UI.peace.get.tiles, '#8fe0ff']]) for (const t of list) {
        const [x, y] = center(m, t);
        out.push(`<polygon points="${hexPts(x, y, 0.78)}" fill="${col}" fill-opacity="0.35" stroke="${col}" stroke-width="2.4"/>`);
      }
    }
    for (const un of d.unload) {
      const u = Q.unitById(S, un.unit); if (!u) continue;
      const [x1, y1] = center(m, Q.posOf(S, u)), [x2, y2] = center(m, un.t);
      out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f2d37a" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-brass)"/>`);
    }
  } else {
    out.push(flowOverlay());
  }
  out.push('</g>');
  return { W, H, body: out.join('') };
}

function routeTiles(r) {
  const S = st(), from = Q.cityById(S, r.from), to = r.to.type === 'city' ? Q.cityById(S, r.to.id) : Q.unitById(S, r.to.id);
  if (!from || !to) return null;
  const u = r.transports.map((id) => Q.unitById(S, id)).find(Boolean) || { type: 'caravan', owner: r.owner, cargo: {} };
  return Q.findPath(S, u, from.t, to.t, { partner: r.partner, ignoreUnits: true });
}
function visibleRoutes() { const S = st(); return S.routes.filter((r) => r.owner === UI.me || r.partner === UI.me); }
function flowOverlay() {
  const S = st(), m = S.map, out = [];
  visibleRoutes().forEach((r, k) => {
    const path = routeTiles(r);
    if (!path || path.length < 2) return;
    const off = ((k % 3) - 1) * 3;
    const pts = path.map((t) => { const [x, y] = center(m, t); return `${(x + off).toFixed(1)},${(y + off).toFixed(1)}`; });
    const goods = Object.keys(r.goods);
    const g = goods[0] || 'food';
    const est = Q.routeEstimate(S, r);
    out.push(`<polyline points="${pts.join(' ')}" fill="none" stroke="#141a16" stroke-width="7" opacity="0.55" stroke-linejoin="round"/>`);
    out.push(`<polyline points="${pts.join(' ')}" fill="none" stroke="${RR.GOOD_COLORS[g]}" stroke-width="4" stroke-linejoin="round" marker-end="url(#arr-${g})" ${r.accepted ? '' : 'stroke-dasharray="6 5"'}/>`);
    if (Object.keys(r.back || {}).length) {
      const bg = Object.keys(r.back)[0];
      const back = path.slice().reverse().map((t) => { const [x, y] = center(m, t); return `${(x - off - 5).toFixed(1)},${(y - off + 5).toFixed(1)}`; });
      out.push(`<polyline points="${back.join(' ')}" fill="none" stroke="${RR.GOOD_COLORS[bg]}" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arr-${bg})"/>`);
    }
    const mid = center(m, path[Math.floor(path.length / 2)]);
    const label = r.rule === 'stock' ? `#${r.id} keep ${fmtGoods(r.goods)}` : `#${r.id} ${fmtGoods(r.goods)}/turn`;
    out.push(`<text class="lbl" x="${mid[0]}" y="${mid[1] - 14}" style="font-size:10px">${esc(label)} (capacity ${est.perTurn}/turn)</text>`);
  });
  return out.join('');
}

/* ---------- pan & zoom ---------- */
function fitView(kind) {
  const [W, H] = mapSize(st().map);
  UI.views[kind] = { x: 0, y: 0, w: W, h: H };
}
function attachMap(svg, kind) {
  let drag = null;
  const v = () => UI.views[kind];
  const apply = () => svg.setAttribute('viewBox', `${v().x} ${v().y} ${v().w} ${v().h}`);
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = svg.getBoundingClientRect(), V = v();
    const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    const k = e.deltaY > 0 ? 1.15 : 1 / 1.15;
    const [W] = mapSize(st().map);
    const nw = Math.min(W * 1.6, Math.max(160, V.w * k)), nh = (V.h * nw) / V.w;
    V.x += (V.w - nw) * fx; V.y += (V.h - nh) * fy; V.w = nw; V.h = nh; apply();
  }, { passive: false });
  svg.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, vx: v().x, vy: v().y, moved: false }; });
  svg.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    if (!drag.moved) { drag.moved = true; svg.classList.add('drag'); try { svg.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ } }
    const r = svg.getBoundingClientRect(), sx = v().w / r.width;
    v().x = drag.vx - dx * sx; v().y = drag.vy - dy * sx; apply();
  });
  const end = (e) => {
    if (!drag) return;
    const wasDrag = drag.moved; drag = null; svg.classList.remove('drag');
    if (wasDrag || kind !== 'main') return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (el && el.dataset && el.dataset.t != null) onTileClick(Number(el.dataset.t));
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', () => { drag = null; svg.classList.remove('drag'); });
}
function zoomBy(kind, k) {
  const V = UI.views[kind]; const nw = V.w * k, nh = V.h * k;
  V.x += (V.w - nw) / 2; V.y += (V.h - nh) / 2; V.w = nw; V.h = nh; render();
}
function centerOn(kind, t) {
  if (!UI.views[kind]) fitView(kind);
  const V = UI.views[kind], [x, y] = center(st().map, t);
  const w = Math.min(V.w, 900), h = (V.h * w) / V.w;
  UI.views[kind] = { x: x - w / 2, y: y - h / 2, w, h };
}

/* ---------- map clicks ---------- */
function onTileClick(t) {
  const S = st();
  if (S.gameOver && UI.mode) UI.mode = null;
  if (UI.mode) {
    const md = UI.mode;
    if (md.kind === 'build' && UI.hl.build.has(t)) {
      mutate((d) => d.builds.push({ city: md.city, key: md.key, t }));
      if (md.key !== 'railroad') UI.mode = null;
      computeHL(); render(); return;
    }
    if (md.kind === 'weapon' && UI.hl.attack.has(t)) {
      UI.mode = null;
      mutate((d) => { d.attacks = d.attacks.filter((a) => !(a.city === md.city && a.w === md.w)); d.attacks.push({ city: md.city, w: md.w, t }); });
      return;
    }
    if (md.kind === 'cede' && UI.peace) {
      const oc = Q.tileOwnerCity(S, t);
      if (UI.hl.build.has(t) && oc) {
        const part = oc.owner === UI.me ? UI.peace.give : UI.peace.get;
        part.tiles = part.tiles.includes(t) ? part.tiles.filter((x) => x !== t) : [...part.tiles, t];
        computeHL(); render(); return;
      }
      toast(`Click a tile held by you or ${pname(UI.peace.to)}, other than a city.`);
      return;
    }
    if (md.kind === 'unload' && UI.hl.build.has(t)) {
      UI.mode = null;
      mutate((d) => { d.unload = d.unload.filter((x) => x.unit !== md.unit); d.unload.push({ unit: md.unit, t }); });
      return;
    }
    toast('That tile is not a valid choice. Press Esc to cancel.');
    return;
  }
  const su = UI.sel && UI.sel.unit != null ? Q.unitById(S, UI.sel.unit) : null;
  if (su && su.owner === UI.me && t !== su.t) {
    if (UI.hl.attack.has(t)) { mutate((d) => { d.attacks = d.attacks.filter((a) => a.unit !== su.id); d.attacks.push({ unit: su.id, t }); }); return; }
    if (UI.hl.move.has(t)) { const path = UI.hl.move.get(t); mutate((d) => { d.moves = d.moves.filter((m) => m.unit !== su.id); d.moves.push({ unit: su.id, path }); }); return; }
  }
  const units = Q.unitsAt(S, t);
  let unit = null;
  if (UI.sel && UI.sel.t === t && units.length) {
    const i = units.findIndex((u) => u.id === UI.sel.unit);
    unit = units[(i + 1) % units.length].id;
  } else {
    const pick = units.find((u) => u.owner === UI.me && UNI[u.type].role === 'combat') || units.find((u) => u.owner === UI.me) || units[0];
    unit = pick ? pick.id : null;
  }
  UI.sel = { t, unit };
  computeHL(); render();
}

/* =====================================================================
   HEADER, TABS, RENDER LOOP
   ===================================================================== */
const TABS = [
  ['map', 'Map'], ['flow', 'Flow'], ['supply', 'Supply'], ['stock', 'Stockpiles'], ['buildings', 'Buildings'], ['production', 'Production'],
  ['research', 'Research'], ['market', 'Market'], ['diplomacy', 'Diplomacy'], ['reports', 'Reports'], ['orders', 'Orders'],
];
function renderHeader() {
  const S = st(), p = meP(), d = draft();
  const sel = UI.locked
    ? `<strong>${esc(p.name)}</strong>`
    : `<label class="small muted">Playing as <select data-chg="me" aria-label="Playing as">${S.players.map((x) => `<option value="${x.id}" ${x.id === UI.me ? 'selected' : ''}>${esc(x.name)}${x.eliminated ? ' (out)' : ''}</option>`).join('')}</select></label>`;
  const vas = p.eliminated ? ' <span class="tag war">out of the game</span>' : '';
  return `<header class="bar" style="--me:${p.color}">
    <div class="nation"><div><div class="title">${esc(CONFIG.title)}</div><div class="sub">${esc(S.name)}, ${esc(Sync.label.toLowerCase())}</div></div></div>
    <div class="turn">Turn ${S.turn}</div>
    <div>${sel}${vas}</div>
    <div class="res"><span>Credits <b>${p.credits}</b></span><span>Manpower <b>${p.manpower}</b>${reservedMp() ? ` <span class="small muted">(−${reservedMp()} queued)</span>` : ''}</span><span>Science <b>${p.science}</b></span></div>
    <div class="spacer"></div>

    <button class="btn ${allSubmitted() ? 'brass' : ''}" data-act="resolve" ${S.gameOver ? 'disabled' : ''} title="Resolve the turn for everyone">Resolve turn</button>
    <button class="btn" data-act="menu" aria-haspopup="true">Game ▾</button>
    ${UI.menu ? `<div class="menu" role="menu">
      <button class="btn" data-act="save-file">Download game file</button>
      <button class="btn" data-act="load-file">Load game file</button>
      <hr><button class="btn" data-act="export-orders">Download my orders</button>
      <button class="btn" data-act="import-orders">Import players' orders</button>
      <hr><button class="btn" data-act="reload">Reload from ${Sync.mode === 'local' ? 'storage' : 'shared copy'}</button>
      <button class="btn danger" data-act="new-game">Start a new game</button></div>` : ''}
  </header>`;
}
function renderTabs() {
  const d = draft(), S = st();
  const newReports = (S.reports[UI.me] || []).filter((r) => r.turn === S.turn - 1).length;
  const chips = activePlayers().map((x) => `<span class="chip ${submitted(x.id) ? 'done' : ''}" title="${submitted(x.id) ? 'Orders submitted' : 'Waiting for orders'}"><i style="background:${x.color}"></i>${esc(x.name)}${submitted(x.id) ? ' ✓' : ''}</span>`).join('');
  return `<nav class="tabs" role="tablist">${TABS.map(([k, label]) => `<button role="tab" aria-selected="${UI.tab === k}" class="${UI.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}">${label}${k === 'orders' && draftCount(d) ? `<span class="count">${draftCount(d)}</span>` : ''}${k === 'reports' && newReports ? `<span class="count">${newReports}</span>` : ''}</button>`).join('')}<div class="chips" aria-label="Who has submitted orders">${chips}</div></nav>`;
}
function render() {
  if (UI._rendering) { UI._again = true; return; }
  UI._rendering = true;
  try { renderNow(); } finally { UI._rendering = false; }
  if (UI._again) { UI._again = false; setTimeout(render, 0); }
}
function renderNow() {
  if (!UI.bundle || !UI.bundle.state) { renderSetup(); return; }
  const S = st();
  if (!S.players[UI.me]) UI.me = 0;
  const root = $('#app');
  const scroll = $('.main') ? $('.main').scrollTop : 0;
  const sideScroll = $('.side') ? $('.side').scrollTop : 0;
  let body = '';
  try {
    body = (TAB_RENDER[UI.tab] || TAB_RENDER.map)();
  } catch (e) {
    console.error(e);
    body = `<div class="page"><div class="notice bad">This tab hit an error: ${esc(e.message)}</div></div>`;
  }
  const over = S.gameOver ? `<div class="gameover">Game over on turn ${S.gameOver.turn}: ${esc(S.gameOver.reason)}</div>` : '';
  root.innerHTML = `<div class="app">${renderHeader()}${renderTabs()}<main class="main">${over}${body}</main></div>`;
  for (const svg of root.querySelectorAll('svg[data-map]')) attachMap(svg, svg.dataset.map);
  if ($('.main')) $('.main').scrollTop = scroll;
  if ($('.side')) $('.side').scrollTop = sideScroll;
}

/* ---------- map tab ---------- */
function mapBlock(kind) {
  if (!UI.views[kind]) {
    fitView(kind);
    const cap = Q.citiesOf(st(), UI.me)[0];
    if (cap && kind === 'main') centerOn(kind, cap.t);
  }
  const { body } = buildMapSvg(kind), V = UI.views[kind];
  return `<svg data-map="${kind}" viewBox="${V.x} ${V.y} ${V.w} ${V.h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${kind === 'flow' ? 'Resource flow map' : 'Game map'}">${body}</svg>`;
}
function legendHtml() {
  return `<div class="legend">${Object.entries(RR.TILES).map(([, t]) => `<span><i style="background:${t.color}"></i>${t.name}${t.glyph ? ` ${t.glyph}` : ''}</span>`).join('')}
    <span>■ City (HP below)</span><span>● Combat unit</span><span>▬ Logistics unit</span><span>⛵ Ship (hull shape)</span></div>`;
}
const TAB_RENDER = {};
TAB_RENDER.map = function () {
  computeHL();
  const md = UI.mode;
  let modebar = '';
  if (md) {
    const what = md.kind === 'build' ? `Placing ${BLD[md.key].name.toLowerCase()}: click a highlighted tile` : md.kind === 'weapon' ? `Aiming ${BLD[md.w].name.toLowerCase()}: click a red tile` : md.kind === 'cede' ? `Peace treaty with ${esc(pname(UI.peace ? UI.peace.to : 0))}: click your tiles to give (gold) and theirs to ask for (blue)` : 'Unloading: click a highlighted tile';
    modebar = `<div class="modebar">${what}<button class="btn small" data-act="cancel-mode">${md.key === 'railroad' || md.kind === 'cede' ? 'Done' : 'Cancel'}</button></div>`;
  }
  return `<div class="split"><div class="mapwrap">${mapBlock('main')}
      <div class="maptools"><button class="btn small" data-act="zoom" data-k="0.8" aria-label="Zoom in">+</button><button class="btn small" data-act="zoom" data-k="1.25" aria-label="Zoom out">−</button><button class="btn small" data-act="fit" data-kind="main">Whole map</button><button class="btn small" data-act="legend">${UI.legend ? 'Hide' : 'Show'} legend</button></div>
      ${modebar}${UI.legend ? legendHtml() : ''}</div>
    <aside class="side">${sidePanel()}</aside></div>`;
};

/* ---------- side panel ---------- */
function goodsGrid(stock, city) {
  const S = st(), res = city ? reserved(city.id).goods : {};
  return `<div class="goodsgrid">${RR.GOODS.map((g) => {
    const v = stock[g] || 0, cap = city ? Q.capacity(S, city, g) : null, after = v - (res[g] || 0);
    const cls = cap != null && v >= cap ? 'full' : cap != null && v >= cap * 0.9 ? 'near' : v ? '' : 'z';
    return `<div class="${cls}"><span>${GN(g)}</span><span class="num">${v}${cap != null ? `<span class="muted">/${cap}</span>` : ''}${res[g] ? ` <span class="warn">→${after}</span>` : ''}</span></div>`;
  }).join('')}</div>`;
}
function sidePanel() {

      <h3>Your cities</h3><ul class="list">${caps.map((c) => `<li><button class="linkbtn" data-act="goto" data-t="${c.t}">${esc(c.name)}</button><span class="num">${c.hp}/${Q.maxHp(S, c)} HP</span></li>`).join('') || '<li class="muted">None</li>'}</ul>
      <h3>Your units</h3><ul class="list">${Q.unitsOf(S, UI.me).map((u) => `<li><button class="linkbtn" data-act="goto-unit" data-id="${u.id}">${esc(Q.unitName(u))}</button><span class="small muted">${tl(Q.posOf(S, u))}</span></li>`).join('') || '<li class="muted">None yet. Build a barracks to raise infantry.</li>'}</ul>`;
  }
  const t = UI.sel.t, tile = S.map.tiles[t], city = Q.cityAt(S, t), oc = Q.tileOwnerCity(S, t), tb = Q.tileBuilding(S, t);
  const parts = [];
  parts.push(`<section><h2>${esc(RR.TILES[tile.type].name)} <span class="muted small">at ${tl(t)}</span></h2><dl class="kv">
    <dt>Territory</dt><dd>${oc ? `<span class="pdot" style="background:${pcol(oc.owner)}"></span>${esc(oc.name)} (${esc(pname(oc.owner))})` : 'Unclaimed'}</dd>
    ${tb ? `<dt>Building</dt><dd>${esc(BLD[tb.key].name)}${tb.status ? ` <span class="small ${tb.status.startsWith('Idle') ? 'warn' : 'muted'}">${esc(tb.status)}</span>` : ''}</dd>` : ''}
    ${tile.rail != null ? `<dt>Railroad</dt><dd>${esc(pname(tile.rail))}</dd>` : ''}${tile.bridge ? '<dt>Bridge</dt><dd>Yes</dd>' : ''}
    ${tile.trap != null ? `<dt>Tank trap</dt><dd>${esc(cityName(tile.trap))}</dd>` : ''}</dl>${clearBlock(t)}${demolishBlock(t)}</section>`);
  if (city) parts.push(cityPanel(city));
  const units = Q.unitsAt(S, t);
  if (units.length) {
    parts.push(`<section><h3>Units here</h3>${units.map((u) => `<button class="unitrow ${u.id === UI.sel.unit ? 'on' : ''}" data-act="sel-unit" data-id="${u.id}"><span class="pdot" style="background:${pcol(u.owner)}"></span>${esc(Q.unitName(u))}<span class="spacer" style="flex:1"></span><span class="num small">${u.hp}/${UNI[u.type].hp} HP</span></button>`).join('')}</section>`);
  }
  const su = UI.sel.unit != null ? Q.unitById(S, UI.sel.unit) : null;

  return parts.join('');
}
function clearBlock(t) {
  const S = st();
  if (S.gameOver || S.map.tiles[t].type !== 'forest') return '';
  const oc = Q.tileOwnerCity(S, t);
  if (!oc || oc.owner !== UI.me) return '';
  const d = draft(), CF = RR.CLEAR_FOREST, qi = d.clear.findIndex((x) => x.t === t);
  if (qi >= 0) return `<div class="row small" style="margin-top:6px"><span class="tag">Clearing forest</span><button class="x" data-act="rm" data-list="clear" data-idx="${qi}" aria-label="Cancel clearing">✕</button></div>`;
  let err = Q.checkClear(S, UI.me, { t });
  if (!err && (oc.stock.tools || 0) - (reserved(oc.id).goods.tools || 0) < CF.tools) err = `${oc.name}'s tools are already committed this turn`;
  if (!err && S.players[UI.me].manpower - reservedMp() < CF.mp) err = 'Not enough uncommitted manpower';
  return `<div class="row small" style="margin-top:6px"><button class="btn small" data-act="clear-forest" data-t="${t}" ${err ? 'disabled' : ''}>Clear forest</button><span class="muted">${err ? esc(err) : `${CF.tools} tool + ${CF.mp} manpower; yields ${CF.lumber} lumber to ${esc(oc.name)}; becomes grassland`}</span></div>`;
}
function demolishBlock(t) {
  const S = st(), opts = Q.demolishable(S, UI.me, t);
  if (!opts.length || S.gameOver) return '';
  const tile = S.map.tiles[t], d = draft();
  const keyOf = (w) => (w === 'building' ? Q.tileBuilding(S, t).key : w === 'trap' ? 'tankTrap' : w === 'rail' ? 'railroad' : tile.bridge === 'rail' ? 'railBridge' : 'bridge');
  const back = (k) => Object.entries(BLD[k].cost).filter(([g]) => g !== 'mp').map(([g, v]) => [g, Math.floor(v * RR.DEMOLISH.refund)]).filter(([, v]) => v > 0).map(([g, v]) => `${v} ${gl(g)}`).join(', ');
  return `<div style="margin-top:6px">${opts.map((w) => {
    const k = keyOf(w), qi = d.demolish.findIndex((x) => x.t === t && x.what === w), err = Q.checkDemolish(S, UI.me, { t, what: w });
    return qi >= 0 ? `<div class="row small"><span class="tag war">Demolishing ${esc(BLD[k].name.toLowerCase())}</span><button class="x" data-act="rm" data-list="demolish" data-idx="${qi}" aria-label="Cancel demolition">✕</button></div>`
      : `<div class="row small"><button class="btn small danger" data-act="demolish" data-t="${t}" data-what="${w}" ${err ? 'disabled' : ''}>Demolish ${esc(BLD[k].name.toLowerCase())}</button><span class="muted">${err ? esc(err) : `${RR.DEMOLISH.mp} manpower; returns ${esc(back(k) || 'nothing')}`}</span></div>`;
  }).join('')}</div>`;
}
function cityPanel(c) {

    return `<div class="opt ${err ? 'no' : ''}"><span>${esc(b.name)}${err ? ` <span class="small warn">${esc(err)}</span>` : ''}</span>${act}<span class="cost">${esc(costText(b.cost))}</span></div>`;
  }).join('');
  const trainOpts = Object.entries(UNI).filter(([k]) => Q.unitUnlocked(S, UI.me, k)).map(([k, u]) => {

    return `<div class="opt ${err ? 'no' : ''}"><span>${esc(u.name)}${err ? ` <span class="small muted">${esc(err)}</span>` : ''}</span><button class="btn small" data-act="train" data-city="${c.id}" data-type="${k}" ${err ? 'disabled' : ''}>Build</button><span class="cost">${esc(costText(u.cost))}</span></div>`;
  }).join('');
  const weapons = ['fort', 'navalBattery'].filter((w) => Q.countB(S, c.id, w)).map((w) => `<button class="btn small" data-act="mode-weapon" data-city="${c.id}" data-w="${w}">Aim ${BLD[w].name.toLowerCase()}</button>`).join(' ');
  return `${head}</section>
    <section><h3>Stockpile</h3>${goodsGrid(c.stock, c)}<p class="small muted" style="margin-top:4px">Red arrows show what is left after this turn's orders.</p></section>
    <section><h3>Buildings (${blds.length})</h3><p class="small">${Object.entries(counts).map(([k, n]) => `${esc(BLD[k].short || BLD[k].name)}${n > 1 ? ` ×${n}` : ''}`).join(', ') || '<span class="muted">None yet</span>'}</p>
      ${queued.length ? `<p class="small">Queued: ${queued.map((b) => `${esc(BLD[b.key].name)}${b.t != null ? ` at ${tl(b.t)}` : ''}`).join(', ')}</p>` : ''}
      <h4>Build</h4><div class="buildlist">${opts}</div></section>
    <section><h3>Recruit</h3>${qTrain.length ? `<p class="small">Queued: ${qTrain.map((x) => esc(UNI[x.type].name)).join(', ')}</p>` : ''}<div class="buildlist">${trainOpts || '<p class="muted small">Research units first.</p>'}</div></section>
    ${weapons ? `<section><h3>Defenses</h3>${weapons}</section>` : ''}`;
}
function unitPanel(u) {
  const S = st(), dd = UNI[u.type], d = draft(), own = u.owner === UI.me;
  const mv = d.moves.find((m) => m.unit === u.id), at = d.attacks.find((a) => a.unit === u.id);
  const tr = u.carriedBy != null ? Q.unitById(S, u.carriedBy) : null;
  const aboard = Q.carried(S, u);
  const out = [`<section><h3>${esc(Q.unitName(u))} <span class="muted small">${esc(pname(u.owner))}</span></h3><dl class="kv">
    <dt>HP</dt><dd class="num">${u.hp} / ${dd.hp}</dd><dt>Move</dt><dd>${dd.move} tiles${dd.cls === 'rail' ? ' (rail only)' : ''}</dd>
    ${dd.range ? `<dt>Attack</dt><dd>range ${dd.range}, ${dd.ammo} ammo per attack</dd>` : ''}
    ${dd.cargo ? `<dt>Cargo</dt><dd>${Q.cargoUsed(u)} / ${dd.cargo}${Q.cargoUsed(u) ? `: ${esc(fmtGoods(u.cargo))}` : ''}</dd>` : ''}
    ${dd.carry ? `<dt>Carrying</dt><dd>${aboard.reduce((a, x) => a + Q.carrySlots(u, x), 0)} / ${dd.carry} slots${dd.carryTypes ? ` (${Object.entries(dd.carryTypes).map(([k, n]) => `${UNI[k].name.toLowerCase()} ${n}`).join(', ')})` : ''}${aboard.length ? `: ${aboard.map((x) => esc(Q.unitName(x))).join(', ')}` : ''}</dd>` : ''}
    ${tr ? `<dt>Aboard</dt><dd>${esc(Q.unitName(tr))}</dd>` : ''}
    ${u.route != null ? `<dt>Route</dt><dd>#${u.route} (${esc(u.leg || '')})</dd>` : ''}
    ${own ? `<dt>Supply</dt><dd class="small">${esc(u.supply || '—')}</dd><dt>Upkeep</dt><dd class="small">${esc(fmtGoods(Q.upkeepOf(S, u, mv ? mv.path.length - 1 : 0)) || 'none (in base)')}</dd>` : ''}</dl></section>`];
  if (!own) return out.join('');
  const ord = [];
  if (mv) ord.push(`<li>Move to ${tl(mv.path[mv.path.length - 1])} (${mv.path.length - 1} tiles)<button class="x" data-act="clear" data-list="moves" data-unit="${u.id}" aria-label="Cancel move">✕</button></li>`);
  if (at) ord.push(`<li>Attack ${tl(at.t)}<button class="x" data-act="clear" data-list="attacks" data-unit="${u.id}" aria-label="Cancel attack">✕</button></li>`);
  const brd = d.board.find((b) => b.unit === u.id); if (brd) ord.push(`<li>Board ${esc(uname(brd.transport))}<button class="x" data-act="clear" data-list="board" data-unit="${u.id}">✕</button></li>`);
  const unl = d.unload.find((b) => b.unit === u.id); if (unl) ord.push(`<li>Unload at ${tl(unl.t)}<button class="x" data-act="clear" data-list="unload" data-unit="${u.id}">✕</button></li>`);
  const fnd = d.found.find((f) => f.unit === u.id); if (fnd) ord.push(`<li>Found ${esc(fnd.name)}<button class="x" data-act="clear" data-list="found" data-unit="${u.id}">✕</button></li>`);
  const acts = [];
  if (u.route != null) acts.push(`<p class="small muted">This unit runs route #${u.route} automatically. Remove it from the route in the Supply tab to move it by hand.</p>`);
  else if (u.carriedBy == null) acts.push(`<p class="small muted">${UI.hl.move.size ? 'Highlighted tiles are in reach; red tiles can be attacked.' : 'No tiles in reach.'}</p>`);

    for (const x of trs) acts.push(`<button class="btn small" data-act="board" data-unit="${u.id}" data-tr="${x.id}">Board ${esc(Q.unitName(x))}</button>`);
  }
  if (u.carriedBy != null) acts.push(`<button class="btn small" data-act="mode-unload" data-unit="${u.id}">Unload…</button>`);
  if (dd.role === 'logistic' && u.carriedBy == null) {
    const err = Q.checkFound(S, UI.me, u.id);
    acts.push(err ? `<p class="small muted">Found a city: ${esc(err)}.</p>` : `<div class="row"><input type="text" id="found-name" placeholder="City name" aria-label="New city name"><button class="btn small brass" data-act="found" data-unit="${u.id}">Found city here</button></div>`);
    const c = Q.cityAt(S, u.t);
    if (c && c.owner === UI.me && dd.cargo) {
      acts.push(`<h4>Load or unload in ${esc(c.name)}</h4><div class="row"><select id="cg-good" aria-label="Good">${RR.GOODS.map((g) => `<option value="${g}">${GN(g)} (city ${c.stock[g] || 0}, aboard ${u.cargo[g] || 0})</option>`).join('')}</select><input type="number" id="cg-amt" min="1" value="10" aria-label="Amount"></div>
        <div class="row"><button class="btn small" data-act="cargo" data-unit="${u.id}" data-city="${c.id}" data-dir="1">Load</button><button class="btn small" data-act="cargo" data-unit="${u.id}" data-city="${c.id}" data-dir="-1">Unload</button></div>`);

  return out.join('');
}

/* ---------- Flow ---------- */

  const S = st(), routes = visibleRoutes();

    `<optgroup label="Trade with another nation">${S.cities.filter((c) => c.owner !== UI.me && !S.players[c.owner].eliminated).map((c) => `<option value="city:${c.id}" ${f.to === `city:${c.id}` ? 'selected' : ''}>${esc(c.name)} (${esc(pname(c.owner))})</option>`).join('')}</optgroup>`,
  ].join('');
  const toCity = f.to.startsWith('city:') ? Q.cityById(S, Number(f.to.slice(5))) : null;
  const trade = toCity && toCity.owner !== UI.me;
  const transportOpts = myLog.filter((u) => u.carriedBy == null && (u.route == null || u.route === f.id) && `unit:${u.id}` !== f.to).map((u) => `<label class="ck"><input type="checkbox" data-chg="rf-tr" value="${u.id}" ${f.transports.includes(u.id) ? 'checked' : ''}> ${esc(Q.unitName(u))} <span class="small muted">(${UNI[u.type].cargo} cargo, move ${UNI[u.type].move}, at ${tl(u.t)})</span></label>`).join('<br>');
  let preview = '';
  if (f.from != null && f.to) {
    const r = { id: f.id || 0, owner: UI.me, from: f.from, to: { type: f.to.split(':')[0], id: Number(f.to.split(':')[1]) }, partner: trade ? toCity.owner : null, transports: f.transports, rule: f.rule, goods: f.goods, back: f.back };
    const est = Q.routeEstimate(S, r);
    const want = Object.values(f.goods).reduce((a, b) => a + Number(b || 0), 0);
    preview = f.transports.length ? `<p class="${est.ok ? '' : 'warn'}">${est.ok ? `Capacity about <strong class="num">${est.perTurn}</strong> per turn over ${est.len} tiles.` : 'At least one transport has no open path between these points (terrain, rail or borders).'}${f.rule === 'send' && want > est.perTurn && est.ok ? ` <span class="warn">You ask for ${want}/turn, more than the capacity.</span>` : ''}</p>` : '<p class="muted small">Pick transports to see the capacity.</p>';
  }
  const unitRows = Q.unitsOf(S, UI.me).map((u) => {
    const mv = d.moves.find((m) => m.unit === u.id);
    const src = Q.supplySources(S, u).filter((s) => s.ref !== u).map(Q.sourceName);
    const up = Q.upkeepOf(S, u, mv ? mv.path.length - 1 : 0);
    const bad = (u.supply || '').startsWith('Out');
    return `<tr><td>${esc(Q.unitName(u))}</td><td>${tl(Q.posOf(S, u))}</td><td class="small">${esc(fmtGoods(up) || 'none (in base)')}</td><td class="small">${Q.inBase(S, u) ? 'In base' : src.length ? esc(src.join(', ')) : '<span class="warn">Nothing in range</span>'}</td><td class="small ${bad ? 'warn' : ''}">${esc(u.supply || '—')}</td><td class="small">${UNI[u.type].cargo ? esc(fmtGoods(u.cargo) || 'empty') : ''}</td></tr>`;
  }).join('');
  return `<div class="page"><h2>Supply</h2><p class="muted">Routes move goods automatically every turn until changed. Units inside a city's supply range draw upkeep from it; further out they draw from caravans, supply trucks or a stopped train within 2 tiles.</p>
    <h3>Routes</h3><div class="ledger"><table><thead><tr><th class="n">#</th><th>From → to</th><th>Partner</th><th>Transports</th><th>Rule</th><th>Goods</th><th>Priority</th><th class="n">Cap/turn</th><th>Status</th><th></th></tr></thead><tbody>${routeRows}${newOps}${!routeRows && !newOps ? '<tr><td colspan="10" class="muted">No routes yet.</td></tr>' : ''}</tbody></table></div>
    <div class="cols" style="margin-top:16px"><div class="panel"><h3 style="margin-top:0">${f.id ? `Edit route #${f.id}` : 'New route'}</h3>
      <div class="row"><label>From <select data-chg="rf-from" ${f.id ? 'disabled' : ''}>${myCities.map((c) => `<option value="${c.id}" ${c.id === f.from ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label>To <select data-chg="rf-to" ${f.id ? 'disabled' : ''}><option value="">Choose…</option>${toOpts}</select></label></div>
      ${trade ? `<p class="small notice">This is a trade route with ${esc(pname(toCity.owner))}. They must accept it next turn; your transports carry goods both ways.</p>` : ''}
      <h4>Transports</h4><div class="small">${transportOpts || '<span class="muted">No free logistics units. Build caravans at stables, trains or supply trucks at a machinery workshop, or ships at a shipyard.</span>'}</div>
      <h4>Rule</h4><div class="row"><label class="ck"><input type="radio" name="rf-rule" data-chg="rf-rule" value="send" ${f.rule === 'send' ? 'checked' : ''}> Send an amount per turn</label><label class="ck"><input type="radio" name="rf-rule" data-chg="rf-rule" value="stock" ${f.rule === 'stock' ? 'checked' : ''}> Keep the destination stocked at</label></div>
      <h4>Goods sent</h4>${goodsInputs('rf-goods', f.goods)}
      ${trade ? `<h4>Goods you receive back (per turn)</h4>${goodsInputs('rf-back', f.back)}` : ''}
      <div class="row"><label>Priority <select data-chg="rf-prio">${['high', 'normal', 'low'].map((x) => `<option ${f.priority === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label></div>
      ${preview}
      <div class="row"><button class="btn primary" data-act="route-save" ${f.from == null || !f.to ? 'disabled' : ''}>${f.id ? 'Save changes' : 'Add route'}</button>${f.id ? '<button class="btn" data-act="route-new">New route instead</button>' : ''}</div></div>
      <div class="panel"><h3 style="margin-top:0">Load and unload by hand</h3><p class="small muted">Select a logistics unit standing in one of your cities on the Map tab to load or unload goods. Units waiting in a city:</p>
      <ul class="list">${myLog.filter((u) => Q.cityAt(S, u.t) && Q.cityAt(S, u.t).owner === UI.me && u.carriedBy == null).map((u) => `<li><button class="linkbtn" data-act="goto-unit" data-id="${u.id}">${esc(Q.unitName(u))}</button><span class="small">${esc(cityName(Q.cityAt(S, u.t).id))}, ${esc(fmtGoods(u.cargo) || 'empty')}</span></li>`).join('') || '<li class="muted">None</li>'}</ul>
      ${d.cargo.length ? `<h4>Queued transfers</h4><ul class="list">${d.cargo.map((c, i) => `<li>${esc(uname(c.unit))} ${c.amount > 0 ? 'loads' : 'unloads'} ${Math.abs(c.amount)} ${gl(c.good)}<button class="x" data-act="rm" data-list="cargo" data-idx="${i}">✕</button></li>`).join('')}</ul>` : ''}</div></div>
    <h3>Unit supply</h3><p class="small muted">Upkeep includes this turn's planned movement. "Last turn" is what happened at the end of the previous turn.</p>
    <div class="ledger"><table><thead><tr><th>Unit</th><th>Tile</th><th>Upkeep this turn</th><th>Supplied from</th><th>Last turn</th><th>Cargo</th></tr></thead><tbody>${unitRows || '<tr><td colspan="6" class="muted">No units.</td></tr>'}</tbody></table></div></div>`;
};

/* ---------- Stockpiles ---------- */
TAB_RENDER.stock = function () {
  const S = st(), p = meP();
  const cities = Q.citiesOf(S, UI.me);
  const head = `<tr><th>Location</th>${RR.GOODS.map((g) => `<th class="n">${GN(g)}</th>`).join('')}</tr>`;
  const cityRows = cities.map((c) => `<tr><td><button class="linkbtn" data-act="goto" data-t="${c.t}">${esc(c.name)}</button></td>${RR.GOODS.map((g) => { const v = c.stock[g] || 0, cap = Q.capacity(S, c, g); return `<td class="n ${v >= cap ? 'full' : v >= cap * 0.9 ? 'near' : ''}">${v}<span class="muted small">/${cap}</span></td>`; }).join('')}</tr>`).join('');
  const units = Q.unitsOf(S, UI.me).filter((u) => UNI[u.type].cargo);
  const unitRows = units.map((u) => `<tr><td><button class="linkbtn" data-act="goto-unit" data-id="${u.id}">${esc(Q.unitName(u))}</button> <span class="small muted">${tl(Q.posOf(S, u))}, ${Q.cargoUsed(u)}/${UNI[u.type].cargo}</span></td>${RR.GOODS.map((g) => `<td class="n">${u.cargo[g] || ''}</td>`).join('')}</tr>`).join('');
  const tot = {}; for (const c of cities) for (const g of RR.GOODS) tot[g] = (tot[g] || 0) + (c.stock[g] || 0); for (const u of units) for (const g of RR.GOODS) tot[g] = (tot[g] || 0) + (u.cargo[g] || 0);
  return `<div class="page"><h2>Stockpiles</h2><p class="muted">Credits, manpower and science belong to the whole nation. Every other good sits in a city or a logistics unit and only moves by transport. Amounts show stock/capacity.</p>
    <div class="row" style="gap:24px;margin:10px 0 14px"><span>Credits <b class="num" style="font-size:1.3rem">${p.credits}</b></span><span>Manpower <b class="num" style="font-size:1.3rem">${p.manpower}</b></span><span>Science <b class="num" style="font-size:1.3rem">${p.science}</b></span></div>
    <div class="ledger"><table><thead>${head}</thead><tbody>${cityRows ? `<tr class="sub"><td colspan="${RR.GOODS.length + 1}">Cities</td></tr>${cityRows}` : ''}${unitRows ? `<tr class="sub"><td colspan="${RR.GOODS.length + 1}">Logistics units</td></tr>${unitRows}` : ''}
    <tr class="sub"><td>Total</td>${RR.GOODS.map((g) => `<td class="n">${tot[g] || 0}</td>`).join('')}</tr></tbody></table></div></div>`;
};

/* ---------- Buildings ---------- */
TAB_RENDER.buildings = function () {
  const S = st();
  const blocks = Q.citiesOf(S, UI.me).map((c) => {
    const blds = Q.cityBuildings(S, c.id).sort((a, b) => a.key.localeCompare(b.key));
    const rails = S.map.tiles.filter((t) => t.owner === c.id && t.rail != null).length;
    const bridges = S.map.tiles.filter((t) => t.owner === c.id && t.bridge).length;
    const trap = S.map.tiles.findIndex((t) => t.trap === c.id);
    const effect = (b) => {
      const d = BLD[b.key];
      if (d.recipes) { const rc = Q.recipeOf(b), out = Q.buildingOutput(S, b); return `${fmtGoods(rc.in) || 'no inputs'} → ${fmtGoods(out) || [rc.mpOut ? `${rc.mpOut} manpower` : '', rc.sciOut ? `${rc.sciOut} science` : '', rc.creditsOut ? `${rc.creditsOut} credits` : ''].filter(Boolean).join(', ')}`; }
      if (d.storage) return `Stores ${fmtGoods(d.storage)}`;
      if (d.storageAll) return `Stores +${d.storageAll} of every good except food and fuel${d.supplyBonus ? '; +1 supply range' : ''}`;
      if (d.builds) return `Builds ${d.builds.map((k) => UNI[k].name.toLowerCase()).join(', ')}`;
      if (d.dock) return d.dock === 'sail' ? 'Docks sailing ships' : 'Docks all ships';
      if (d.hp) return `+${d.hp} city HP${d.weapon ? ', fires at range 2' : ''}`;
      if (d.territoryBonus) return 'Territory 3 tiles';
      return '';
    };
    return `<div class="ledger"><table><thead><tr><th colspan="4">${esc(c.name)} <span class="muted small">HP ${c.hp}/${Q.maxHp(S, c)}, territory ${Q.territoryRadius(S, c)}, supply range ${Q.supplyRadius(S, c)}</span></th></tr>
      <tr><th>Building</th><th>Where</th><th>Does</th><th>Last turn</th></tr></thead><tbody>
      ${blds.map((b) => `<tr><td>${esc(BLD[b.key].name)}</td><td>${BLD[b.key].place === 'tile' ? `<button class="linkbtn" data-act="goto" data-t="${b.t}">${esc(RR.TILES[S.map.tiles[b.t].type].name)} ${tl(b.t)}</button>` : 'City'}</td><td class="small">${esc(effect(b))}</td><td class="small ${b.status && b.status.startsWith('Idle') ? 'warn' : 'muted'}">${esc(b.status || '')}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No buildings yet.</td></tr>'}
      ${rails || bridges || trap >= 0 ? `<tr class="sub"><td colspan="4">Infrastructure in territory: ${rails} railroad tile${rails === 1 ? '' : 's'}, ${bridges} bridge${bridges === 1 ? '' : 's'}${trap >= 0 ? `, tank trap at ${tl(trap)}` : ''}</td></tr>` : ''}
      </tbody></table></div>`;
  }).join('');
  return `<div class="page"><h2>Buildings</h2>${blocks || '<p class="muted">You have no cities.</p>'}</div>`;
};

/* ---------- Production ---------- */
TAB_RENDER.production = function () {
  const S = st(), p = meP(), st0 = settings();
  const prio = st0.priority || p.priority;
  const products = st0.products || {};
  const halts = st0.halt || {};
  const isHalted = (b) => (halts[b.id] != null ? !!halts[b.id] : !!b.halted);
  const usedKeys = new Set(S.buildings.filter((b) => Q.buildingOwner(S, b) === UI.me && BLD[b.key].recipes).map((b) => b.key));
  const prioList = prio.filter((k) => usedKeys.has(k)).map((k, i, arr) => `<li class="row" style="margin:0;justify-content:space-between"><span><span class="num muted">${i + 1}.</span> ${esc(BLD[k].short || BLD[k].name)}</span><span><button class="btn small" data-act="prio" data-key="${k}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button> <button class="btn small" data-act="prio" data-key="${k}" data-dir="1" ${i === arr.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button></span></li>`).join('');
  const blocks = Q.citiesOf(S, UI.me).map((c) => {
    const lines = Q.cityBuildings(S, c.id).filter((b) => BLD[b.key].recipes).sort((a, b) => prio.indexOf(a.key) - prio.indexOf(b.key));
    const totIn = {}, totOut = {}; let mp = 0, mpOut = 0, cr = 0, crOut = 0, sci = 0;
    const rows = lines.map((b) => {
      const d = BLD[b.key], keys = Object.keys(d.recipes);
      const cur = products[b.id] || Q.recipeKey(b);
      const rc = d.recipes[cur], out = Q.buildingOutput(S, Object.assign({}, b, { product: cur }));
      const off = isHalted(b);
      if (!off) {
        for (const [g, v] of Object.entries(rc.in || {})) totIn[g] = (totIn[g] || 0) + v;
        for (const [g, v] of Object.entries(out)) totOut[g] = (totOut[g] || 0) + v;
        mp += rc.mp || 0; mpOut += rc.mpOut || 0; cr += rc.credits || 0; crOut += rc.creditsOut || 0; sci += rc.sciOut || 0;
      }
      const sel = keys.length > 1 ? `<select data-chg="product" data-id="${b.id}" aria-label="Product">${keys.map((k) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${GN(k) || k}</option>`).join('')}</select>` : '';
      const outs = [fmtGoods(out), rc.mpOut ? `${rc.mpOut} manpower` : '', rc.sciOut ? `${rc.sciOut} science` : '', rc.creditsOut ? `${rc.creditsOut} credits` : ''].filter(Boolean).join(', ');
      const toggle = `<label class="ck small"><input type="checkbox" data-chg="halt" data-id="${b.id}" ${off ? '' : 'checked'}> On</label>`;
      return `<tr class="${off ? 'muted' : ''}"><td>${toggle}</td><td>${esc(d.short || d.name)}${d.place === 'tile' ? ` <span class="small muted">${tl(b.t)}</span>` : ''}</td><td>${sel}</td><td class="small">${esc(fmtGoods(rc.in) || '—')}${rc.credits ? `${rc.in ? ', ' : ''}${rc.credits} credits` : ''}</td><td class="small">${esc(outs)}</td><td class="n">${rc.mp || 0}</td><td class="small ${b.status && b.status.startsWith('Idle') ? 'warn' : 'muted'}">${esc(off ? (b.halted ? 'Halted' : 'Halts this turn') : b.halted ? 'Restarts this turn' : (b.status || 'New'))}</td></tr>`;
    }).join('');
    return `<div class="ledger"><table><thead><tr><th colspan="7">${esc(c.name)}</th></tr><tr><th>Running</th><th>Production line</th><th>Making</th><th>Uses per turn</th><th>Makes per turn</th><th class="n">Manpower</th><th>Last turn</th></tr></thead><tbody>
      ${rows || '<tr><td colspan="7" class="muted">No production buildings yet.</td></tr>'}
      ${rows ? `<tr class="sub"><td colspan="3">If every line that is on runs</td><td class="small">${esc(fmtGoods(totIn) || '—')}${cr ? `, ${cr} credits` : ''}</td><td class="small">${esc([fmtGoods(totOut), mpOut ? `${mpOut} manpower` : '', sci ? `${sci} science` : '', crOut ? `${crOut} credits` : ''].filter(Boolean).join(', '))}</td><td class="n">${mp}</td><td></td></tr>` : ''}</tbody></table></div>`;
  }).join('');
  return `<div class="page"><h2>Production</h2><p class="muted">Untick a line to halt it: it uses no manpower or inputs and makes nothing until you switch it back on.</p><div class="cols" style="grid-template-columns: 1fr 300px">
    <div>${blocks}</div>
    <div class="panel"><h3 style="margin-top:0">Priority</h3><p class="small muted">When manpower or inputs run short, buildings lower on this list stop first. Changes apply when the turn resolves.</p><ol class="list prio">${prioList || '<li class="muted">Build something first.</li>'}</ol></div></div></div>`;
};

/* ---------- Research ---------- */
TAB_RENDER.research = function () {
  const S = st(), p = meP(), d = draft();
  const queuedCost = d.research.reduce((a, k) => a + (BLD[k] ? BLD[k].sci : 0), 0);
  const eras = [1, 2, 3].map((era) => {
    const rows = Object.entries(BLD).filter(([, b]) => b.era === era).sort((a, b) => a[1].sci - b[1].sci).map(([k, b]) => {
      const free = b.sci === 0, res = p.researched.includes(k), bp = p.blueprints.includes(k), q = d.research.includes(k);
      const units = Object.entries(UNI).filter(([, u]) => u.unlock === k).map(([, u]) => u.name).join(', ');
      const status = free ? '<span class="tag">Start</span>' : res ? '<span class="tag ok">Researched</span>' : bp ? '<span class="tag ok">Blueprint</span>' : `<label class="ck"><input type="checkbox" data-chg="research" value="${k}" ${q ? 'checked' : ''}> Research</label>`;
      return `<tr><td>${esc(b.name)}</td><td class="n">${b.sci}</td><td class="small">${esc(units)}</td><td>${status}</td></tr>`;
    }).join('');
    return `<div class="ledger"><table><thead><tr><th colspan="4">Era ${era}: ${RR.ERA_NAMES[era]}</th></tr><tr><th>Building</th><th class="n">Science</th><th>Unlocks units</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  const sellable = p.researched.filter((k) => BLD[k]);
  const others = activePlayers().filter((x) => x.id !== UI.me);
  const offers = d.diplo.filter((o) => o.type === 'propose' && o.kind === 'blueprint');
  return `<div class="page"><h2>Research</h2><p class="muted">Universities turn 6 manpower and 50 credits into 1 science each turn. Research any building in any order; later eras cost more. Science is never lost.</p>
    <div class="row" style="gap:24px"><span>Science available <b class="num" style="font-size:1.3rem">${p.science}</b></span><span>Queued this turn <b class="num ${queuedCost > p.science ? 'warn' : ''}" style="font-size:1.3rem">${queuedCost}</b></span></div>
    <div class="cols" style="margin-top:12px"><div>${eras}</div>
    <div class="panel"><h3 style="margin-top:0">Sell a blueprint</h3><p class="small muted">Only buildings you researched yourself can be sold. The buyer accepts next turn and pays on acceptance.</p>
      ${sellable.length && others.length ? `<div class="row"><select id="bp-key" aria-label="Blueprint">${sellable.map((k) => `<option value="${k}">${esc(BLD[k].name)}</option>`).join('')}</select><select id="bp-to" aria-label="Buyer">${others.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input type="number" id="bp-price" min="0" value="200" aria-label="Price in credits"><button class="btn small" data-act="bp-offer">Offer</button></div>` : '<p class="small muted">Nothing to sell yet.</p>'}
      ${offers.length ? `<ul class="list">${offers.map((o) => `<li>${esc(BLD[o.payload.key].name)} to ${esc(pname(o.to))} for ${o.payload.price}<button class="x" data-act="rm" data-list="diplo" data-idx="${d.diplo.indexOf(o)}">✕</button></li>`).join('')}</ul>` : ''}
      <h4>Bought blueprints</h4><p class="small">${p.blueprints.map((k) => esc(BLD[k].name)).join(', ') || '<span class="muted">None</span>'}</p></div></div></div>`;
};

/* ---------- Market ---------- */
TAB_RENDER.market = function () {
  const S = st(), p = meP(), d = draft();
  const cities = Q.citiesOf(S, UI.me);
  if (!cities.find((c) => c.id === UI.marketCity)) UI.marketCity = cities[0] ? cities[0].id : null;
  const c = Q.cityById(S, UI.marketCity);
  const blocked = false;
  const rows = RR.GOODS.map((g) => {
    const pr = S.market.prices[g] || { sell: RR.BASE_PRICE[g], pays: Math.round(RR.BASE_PRICE[g] * 0.8), pool: 0, world: 0, r: 0 };
    return `<tr><td><i class="swatch" style="background:${RR.GOOD_COLORS[g]}"></i>${GN(g)}</td><td class="n">${RR.BASE_PRICE[g]}</td><td class="n"><strong>${pr.sell}</strong></td><td class="n">${pr.pays}</td><td class="n">${pr.pool}</td><td class="n">${pr.world}</td><td class="n">${Math.round(pr.r * 100)}%</td>
      <td>${c ? `<span class="small muted">${c.stock[g] || 0}</span>` : ''}</td>
      <td><div class="row" style="margin:0;flex-wrap:nowrap"><input type="number" min="1" class="w-sm" id="mk-${g}" value="10" aria-label="${GN(g)} amount"><button class="btn small" data-act="buy" data-good="${g}" ${!c || blocked || !pr.pool ? 'disabled' : ''}>Buy</button><button class="btn small" data-act="sell" data-good="${g}" ${!c || blocked ? 'disabled' : ''}>Sell</button></div></td></tr>`;
  }).join('');
  const lines = [...d.buys.map((o, i) => ['buys', i, `Buy ${o.amount} ${gl(o.good)} for ${cityName(o.city)} (about ${o.amount * (S.market.prices[o.good] || {}).sell} credits)`]), ...d.sells.map((o, i) => ['sells', i, `Sell ${o.amount} ${gl(o.good)} from ${cityName(o.city)} (about ${o.amount * (S.market.prices[o.good] || {}).pays} credits)`])];
  return `<div class="page"><h2>Global market</h2><p class="muted">The market only holds what players sell to it. Its price for a good falls as more of the world's supply sits in the market: price = base ÷ (1 + 4 × share). It pays sellers 80% of its selling price. No transport is needed; goods arrive in the city you choose. Buys fill before sells, and prices hold for the whole turn.</p>
    <div class="row"><label>Deliver to and sell from <select data-chg="mk-city">${cities.map((x) => `<option value="${x.id}" ${x.id === UI.marketCity ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label><span class="small muted">Credits: <b class="num">${p.credits}</b></span></div>
    <div class="ledger"><table><thead><tr><th>Good</th><th class="n">Base</th><th class="n">Market sells at</th><th class="n">Market pays</th><th class="n">In market</th><th class="n">World total</th><th class="n">Share</th><th>In city</th><th>Order</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h3>This turn's market orders</h3><ul class="list">${lines.map(([l, i, t]) => `<li>${esc(t)}<button class="x" data-act="rm" data-list="${l}" data-idx="${i}">✕</button></li>`).join('') || '<li class="muted">None</li>'}</ul></div>`;
};

/* ---------- Diplomacy ---------- */
function peaceDraft(to) {
  if (!UI.peace || UI.peace.to !== to) UI.peace = { to, term: RR.PEACE.minTerm, give: { credits: 0, science: 0, cities: [], tiles: [] }, get: { credits: 0, science: 0, cities: [], tiles: [] } };
  return UI.peace;
}
function peaceBuilder() {
  const S = st(), pd = UI.peace;
  if (!pd || !S.players[pd.to] || S.players[pd.to].eliminated) return '';
  const them = S.players[pd.to], pl = Q.normPeace(pd), err = Q.checkPeace(S, UI.me, pd.to, pl);
  const side = (key, pid) => {
    const part = pd[key], P = S.players[pid], cities = Q.citiesOf(S, pid);
    return `<div><h4>${pid === UI.me ? 'You give' : `${esc(P.name)} gives`}</h4>

      <div class="small">${cities.map((c) => `<label class="ck"><input type="checkbox" data-chg="pc-city" data-side="${key}" value="${c.id}" ${part.cities.includes(c.id) ? 'checked' : ''}> ${esc(c.name)}</label>`).join('<br>') || '<span class="muted">No cities</span>'}</div>

  };
