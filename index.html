    <div class="row"><label>Term <select data-chg="pc-term">${Array.from({ length: RR.PEACE.maxTerm - RR.PEACE.minTerm + 1 }, (_, i) => i + RR.PEACE.minTerm).map((n) => `<option value="${n}" ${n === pl.term ? 'selected' : ''}>${n} turns</option>`).join('')}</select></label></div>
    <div class="cols" style="grid-template-columns:1fr 1fr;gap:12px">${side('give', UI.me)}${side('get', pd.to)}</div>
    <p class="small muted">Ceded cities keep their stockpiles and all their territory. Ceded tiles bring their buildings, joining the new owner's nearest city.</p>
    <div class="row"><button class="btn" data-act="pc-pick">Pick tiles on the map</button><button class="btn primary" data-act="pc-send" ${err ? 'disabled' : ''}>Propose treaty</button><button class="btn" data-act="pc-close">Cancel</button></div>
    ${err ? `<p class="small warn">${esc(err[0].toUpperCase() + err.slice(1))}.</p>` : ''}</div>`;
}
TAB_RENDER.diplomacy = function () {
  const S = st(), p = meP(), d = draft();
  const others = S.players.filter((x) => x.id !== UI.me);
  const queued = (pred) => d.diplo.some(pred);
  const pact = (x) => S.treaties.find((t) => t.type === 'peace' && ((t.a === UI.me && t.b === x.id) || (t.b === UI.me && t.a === x.id)));
  const rel = (x) => {
    if (x.eliminated) return '<span class="tag">Out of the game</span>';
    if (Q.atWar(S, UI.me, x.id)) return '<span class="tag war">At war</span>';
    const pc = pact(x);
    if (pc) return `<span class="tag ok">Peace treaty</span><div class="small muted">no war before turn ${pc.endsTurn}</div>`;
    return '<span class="tag ok">At peace</span>';
  };
  const rows = others.map((x) => {
    if (x.eliminated) return `<tr><td>${playerLabel(x.id)}</td><td>${rel(x)}</td><td colspan="3"></td></tr>`;
    const war = Q.atWar(S, UI.me, x.id);
    const tr = S.treaties.filter((t) => t.type !== 'peace' && ((t.a === UI.me && t.b === x.id) || (t.b === UI.me && t.a === x.id)));
    const acts = [];
    acts.push(queued((o) => o.type === 'propose' && o.kind === 'peace' && o.to === x.id) ? '<span class="tag brass">Peace offered</span>' : `<button class="btn small" data-act="pc-open" data-to="${x.id}">${war ? 'Propose peace…' : 'Offer peace treaty…'}</button>`);
    if (!war && !pact(x)) acts.push(queued((o) => o.type === 'declare' && o.to === x.id) ? '<span class="tag war">War declared this turn</span>' : `<button class="btn small danger" data-act="declare" data-to="${x.id}">Declare war</button>`);
    if (!war) for (const type of ['transit', 'port', 'rail']) if (!tr.some((t) => t.type === type) && !queued((o) => o.type === 'propose' && o.kind === 'treaty' && o.to === x.id && o.payload.type === type)) acts.push(`<button class="btn small" data-act="treaty" data-to="${x.id}" data-type="${type}">Offer ${type} rights</button>`);
    acts.push(`<span class="row" style="margin:0"><input type="number" min="1" class="w-sm" id="cr-${x.id}" placeholder="0" aria-label="Credits to send"><button class="btn small" data-act="credits" data-to="${x.id}">Send credits</button></span>`);
    return `<tr><td>${playerLabel(x.id)}</td><td>${rel(x)}</td>
      <td class="small">${tr.map((t) => `${t.type} rights${t.endsTurn ? ` (ends turn ${t.endsTurn})` : ` <button class="linkbtn" data-act="cancel-treaty" data-id="${t.id}">cancel</button>`}`).join('<br>') || '<span class="muted">None</span>'}</td>
      <td class="small">${citiesOf(x.id).length} cit${citiesOf(x.id).length === 1 ? 'y' : 'ies'}, ${Q.unitsOf(S, x.id).length} units</td><td><div class="row" style="margin:0">${acts.join(' ')}</div></td></tr>`;
  }).join('');
  const incoming = S.proposals.filter((pr) => pr.to === UI.me && pr.turn === S.turn).map((pr) => {
    const ans = d.diplo.find((o) => o.type === 'respond' && o.id === pr.id);
    return `<li><span>${playerLabel(pr.from)} offers ${esc(Q.describeProposal(S, pr))}${pr.kind === 'route' ? `: ${esc(pr.payload.from)} → ${esc(pr.payload.to)} (${esc((() => { const r = S.routes.find((x) => x.id === pr.payload.route); return r ? `you get ${fmtGoods(r.goods)}, you send ${fmtGoods(r.back) || 'nothing'}` : ''; })())})` : ''}</span>
      <span><label class="ck"><input type="radio" name="pr-${pr.id}" data-chg="respond" data-id="${pr.id}" value="1" ${ans && ans.accept ? 'checked' : ''}> Accept</label> <label class="ck"><input type="radio" name="pr-${pr.id}" data-chg="respond" data-id="${pr.id}" value="0" ${ans && !ans.accept ? 'checked' : ''}> Reject</label></span></li>`;
  }).join('');
  const outgoing = S.proposals.filter((pr) => pr.from === UI.me).map((pr) => `<li>${esc(Q.describeProposal(S, pr))} to ${esc(pname(pr.to))}<span class="small muted">answer due turn ${pr.turn}</span></li>`).join('');
  const alive = S.players.filter((x) => !x.eliminated);
  return `<div class="page"><h2>Diplomacy</h2><p class="muted">Peace treaties, rights treaties and trade routes are enforced by the game. Alliances, promises and informal arrangements are just words. Proposals reach the other nation next turn.</p>
    ${peaceBuilder()}
    <div class="ledger" style="margin-top:14px"><table><thead><tr><th>Nation</th><th>Status</th><th>Rights treaties</th><th>Size</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="cols" style="margin-top:16px">
      <div class="panel"><h3 style="margin-top:0">Answer this turn</h3><ul class="list">${incoming || '<li class="muted">Nothing to answer.</li>'}</ul><h4>Waiting on others</h4><ul class="list">${outgoing || '<li class="muted">None</li>'}</ul></div>
      <div class="panel"><h3 style="margin-top:0">Wars and treaties</h3><ul class="list">${S.wars.map((w) => `<li>${playerLabel(w.a)} vs ${playerLabel(w.b)}<span class="small muted">since turn ${w.since}</span></li>`).join('') || '<li class="muted">No wars.</li>'}
        ${S.treaties.filter((t) => t.type === 'peace').map((t) => `<li>${playerLabel(t.a)} and ${playerLabel(t.b)}<span class="small muted">peace, no war before turn ${t.endsTurn}</span></li>`).join('')}</ul>
        <h4>End the game</h4><p class="small">The game ends when one nation is left, or when every remaining nation (${alive.map((x) => esc(x.name)).join(', ')}) votes to end it in the same turn while none are at war.</p>
        ${!p.eliminated ? `<label class="ck"><input type="checkbox" data-chg="endvote" ${queued((o) => o.type === 'endVote') ? 'checked' : ''}> Vote to end the game this turn</label>` : ''}</div>
    </div></div>`;
};
const citiesOf = (pid) => Q.citiesOf(st(), pid);

/* ---------- Reports ---------- */
const REPORT_CATS = { all: 'Everything', conflict: 'Order conflicts', supply: 'Supply', shortfall: 'Production shortfalls', combat: 'Combat', movement: 'Movement', logistics: 'Logistics', market: 'Market', construction: 'Construction', recruitment: 'Recruitment', research: 'Research', diplomacy: 'Diplomacy', game: 'Game' };
TAB_RENDER.reports = function () {
  const S = st();
  const list = (S.reports[UI.me] || []).filter((r) => UI.reportCat === 'all' || r.cat === UI.reportCat);
  const turns = [...new Set(list.map((r) => r.turn))].sort((a, b) => b - a);
  return `<div class="page reports"><h2>Reports</h2><p class="muted">What happened when each turn resolved: order conflicts, units out of supply, idle buildings and everything else. The last 40 turns are kept.</p>
    <div class="row"><label>Show <select data-chg="repcat">${Object.entries(REPORT_CATS).map(([k, v]) => `<option value="${k}" ${UI.reportCat === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
    ${turns.map((t) => `<div class="turnhead">${t === 0 ? 'Game start' : `Turn ${t}`}</div><ul class="list">${list.filter((r) => r.turn === t).map((r) => `<li><span class="cat ${r.cat}">${esc(REPORT_CATS[r.cat] || r.cat)}</span><span>${esc(r.msg)}</span></li>`).join('')}</ul>`).join('') || '<p class="muted">No reports yet. They appear after the first turn resolves.</p>'}</div>`;
};

/* ---------- Orders ---------- */
function orderGroups() {
  const S = st(), d = draft();
  const G = [];
  const add = (phase, list, i, text) => { let g = G.find((x) => x.phase === phase); if (!g) { g = { phase, items: [] }; G.push(g); } g.items.push({ list, i, text }); };
  d.diplo.forEach((o, i) => {
    const t = o.type === 'declare' ? `Declare war on ${pname(o.to)}`
      : o.type === 'propose' ? `Propose ${o.kind === 'treaty' ? `${o.payload.type} rights` : o.kind === 'blueprint' ? `selling ${BLD[o.payload.key].name} for ${o.payload.price}` : Q.describeProposal(S, { kind: 'peace', from: UI.me, to: o.to, payload: o.payload })} to ${pname(o.to)}`
        : o.type === 'respond' ? `${o.accept ? 'Accept' : 'Reject'} ${Q.describeProposal(S, S.proposals.find((p) => p.id === o.id) || { kind: '?' })}`
          : o.type === 'credits' ? `Send ${o.amount} credits to ${pname(o.to)}`
            : o.type === 'cancelTreaty' ? 'Cancel a treaty'
              : o.type === 'endVote' ? 'Vote to end the game' : o.type;
    add('Diplomacy', 'diplo', i, t);
  });
  d.attacks.forEach((o, i) => add('Combat', 'attacks', i, o.unit != null ? `${uname(o.unit)} attacks ${tl(o.t)}` : `${cityName(o.city)} ${BLD[o.w].name.toLowerCase()} fires at ${tl(o.t)}`));
  d.board.forEach((o, i) => add('Movement', 'board', i, `${uname(o.unit)} boards ${uname(o.transport)}`));
  d.moves.forEach((o, i) => add('Movement', 'moves', i, `${uname(o.unit)} moves to ${tl(o.path[o.path.length - 1])} (${o.path.length - 1} tiles)`));
  d.unload.forEach((o, i) => add('Movement', 'unload', i, `${uname(o.unit)} unloads at ${tl(o.t)}`));
  d.buys.forEach((o, i) => add('Market buys', 'buys', i, `Buy ${o.amount} ${gl(o.good)} for ${cityName(o.city)}`));
  d.sells.forEach((o, i) => add('Market sells', 'sells', i, `Sell ${o.amount} ${gl(o.good)} from ${cityName(o.city)}`));
  d.research.forEach((k, i) => add('Research', 'research', i, `Research ${BLD[k].name} (${BLD[k].sci} science)`));
  d.clear.forEach((o, i) => add('Buildings', 'clear', i, `Clear the forest at ${tl(o.t)} (+${RR.CLEAR_FOREST.lumber} lumber)`));
  d.demolish.forEach((o, i) => add('Buildings', 'demolish', i, `Demolish ${o.what === 'building' ? (Q.tileBuilding(S, o.t) ? BLD[Q.tileBuilding(S, o.t).key].name.toLowerCase() : 'building') : o.what === 'trap' ? 'tank trap' : o.what === 'rail' ? 'railroad' : 'bridge'} at ${tl(o.t)}`));
  d.found.forEach((o, i) => add('Buildings', 'found', i, `Found ${o.name} with ${uname(o.unit)}`));
  d.builds.forEach((o, i) => add('Buildings', 'builds', i, `Build ${BLD[o.key].name} for ${cityName(o.city)}${o.t != null ? ` at ${tl(o.t)}` : ''}`));
  d.trains.forEach((o, i) => add('Units', 'trains', i, `Build ${UNI[o.type].name} in ${cityName(o.city)}`));
  if (d.settings && (d.settings.priority || (d.settings.products && Object.keys(d.settings.products).length) || (d.settings.halt && Object.keys(d.settings.halt).length))) add('Production', 'settings', 0, 'Production priority, products or on/off switches changed');
  d.cargo.forEach((o, i) => add('Logistics', 'cargo', i, `${uname(o.unit)} ${o.amount > 0 ? 'loads' : 'unloads'} ${Math.abs(o.amount)} ${gl(o.good)}`));
  d.routeOps.forEach((o, i) => add('Logistics', 'routeOps', i, o.op === 'remove' ? `Close route #${o.id}` : o.op === 'update' ? `Change route #${o.id}` : `New route ${cityName(o.from)} → ${o.to.type === 'city' ? cityName(o.to.id) : uname(o.to.id)}`));
  const order = ['Diplomacy', 'Combat', 'Movement', 'Market buys', 'Market sells', 'Research', 'Production', 'Buildings', 'Units', 'Logistics'];
  return G.sort((a, b) => order.indexOf(a.phase) - order.indexOf(b.phase));
}
TAB_RENDER.orders = function () {
  const S = st(), groups = orderGroups();
  const status = activePlayers().map((x) => `<li><span>${playerLabel(x.id)}</span><span class="${submitted(x.id) ? 'good' : 'muted'}">${submitted(x.id) ? `Submitted ${new Date(UI.bundle.pending[x.id].at).toLocaleString()}` : 'Not yet'}</span></li>`).join('');
  return `<div class="page"><h2>Orders for turn ${S.turn}</h2><p class="muted">Orders resolve in this order: diplomacy, combat, movement, market buys, market sells, research, production, buildings, units, then logistics (routes, supply and repairs). Attacks use positions from the start of the turn.</p>
    <div class="cols"><div class="panel">${groups.map((g) => `<h4>${g.phase}</h4><ul class="list">${g.items.map((it) => `<li>${esc(it.text)}<button class="x" data-act="rm" data-list="${it.list}" data-idx="${it.i}" aria-label="Remove order">✕</button></li>`).join('')}</ul>`).join('') || '<p class="muted">No orders yet. Standing routes and production keep running anyway.</p>'}
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="submit">${submitted(UI.me) ? 'Resubmit orders' : 'Submit orders'}</button><button class="btn danger" data-act="clear-all">Clear all orders</button></div></div>
    <div class="panel"><h3 style="margin-top:0">Who has submitted</h3><ul class="list">${status}</ul>
      <p class="small muted" style="margin-top:8px">${Sync.mode === 'file' ? 'Submitting downloads your orders file. Send it to the host, who imports everyone\'s files from the Game menu and resolves the turn.' : Sync.mode === 'server' ? 'Orders go to the server. Anyone can resolve once everyone has submitted.' : 'Pass-and-play: everyone uses this browser. Switch "Playing as", submit, then resolve when all are in.'}</p></div></div></div>`;
};

/* =====================================================================
   ACTIONS
   ===================================================================== */
function routeFormFrom(r) { return { id: r.id, from: r.from, to: `${r.to.type}:${r.to.id}`, transports: r.transports.slice(), rule: r.rule, goods: clone(r.goods), back: clone(r.back || {}), priority: r.priority }; }
const ACT = {
  tab(el) { UI.tab = el.dataset.tab; UI.mode = null; UI.menu = false; render(); },
  menu() { UI.menu = !UI.menu; render(); },
  zoom(el) { zoomBy('main', Number(el.dataset.k)); },
  'zoom-flow'(el) { zoomBy('flow', Number(el.dataset.k)); },
  fit(el) { fitView(el.dataset.kind); render(); },
  legend() { UI.legend = !UI.legend; render(); },
  goto(el) { const t = Number(el.dataset.t); UI.tab = 'map'; UI.sel = { t, unit: null }; centerOn('main', t); render(); },
  'goto-unit'(el) { const u = Q.unitById(st(), Number(el.dataset.id)); if (!u) return; const t = Q.posOf(st(), u); UI.tab = 'map'; UI.sel = { t, unit: u.id }; centerOn('main', t); render(); },
  'sel-unit'(el) { UI.sel.unit = Number(el.dataset.id); render(); },
  clear(el) { const id = Number(el.dataset.unit), list = el.dataset.list; mutate((d) => { d[list] = d[list].filter((o) => o.unit !== id); }); },
  rm(el) {
    const list = el.dataset.list, i = Number(el.dataset.idx);
    mutate((d) => { if (list === 'settings') d.settings = null; else d[list].splice(i, 1); });
  },
  'rm-op'(el) { mutate((d) => d.routeOps.splice(Number(el.dataset.idx), 1)); },
  'clear-all'() { if (confirm('Clear every order for this turn?')) { UI._d = Engine.normalizeOrders({}); saveDraft(); render(); } },
  'build-city'(el) { mutate((d) => d.builds.push({ city: Number(el.dataset.city), key: el.dataset.key })); toast(`${BLD[el.dataset.key].name} queued`); },
  'mode-build'(el) { UI.mode = { kind: 'build', city: Number(el.dataset.city), key: el.dataset.key }; computeHL(); if (!UI.hl.build.size) { UI.mode = null; toast(`No valid tile for ${BLD[el.dataset.key].name.toLowerCase()} right now.`); } render(); },
  'mode-weapon'(el) { UI.mode = { kind: 'weapon', city: Number(el.dataset.city), w: el.dataset.w }; computeHL(); if (!UI.hl.attack.size) { UI.mode = null; toast('No enemy in range.'); } render(); },
  'mode-unload'(el) { UI.mode = { kind: 'unload', unit: Number(el.dataset.unit) }; render(); },
  'cancel-mode'() { const back = UI.mode && UI.mode.kind === 'cede'; UI.mode = null; if (back) UI.tab = 'diplomacy'; render(); },
  train(el) { mutate((d) => d.trains.push({ city: Number(el.dataset.city), type: el.dataset.type })); toast(`${UNI[el.dataset.type].name} queued`); },
  board(el) { const unit = Number(el.dataset.unit), transport = Number(el.dataset.tr); mutate((d) => { d.board = d.board.filter((b) => b.unit !== unit); d.moves = d.moves.filter((m) => m.unit !== unit); d.board.push({ unit, transport }); }); },
  found(el) { const name = ($('#found-name') || {}).value || ''; const unit = Number(el.dataset.unit); mutate((d) => { d.found = d.found.filter((f) => f.unit !== unit); d.found.push({ unit, name: name.trim() || 'New city' }); }); },
  cargo(el) { const good = $('#cg-good').value, amt = Math.abs(Math.floor(Number($('#cg-amt').value) || 0)) * Number(el.dataset.dir); if (!amt) return; mutate((d) => d.cargo.push({ unit: Number(el.dataset.unit), city: Number(el.dataset.city), good, amount: amt })); },
  // supply
  'route-edit'(el) { const r = st().routes.find((x) => x.id === Number(el.dataset.id)); if (r) UI.routeEdit = routeFormFrom(r); render(); },
  'route-new'() { UI.routeEdit = newRouteForm(); render(); },
  'route-remove'(el) { const id = Number(el.dataset.id); mutate((d) => { d.routeOps = d.routeOps.filter((o) => o.id !== id); d.routeOps.push({ op: 'remove', id }); }); },
  'route-save'() {
    const f = UI.routeEdit; const [type, id] = f.to.split(':');
    const op = { op: f.id ? 'update' : 'create', id: f.id || undefined, from: f.from, to: { type, id: Number(id) }, transports: f.transports, rule: f.rule, goods: f.goods, back: f.back, priority: f.priority };
    mutate((d) => { if (f.id) d.routeOps = d.routeOps.filter((o) => o.id !== f.id); d.routeOps.push(op); });
    toast(f.id ? `Route #${f.id} changes queued` : 'New route queued');
    UI.routeEdit = newRouteForm(); render();
  },
  // production
  prio(el) {
    const p = meP(), s = settings(); const list = (s.priority || p.priority).slice(); const k = el.dataset.key, dir = Number(el.dataset.dir);
    const used = new Set(st().buildings.filter((b) => Q.buildingOwner(st(), b) === UI.me && BLD[b.key].recipes).map((b) => b.key));
    const vis = list.filter((x) => used.has(x)); const i = vis.indexOf(k), j = i + dir; if (j < 0 || j >= vis.length) return;
    const a = list.indexOf(vis[i]), b = list.indexOf(vis[j]); [list[a], list[b]] = [list[b], list[a]];
    s.priority = list; saveDraft(); render();
  },
  // research & diplomacy
  'bp-offer'() { const key = $('#bp-key').value, to = Number($('#bp-to').value), price = Math.max(0, Math.floor(Number($('#bp-price').value) || 0)); mutate((d) => d.diplo.push({ type: 'propose', kind: 'blueprint', to, payload: { key, price } })); },
  buy(el) { const g = el.dataset.good, amount = Math.floor(Number($(`#mk-${g}`).value) || 0); if (amount > 0) mutate((d) => d.buys.push({ good: g, amount, city: UI.marketCity })); },
  sell(el) { const g = el.dataset.good, amount = Math.floor(Number($(`#mk-${g}`).value) || 0); if (amount > 0) mutate((d) => d.sells.push({ good: g, amount, city: UI.marketCity })); },
  declare(el) { const to = Number(el.dataset.to); if (confirm(`Declare war on ${pname(to)}? It takes effect at the start of this turn's resolution.`)) mutate((d) => d.diplo.push({ type: 'declare', to })); },
  'pc-open'(el) { peaceDraft(Number(el.dataset.to)); render(); const pb = $('#peace-builder'); if (pb) pb.scrollIntoView({ block: 'nearest' }); },
  'pc-close'() { UI.peace = null; render(); },
  'pc-pick'() { UI.mode = { kind: 'cede' }; UI.tab = 'map'; UI.sel = null; render(); },
  'pc-send'() {
    const pd = UI.peace; const payload = Q.normPeace(pd);
    mutate((d) => { d.diplo = d.diplo.filter((o) => !(o.type === 'propose' && o.kind === 'peace' && o.to === pd.to)); d.diplo.push({ type: 'propose', kind: 'peace', to: pd.to, payload }); });
    UI.peace = null; toast('Peace treaty queued'); render();
  },
  'clear-forest'(el) { const t = Number(el.dataset.t); mutate((d) => { if (!d.clear.some((x) => x.t === t)) d.clear.push({ t }); }); },
  demolish(el) { const t = Number(el.dataset.t), what = el.dataset.what; mutate((d) => { d.demolish = d.demolish.filter((x) => !(x.t === t && x.what === what)); d.demolish.push({ t, what }); }); },
  treaty(el) { mutate((d) => d.diplo.push({ type: 'propose', kind: 'treaty', to: Number(el.dataset.to), payload: { type: el.dataset.type } })); },
  credits(el) { const to = Number(el.dataset.to), amount = Math.floor(Number($(`#cr-${to}`).value) || 0); if (amount > 0) mutate((d) => d.diplo.push({ type: 'credits', to, amount })); },
  'cancel-treaty'(el) { mutate((d) => d.diplo.push({ type: 'cancelTreaty', id: Number(el.dataset.id) })); },
  // turn flow
  async submit() {
    try {
      const orders = clone(draft());
      UI.bundle = await Sync.submit(UI.bundle, UI.me, orders);
      if (!UI.bundle.pending) UI.bundle.pending = {};
      toast(Sync.mode === 'file' ? 'Orders file downloaded. Send it to the host.' : 'Orders submitted');
      if (Sync.mode === 'local' && allSubmitted()) toast('Everyone has submitted. Resolve the turn when ready.');
      render();
    } catch (e) { toast(`Could not submit: ${e.message}`); }
  },
  async resolve() {
    if (!allSubmitted()) {
      const missing = activePlayers().filter((x) => !submitted(x.id)).map((x) => x.name).join(', ');
      if (!confirm(`Still waiting on ${missing}. Resolve anyway? Their standing routes and production still run, but they give no new orders.`)) return;
    }
    try {
      if (Sync.mode === 'server') UI.bundle = (await Sync.load()) || UI.bundle;
      const S = st(), orders = {};
      for (const p of S.players) { const pe = UI.bundle.pending[p.id]; if (pe && pe.turn === S.turn) orders[p.id] = pe.orders; }
      const NS = Engine.resolveTurn(S, orders);
      UI.bundle = { state: NS, pending: {} };
      await Sync.publish(UI.bundle);
      for (const p of S.players) try { localStorage.removeItem(`supplylines.draft.${S.id}.${S.turn}.${p.id}`); } catch (e) { /* ignore */ }
      UI._d = null; UI.sel = null; UI.mode = null; UI.tab = 'reports'; UI.routeEdit = null;
      toast(`Turn ${S.turn} resolved${Sync.mode === 'file' ? '. state.json downloaded; commit it to the repo.' : ''}`);
      render();
    } catch (e) { console.error(e); toast(`Could not resolve: ${e.message}`); }
  },
  'save-file'() { UI.menu = false; download(`${st().name.replace(/\W+/g, '-')}-turn${st().turn}.json`, UI.bundle); render(); },
  async 'load-file'() {
    UI.menu = false;
    const [b] = await pickFiles(false); if (!b) return render();
    const bundle = b.state ? b : { state: b, pending: {} };
    if (bundle.state) Engine.migrate(bundle.state);
    if (!bundle.state.map || !bundle.state.players) { toast('That file is not a Guns, Pacts, and Commerce game.'); return render(); }
    UI.bundle = Object.assign({ pending: {} }, bundle); UI._d = null; UI.views = {}; UI.sel = null;
    await Sync.publish(UI.bundle).catch(() => {});
    toast('Game loaded'); render();
  },
  'export-orders'() { UI.menu = false; download(`orders-p${UI.me + 1}-turn${st().turn}.json`, { player: UI.me, turn: st().turn, orders: draft() }); render(); },
  async 'import-orders'() {
    UI.menu = false;
    const files = await pickFiles(true); let n = 0;
    for (const f of files) {
      if (f.player == null || !f.orders) continue;
      if (f.turn !== st().turn) { toast(`Skipped orders for turn ${f.turn}; this is turn ${st().turn}.`); continue; }
      UI.bundle.pending[f.player] = { orders: f.orders, turn: f.turn, at: Date.now() }; n++;
    }
    if (Sync.mode === 'local') await Sync.publish(UI.bundle);
    toast(`Imported ${n} orders file${n === 1 ? '' : 's'}`); render();
  },
  async reload() { UI.menu = false; try { const b = await Sync.load(); if (b) { UI.bundle = b; Engine.migrate(b.state); UI.bundle.pending = UI.bundle.pending || {}; UI._d = null; } toast('Reloaded'); } catch (e) { toast(e.message); } render(); },
  'new-game'() { UI.menu = false; if (confirm('Start a new game? Download the current game first if you want to keep it.')) { UI.bundle = null; renderSetup(); } else render(); },
};
const CHG = {
  me(el) { UI.me = Number(el.value); UI._d = null; UI.sel = null; UI.mode = null; UI.routeEdit = null; UI.views = {}; render(); },
  'rf-from'(el) { UI.routeEdit.from = Number(el.value); render(); },
  'rf-to'(el) { UI.routeEdit.to = el.value; UI.routeEdit.transports = UI.routeEdit.transports.filter((id) => `unit:${id}` !== el.value); render(); },
  'rf-tr'(el) { const id = Number(el.value), f = UI.routeEdit; f.transports = el.checked ? [...new Set([...f.transports, id])] : f.transports.filter((x) => x !== id); render(); },
  'rf-rule'(el) { UI.routeEdit.rule = el.value; render(); },
  'rf-goods'(el) { const v = Math.floor(Number(el.value) || 0); if (v > 0) UI.routeEdit.goods[el.dataset.good] = v; else delete UI.routeEdit.goods[el.dataset.good]; render(); },
  'rf-back'(el) { const v = Math.floor(Number(el.value) || 0); if (v > 0) UI.routeEdit.back[el.dataset.good] = v; else delete UI.routeEdit.back[el.dataset.good]; render(); },
  'rf-prio'(el) { UI.routeEdit.priority = el.value; render(); },
  halt(el) { const s = settings(); s.halt = s.halt || {}; const b = st().buildings.find((x) => x.id === Number(el.dataset.id)); const want = !el.checked; if (b && !!b.halted === want) delete s.halt[el.dataset.id]; else s.halt[el.dataset.id] = want; saveDraft(); render(); },
  product(el) { const s = settings(); s.products = s.products || {}; s.products[el.dataset.id] = el.value; saveDraft(); render(); },
  research(el) { mutate((d) => { d.research = d.research.filter((k) => k !== el.value); if (el.checked) d.research.push(el.value); }); },
  'mk-city'(el) { UI.marketCity = Number(el.value); render(); },
  respond(el) { const id = Number(el.dataset.id); mutate((d) => { d.diplo = d.diplo.filter((o) => !(o.type === 'respond' && o.id === id)); d.diplo.push({ type: 'respond', id, accept: el.value === '1' }); }); },
  endvote(el) { mutate((d) => { d.diplo = d.diplo.filter((o) => o.type !== 'endVote'); if (el.checked) d.diplo.push({ type: 'endVote' }); }); },

  repcat(el) { UI.reportCat = el.value; render(); },
  'pc-term'(el) { UI.peace.term = Number(el.value); render(); },
  'pc-num'(el) { UI.peace[el.dataset.side][el.dataset.f] = Math.max(0, Math.floor(Number(el.value) || 0)); render(); },
  'pc-city'(el) { const part = UI.peace[el.dataset.side], id = Number(el.value); part.cities = el.checked ? [...new Set([...part.cities, id])] : part.cities.filter((x) => x !== id); render(); },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (UI.menu && !e.target.closest('.menu')) { UI.menu = false; render(); } return; }
  const fn = ACT[el.dataset.act] || SETUP_ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-chg]');
  if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (UI.mode) { UI.mode = null; render(); } else if (UI.menu) { UI.menu = false; render(); } else if (UI.sel) { UI.sel = null; render(); } }
});

/* =====================================================================
   SETUP
   ===================================================================== */
const SETUP = { n: 4, names: [], colors: [], mapType: RR.MAP.type, tpp: RR.MAP.tilesPerPlayer, start: null };
const startDefaults = () => ({ stock: Object.assign({}, RR.START.stock), credits: RR.START.credits, manpower: RR.START.manpower });
function renderSetup() {
  const st0 = SETUP.start || startDefaults();
  const rows = Array.from({ length: SETUP.n }, (_, i) => `<div class="prow"><span class="num muted">${i + 1}</span><input type="text" id="sp-name-${i}" value="${esc(SETUP.names[i] || `Player ${i + 1}`)}" aria-label="Player ${i + 1} name"><input type="text" id="sp-city-${i}" value="${esc(SETUP.names[`c${i}`] || '')}" placeholder="Capital name (optional)" aria-label="Player ${i + 1} capital"><input type="color" id="sp-col-${i}" value="${SETUP.colors[i] || RR.PLAYER_COLORS[i]}" aria-label="Player ${i + 1} color"></div>`).join('');
  $('#app').innerHTML = `<div class="setup"><h1>${esc(CONFIG.title)}</h1><p class="lede">A game of diplomacy, trade and supply lines for 4 to 10 nations, one turn a day.</p>
    ${Sync.mode === 'file' && UI.loadError ? `<div class="notice bad">Could not load ${esc(CONFIG.STATE_URL)}: ${esc(UI.loadError)}. The host can create the game here and commit the downloaded state.json.</div>` : ''}
    <div class="row"><label>Game name <input type="text" id="sp-game" value="${esc(SETUP.game || CONFIG.title)}"></label>
    <label>Players <select id="sp-n" data-act="noop">${[4, 5, 6, 7, 8, 9, 10].map((n) => `<option ${n === SETUP.n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label>Map seed <input type="text" id="sp-seed" value="${esc(SETUP.seed || '')}" placeholder="random" style="width:110px"></label></div>
    <div class="row"><label>Map type <select id="sp-type">${Object.entries(RR.MAP.types).map(([k, v]) => `<option value="${k}" ${k === SETUP.mapType ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
    <label>Tiles per player <select id="sp-tpp">${RR.MAP.sizes.map((n) => `<option ${n === SETUP.tpp ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
    <div class="players">${rows}</div>
    <p class="small muted">The map is about ${SETUP.n * SETUP.tpp} hexes (${SETUP.tpp} per player). Every nation starts with one city and the resources below.</p>
    <fieldset class="startres"><legend>Starting resources for every nation</legend><div class="row">
      ${Object.keys(RR.START.stock).map((g) => `<label>${esc(gl(g)[0].toUpperCase() + gl(g).slice(1))} <input type="number" min="0" max="${RR.CITY.baseStorage}" step="1" id="sp-st-${g}" value="${st0.stock[g]}" style="width:70px"></label>`).join('')}
      <label>Manpower <input type="number" min="0" step="1" id="sp-st-manpower" value="${st0.manpower}" style="width:70px"></label>
      <label>Credits <input type="number" min="0" step="50" id="sp-st-credits" value="${st0.credits}" style="width:90px"></label>
      <button class="btn small" data-act="start-reset">Recommended</button></div>
      <p class="small muted">Recommended: ${Object.entries(RR.START.stock).map(([g, v]) => `${v} ${gl(g)}`).join(', ')}, ${RR.START.manpower} manpower and ${RR.START.credits.toLocaleString('en-US')} credits. Goods are capped at the starting city's storage of ${RR.CITY.baseStorage} each.</p></fieldset>
    <div class="row"><button class="btn primary" data-act="create">Create game</button><button class="btn" data-act="load-file">Load a game file</button></div></div>`;
  const sel = $('#sp-n');
  sel.onchange = () => { captureSetup(); SETUP.n = Number(sel.value); renderSetup(); };
  $('#sp-tpp').onchange = () => { captureSetup(); renderSetup(); };
}
function captureSetup() {
  for (let i = 0; i < SETUP.n; i++) { const n = $(`#sp-name-${i}`), c = $(`#sp-col-${i}`), cap = $(`#sp-city-${i}`); if (n) SETUP.names[i] = n.value; if (c) SETUP.colors[i] = c.value; if (cap) SETUP.names[`c${i}`] = cap.value; }
  if ($('#sp-game')) SETUP.game = $('#sp-game').value; if ($('#sp-seed')) SETUP.seed = $('#sp-seed').value;
  if ($('#sp-type')) SETUP.mapType = $('#sp-type').value; if ($('#sp-tpp')) SETUP.tpp = Number($('#sp-tpp').value);
  if ($('#sp-st-credits')) {
    const d = startDefaults(), num = (id, def, max) => { const v = Math.floor(Number($(id).value)); return Number.isFinite(v) && $(id).value !== '' ? Math.max(0, Math.min(max, v)) : def; };
    SETUP.start = { stock: {}, credits: num('#sp-st-credits', d.credits, 1e9), manpower: num('#sp-st-manpower', d.manpower, 1e6) };
    for (const g of Object.keys(d.stock)) SETUP.start.stock[g] = num(`#sp-st-${g}`, d.stock[g], RR.CITY.baseStorage);
  }
}
const SETUP_ACT = {
  noop() {},
  'start-reset'() { captureSetup(); SETUP.start = null; renderSetup(); },
  async create() {
    captureSetup();
    const players = Array.from({ length: SETUP.n }, (_, i) => ({ name: (SETUP.names[i] || `Player ${i + 1}`).trim().slice(0, 30), color: SETUP.colors[i] || RR.PLAYER_COLORS[i], cityName: (SETUP.names[`c${i}`] || '').trim().slice(0, 40) || undefined }));
    const S = Engine.newGame({ players, seed: SETUP.seed || undefined, name: SETUP.game || CONFIG.title, mapType: SETUP.mapType, tilesPerPlayer: SETUP.tpp, start: SETUP.start || undefined });
    UI.bundle = { state: S, pending: {} }; UI._d = null; UI.views = {}; UI.sel = null; UI.tab = 'map';
    if (!UI.locked) UI.me = 0;
    try { await Sync.publish(UI.bundle); } catch (e) { toast(`Created locally, but could not publish: ${e.message}`); }
    render();
  },
};

/* =====================================================================
   START
   ===================================================================== */
async function boot() {
  const params = new URLSearchParams(location.search);
  if (params.has('player')) { UI.me = Math.max(0, Number(params.get('player')) - 1); UI.locked = true; }
  try { UI.bundle = await Sync.load(); } catch (e) { UI.loadError = e.message; UI.bundle = null; }
  if (UI.bundle && UI.bundle.state) Engine.migrate(UI.bundle.state);
  if (UI.bundle && !UI.bundle.state) UI.bundle = null;
  if (UI.bundle) UI.bundle.pending = UI.bundle.pending || {};
  render();
  if (Sync.mode !== 'local' && CONFIG.POLL_SECONDS > 0) {
    setInterval(async () => {
      if (!UI.bundle || document.hidden) return;
      try {
        const b = await Sync.load();
        if (!b || !b.state) return;
        Engine.migrate(b.state);
        const changed = b.state.turn !== st().turn || JSON.stringify(Object.keys(b.pending || {})) !== JSON.stringify(Object.keys(UI.bundle.pending || {}));
        if (changed) { const turnChanged = b.state.turn !== st().turn; UI.bundle = Object.assign({ pending: {} }, b); if (turnChanged) { UI._d = null; UI.sel = null; toast(`Turn ${st().turn} is ready`); } render(); }
      } catch (e) { /* offline; try again later */ }
    }, CONFIG.POLL_SECONDS * 1000);
  }
}
if (typeof window !== 'undefined') window.addEventListener('DOMContentLoaded', boot);

</script>
</body>
